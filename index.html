<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O FIM — Arquivo de Personagens</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');
:root{--bg:#10100f;--panel:#191917;--line:#34322d;--text:#efede6;--muted:#a5a194;--dim:#757167;--red:#d84b3e;--gold:#d6b36a;--green:#8eb899;--mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;--serif:'Playfair Display',serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px var(--sans)}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:236px 1fr;min-height:100vh}.side{background:#141412;border-right:1px solid #292822;padding:25px 17px;display:flex;flex-direction:column;gap:27px}.brand{display:flex;gap:11px;align-items:center;padding:0 8px}.logo{width:37px;height:37px;display:grid;place-items:center;border-radius:10px;background:var(--red);font:700 20px var(--serif)}.brand b{font:700 14px var(--mono);letter-spacing:.13em}.brand small{display:block;color:var(--dim);font:9px var(--mono);margin-top:4px}.label{padding:0 10px;margin-bottom:8px;color:var(--dim);font:10px var(--mono);letter-spacing:.15em}.nav{display:grid;gap:4px}.nav button{background:transparent;border:0;border-radius:8px;text-align:left;padding:10px;color:#aaa79c}.nav button:hover,.nav button.active{background:#29211e;color:white;box-shadow:inset 2px 0 var(--red)}.sidefoot{margin-top:auto;color:var(--muted);font-size:11px;line-height:1.6;padding:13px;border:1px solid var(--line);border-radius:11px}.sidefoot strong{color:var(--gold);font:11px var(--mono)}.main{min-width:0}.top{height:65px;border-bottom:1px solid #292822;padding:0 clamp(18px,4vw,54px);display:flex;justify-content:space-between;align-items:center;color:var(--dim);font:10px var(--mono);letter-spacing:.1em}.top button{background:transparent;border:0;color:var(--muted);font-size:12px}.content{max-width:1450px;margin:auto;padding:32px clamp(18px,4vw,54px) 60px}.eyebrow{font:10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:#f17d68}.heading{display:flex;justify-content:space-between;gap:15px;align-items:end;margin:9px 0 24px}.heading h1{font:700 clamp(28px,4vw,40px) var(--serif);margin:0}.heading p{margin:7px 0 0;color:var(--muted)}.btn{background:#24231f;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 13px;font-size:12px;font-weight:600}.btn:hover{border-color:#796451}.primary{background:var(--red);border-color:var(--red);color:white}.danger{color:#f18a7e;border-color:#70443e}.small{padding:6px 9px;font-size:10px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:linear-gradient(145deg,#1c1b18,#161614);border:1px solid #312f2a;border-radius:12px;padding:16px;min-height:145px}.click{cursor:pointer}.card.click:hover{border-color:#705044;transform:translateY(-2px)}.cardtop{display:flex;justify-content:space-between;align-items:flex-start}.initial{width:40px;height:40px;display:grid;place-items:center;background:#31231f;color:#e88a76;border-radius:10px;font:700 17px var(--serif)}.tag{font:9px var(--mono);color:var(--gold);border:1px solid #514837;border-radius:20px;padding:5px 8px;text-transform:uppercase}.card h3{font:600 19px var(--serif);margin:13px 0 4px}.muted{color:var(--muted);font-size:12px}.pills{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}.pill{font:9px var(--mono);color:#b5b0a4;background:#24231f;border:1px solid #36342f;padding:5px 7px;border-radius:5px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:18px 0}.toolbar input{width:min(360px,100%);background:var(--panel);color:var(--text);border:1px solid var(--line);padding:10px;border-radius:8px}.empty{border:1px dashed #444139;padding:40px;text-align:center;color:var(--muted);border-radius:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:0 0 18px}.stat{background:var(--panel);border:1px solid #2e2c27;border-radius:9px;padding:13px}.stat small{color:var(--dim);font:9px var(--mono);text-transform:uppercase}.stat b{display:block;font:700 22px var(--serif);margin-top:5px}.subtabs{display:flex;gap:7px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin:15px 0}.subtabs button{border:1px solid var(--line);border-radius:18px;background:transparent;color:var(--muted);font:10px var(--mono);padding:7px 11px}.subtabs button.active{background:#30221f;border-color:#875148;color:#f2a194}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}.table th{font:9px var(--mono);color:var(--dim);text-transform:uppercase}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0 14px}.tabs button{background:#1b1a17;border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--muted);font:10px var(--mono)}.tabs button.active{background:#31221e;color:#f2a194;border-color:#875148}.meters,.attributes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.meter,.attribute,.bio,.itemcard,.abilitycard,.spellcard{border:1px solid var(--line);background:#1b1a18;border-radius:9px;padding:12px}.meter span,.bio small{font:9px var(--mono);color:var(--muted);text-transform:uppercase}.meter strong{float:right;font:15px var(--mono)}.bar{height:4px;background:#3a3831;border-radius:4px;margin-top:10px}.bar i{display:block;height:100%;background:var(--red);border-radius:4px;width:var(--fill)}.attributes{grid-template-columns:repeat(7,1fr)}.attribute{text-align:center}.attribute small{display:block;font:9px var(--mono);color:var(--muted)}.attribute b{display:block;font:18px var(--serif);margin-top:5px}.sectiontitle{font:10px var(--mono);letter-spacing:.13em;color:var(--gold);text-transform:uppercase;margin:20px 0 10px}.bio-grid,.itemgrid,.abilitygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.bio p{white-space:pre-wrap;font-size:12px;line-height:1.5;color:#cecabe;margin:7px 0 0}.itemcard h4,.abilitycard h4,.spellcard h4{font:16px var(--serif);margin:0 0 7px}.iconbtn{background:transparent;color:var(--muted);border:0;padding:4px}.overload{border:1px solid #9b4d3e;background:#3a211e;padding:10px;border-radius:8px;color:#f2a194;font-size:12px;margin:10px 0}.tree{border:1px solid #3c3932;padding:18px;border-radius:12px;min-height:210px;background:radial-gradient(ellipse at center,#392c2730,transparent 70%),#141412}.tree-node{border:1px solid #665546;background:#23201c;border-radius:9px;padding:12px;margin:8px 0 8px 23px;position:relative}.tree-node:before{content:'';position:absolute;left:-15px;top:22px;width:12px;border-top:1px solid #796a54}.style-spectral{--gold:#bcb8ef;background:radial-gradient(ellipse at top,#8a83e622,transparent 60%),#141318}.style-experiment{--red:#d37b64;background:repeating-linear-gradient(145deg,#171513,#171513 9px,#1b1715 10px,#171513 12px)}.style-victim{--gold:#59c9db;background:radial-gradient(ellipse at center,#268a9b22,transparent 65%),#111719}.style-mutant{--gold:#99c583;background:radial-gradient(ellipse at bottom,#497d3838,transparent 65%),#151914}.style-scroll{background:linear-gradient(135deg,#302616,#1b1814)}.style-bruxo{background:radial-gradient(ellipse at top,#7f1d3825,transparent 65%),#191217}.style-mago{background:radial-gradient(ellipse at center,#45885a25,#171714)}.style-clerigo{background:repeating-linear-gradient(90deg,#262622,#262622 14px,#2d2c27 15px,#262622 17px)}.style-militar{background:linear-gradient(135deg,#30302a,#191a18)}.style-formado{background:linear-gradient(135deg,#302b24,#191816)}.style-arrependido{background:#151413}.style-investigador{background:linear-gradient(135deg,#242427,#171719)}.rulesgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.ruleblock{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:15px}.ruleblock h3{font:17px var(--serif);margin:0 0 8px}.ruleblock p,.ruleblock li{color:#c9c5b9;font-size:12px;line-height:1.55}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:9}.modal.show{display:flex}.modalbox{width:min(760px,100%);max-height:92vh;overflow:auto;background:#191917;border:1px solid #403d35;border-radius:14px}.modalhead{position:sticky;top:0;background:#191917f5;display:flex;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);z-index:2}.modalhead h2{font:20px var(--serif);margin:0}.modalbody{padding:17px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:10px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid #39372f;border-radius:7px;background:#121210;color:var(--text)}.field textarea{min-height:72px;resize:vertical}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.toast{position:fixed;right:18px;bottom:18px;background:#24231f;border:1px solid #575044;padding:11px 14px;border-radius:8px;z-index:12;opacity:0;transition:.2s}.toast.show{opacity:1}.auth{max-width:380px;margin:9vh auto;padding:24px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.auth h1{font:26px var(--serif)}.auth .field{margin:10px 0}.err{color:#f18a7e;font-size:11px;margin:8px 0}.link{color:var(--gold);background:none;border:0;text-decoration:underline}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.layout{grid-template-columns:1fr}.side{padding:10px 12px;position:sticky;top:0;z-index:3;flex-direction:row;align-items:center;gap:10px}.side .brand{display:none}.side .label,.sidefoot{display:none}.nav{display:flex;overflow:auto;width:100%}.nav button{white-space:nowrap;padding:8px}.top{height:52px}.heading{align-items:flex-start;flex-direction:column}.cards{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.meters{grid-template-columns:1fr}.attributes{grid-template-columns:repeat(4,1fr)}.bio-grid,.itemgrid,.abilitygrid,.rulesgrid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:span 1}}
</style></head><body><div id="app"></div><div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div><div id="toast" class="toast"></div><script>
const $=id=>document.getElementById(id),ATTRS=[['DES','Destreza'],['TEC','Técnica'],['COR','Corpo'],['CHA','Charme'],['PER','Perspicácia'],['CON','Conhecimento'],['RAC','Raciocínio']],SKILLS={DES:['Acrobacia','Furto','Escalagem','Esquiva'],TEC:['Disparo','Furtividade','Luta','Manobra'],COR:['Força','Intimidação','Metabolismo','Proteção'],CHA:['Adestramento','Diplomacia','Flerte','Lábia','Performance'],PER:['Audição','Percepção','Intuição','Detecção'],CON:['Ciências','Conserto','História','Informações','Linguística','Medicina','Oculto','Pilotagem','Religião','Sobrevivência'],RAC:['Coragem','Cura','Investigação','Navegação','Tática','Tecnologia']},NAMES=Object.fromEntries(ATTRS);
let me=null,sheets=[],campaigns=[],homebrew=[],view='sheets',sheet=null,campaign=null,specialTab='overview',ruleTab='create',authMode='login';
const CLASSNAMES={'Escolhido':'Bênçãos','Experimento':'Peculiaridades','Vítima':'Mutações','Mutante':'Dons','Explorador do Oculto':'Estudos','Bruxo':'Pactos','Mago':'Catalisadores','Clérigo':'Orações','Militar':'Treinamentos Militares','Formado':'Ocupações','Arrependido':'Frustrações','Investigador':'Análises'};
const $esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',body){let r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||'Erro ao comunicar com o servidor.');return d}
function notify(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2500)}
function role(f){return {'Linha de Frente':'Proativo','Desafiador':'Rastreador Nato','Retaguarda':'Diligente'}[f]||''}
function escJsonAttr(o){return $esc(JSON.stringify(o))}
function formModal(title,fields,save){$('modalbox').innerHTML='<header class="modalhead"><h2>'+title+'</h2><button type="button" class="iconbtn" onclick="closeModal()">×</button></header><form id="modalform" class="modalbody"><div class="formgrid">'+fields+'</div><div class="modalactions"><button class="btn" type="button" onclick="closeModal()">Cancelar</button><button class="btn primary">Guardar</button></div></form>';$('modal').classList.add('show');$('modalform').onsubmit=async e=>{e.preventDefault();try{await save(new FormData(e.target));closeModal();await refresh();render();notify('Guardado')}catch(err){notify(err.message)}}}
function closeModal(){$('modal').classList.remove('show')}
function field(label,name,val='',type='text',full=false){return '<div class="field '+(full?'full':'')+'"><label>'+label+'</label><input name="'+name+'" type="'+type+'" value="'+$esc(val)+'"></div>'}
function area(label,name,val='',full=true){return '<div class="field '+(full?'full':'')+'"><label>'+label+'</label><textarea name="'+name+'">'+$esc(val)+'</textarea></div>'}
function selectField(label,name,options,value){return '<div class="field"><label>'+label+'</label><select name="'+name+'">'+options.map(x=>'<option '+(x===value?'selected':'')+'>'+x+'</option>').join('')+'</select></div>'}
async function refresh(){let data=await api('sheets');sheets=data.sheets;data=await api('campaigns');campaigns=data.campaigns;data=await api('homebrew');homebrew=data.homebrew}
function shell(content){$('app').innerHTML='<div class="layout"><aside class="side"><div class="brand"><div class="logo">F</div><div><b>O FIM</b><small>ARQUIVO DE PERSONAGENS</small></div></div><div><div class="label">MESA</div><nav class="nav">'+[['sheets','▦ Fichas'],['campaigns','⚑ Campanhas'],['homebrew','✦ Homebrew'],['rules','☷ Regras']].map(x=>'<button data-view="'+x[0]+'" class="'+(view===x[0]?'active':'')+'">'+x[1]+'</button>').join('')+'</nav></div><div class="sidefoot"><strong>O FIM: RPG</strong><p>Heróis de muitas dimensões. Uma realidade prestes a acabar.</p></div></aside><main class="main"><header class="top">O FIM <span>/</span> '+({sheets:'FICHAS',campaigns:'CAMPANHAS',homebrew:'HOMEBREW',rules:'REGRAS'}[view])+'<button id="logout">'+$esc(me.name)+' · Sair</button></header><div class="content">'+content+'</div></main></div>';$('app').querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;sheet=null;campaign=null;campaignFrom=false;render()});$('logout').onclick=async()=>{await api('logout','POST',{});me=null;render()}}
function authView(){ $('app').innerHTML='<main class="auth"><div class="eyebrow">O FIM: RPG</div><h1>'+ (authMode==='login'?'Entre no arquivo':'Crie sua conta')+'</h1><p class="muted">Fichas, campanhas e criações salvas na sua conta.</p><form id="authform">'+(authMode==='register'?'<div class="field"><label>Nome</label><input name="name" required></div>':'')+'<div class="field"><label>E-mail</label><input name="email" type="email" required></div><div class="field"><label>Senha · mínimo 8 caracteres</label><input name="password" type="password" minlength="8" required></div><p id="autherr" class="err"></p><button class="btn primary" style="width:100%">'+(authMode==='login'?'Entrar':'Criar conta')+'</button></form><p class="muted">'+(authMode==='login'?'Ainda não tem conta?':'Já tem conta?')+' <button class="link" id="switchauth">'+(authMode==='login'?'Criar conta':'Entrar')+'</button></p></main>';$('switchauth').onclick=()=>{authMode=authMode==='login'?'register':'login';render()};$('authform').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));try{let r=await api(authMode==='login'?'login':'register','POST',d);me=r.user;await afterLogin()}catch(err){$('autherr').textContent=err.message}}}
async function afterLogin(){await refresh();const token=new URLSearchParams(location.search).get('join');if(token){try{await api('join','POST',{token});history.replaceState({},'',location.pathname);await refresh();view='campaigns';notify('Você entrou na campanha')}catch(err){notify(err.message)}}render()}
async function render(){if(!me)return authView();if(!sheets.length&& !campaigns.length && !homebrew.length){try{await refresh()}catch(err){$('app').innerHTML='<p class="auth err">'+err.message+'</p>';return}}if(sheet){shell(renderSheet());return}if(campaign){shell(renderCampaign());return}shell(view==='sheets'?renderSheets():view==='campaigns'?renderCampaigns():view==='homebrew'?renderHomebrew():renderRules())}
function renderSheets(){let total=sheets.length;return '<div class="eyebrow">Seu arquivo pessoal</div><div class="heading"><div><h1>Minhas fichas</h1><p>Personagens que você criou. Adicione uma ficha às campanhas quando quiser.</p></div><button id="createSheet" class="btn primary">＋ Nova ficha</button></div><div class="stats"><div class="stat"><small>Total</small><b>'+total+'</b></div>'+['Herdeiro','Feiticeiro','Especialista'].map(a=>'<div class="stat"><small>'+a+'</small><b>'+sheets.filter(c=>c.archetype===a).length+'</b></div>').join('')+'</div><div class="cards">'+(sheets.length?sheets.map(c=>'<article class="card click" data-sheet="'+$esc(c.id)+'"><div class="cardtop"><div class="initial">'+$esc((c.name||'?')[0])+'</div><span class="tag">'+$esc(c.archetype)+'</span></div><h3>'+$esc(c.name)+'</h3><div class="muted">'+$esc(c.className||'')+' · '+$esc(c.function||'')+'</div><div class="pills"><span class="pill">NÍVEL '+$esc(c.level||0)+'</span></div></article>').join(''):'<div class="empty">Ainda não há fichas. Crie a primeira para começar.</div>')+'</div>'}
function createSheet(){let fields=field('Nome','name','','text',true)+field('Idade','age')+selectField('Arquétipo','archetype',['Herdeiro','Feiticeiro','Especialista'],'Herdeiro')+selectField('Classe / subclasse','className',Object.keys(CLASSNAMES),'Escolhido')+selectField('Função','function',['Linha de Frente','Desafiador','Retaguarda'],'Linha de Frente')+field('Nível','level',1,'number')+field('Alinhamento','alignment')+field('Saúde atual / máxima','health','')+field('Resistência atual / máxima','resistance','')+field('Stamina atual / máxima','stamina','')+field('Defesa','defense',6,'number')+area('Aparência','appearance')+area('Personalidade','personality')+area('Objetivo','objective')+area('Valores morais','moral')+area('História','backstory')+area('Notas','notes');formModal('Criar ficha',fields,async d=>{let c={name:d.get('name'),age:d.get('age'),archetype:d.get('archetype'),className:d.get('className'),function:d.get('function'),level:+d.get('level')||1,alignment:d.get('alignment'),health:d.get('health'),resistance:d.get('resistance'),stamina:d.get('stamina'),defense:+d.get('defense')||6,appearance:d.get('appearance'),personality:d.get('personality'),objective:d.get('objective'),moral:d.get('moral'),backstory:d.get('backstory'),notes:d.get('notes'),attrs:{},skills:{},items:[],abilities:[],powers:[],spells:[],practices:[],inventory:{limit:0,bonus:0}};let r=await api('sheets','POST',{sheet:c});sheet=r.sheet;sheet.ownerId=me.id})}
function sheetTab(){return '<div class="tabs">'+[['overview','Resumo'],['inventory','Inventário'],['abilities','Habilidades'],['special',specialName(sheet)]].map(x=>'<button class="'+(specialTab===x[0]?'active':'')+'" data-stab="'+x[0]+'">'+$esc(x[1])+'</button>').join('')+'</div>'}
function specialName(c){if(c.archetype==='Herdeiro')return CLASSNAMES[c.className]||'Poderes';if(c.archetype==='Feiticeiro')return 'Feitiços';return CLASSNAMES[c.className]||'Práticas e Conhecimentos'}
function renderSheet(){return '<div class="eyebrow">Ficha de personagem</div><div class="heading"><div><h1>'+$esc(sheet.name)+'</h1><p>'+$esc(sheet.className)+' · '+$esc(sheet.archetype)+' · '+$esc(sheet.function)+' · nível '+$esc(sheet.level)+'</p></div><div><button class="btn" id="backSheets">← Fichas</button> <button class="btn" id="editSheet">Editar</button></div></div>'+sheetTab()+(specialTab==='overview'?overview():specialTab==='inventory'?inventoryView():specialTab==='abilities'?abilitiesView():specialView())}
function overview(){let groups=[['Aparência',sheet.appearance],['Personalidade',sheet.personality],['Objetivo',sheet.objective],['Valores morais',sheet.moral],['História',sheet.backstory],['Notas',sheet.notes]].filter(x=>x[1]);return '<div class="meters">'+[['Saúde',sheet.health],['Resistência',sheet.resistance],['Stamina',sheet.stamina]].map(([n,v])=>'<div class="meter"><span>'+n+'</span><strong>'+$esc(v||'—')+'</strong></div>').join('')+'</div><div class="sectiontitle">Atributos</div><div class="attributes">'+ATTRS.map(([k,n])=>'<div class="attribute"><small>'+k+' · '+n+'</small><b>'+$esc(sheet.attrs?.[k]??0)+'</b></div>').join('')+'</div><div class="sectiontitle">Identidade</div><div class="pills"><span class="pill">IDADE '+$esc(sheet.age||'—')+'</span><span class="pill">ALINHAMENTO '+$esc(sheet.alignment||'—')+'</span><span class="pill">DEFESA '+$esc(sheet.defense||'—')+'</span></div><div class="bio-grid" style="margin-top:14px">'+groups.map(([n,v])=>'<div class="bio"><small>'+n+'</small><p>'+$esc(v)+'</p></div>').join('')+'</div>'}
async function persistSheet(){let r=await api('sheet/'+encodeURIComponent(sheet.id),'POST',{sheet});sheet=r.sheet}
function inventoryStats(){let force=Number(sheet.skills?.Força||0),bonus=Number(sheet.inventory?.bonus||0),base=Number(sheet.inventory?.limit||0)||8+6*force+bonus,total=(sheet.items||[]).reduce((a,x)=>a+(Number(x.weight)||0)*(Number(x.quantity)||1),0);return {force,bonus,base,total,pct:base?total/base:0}}
function inventoryView(){let s=inventoryStats(),over=s.pct>1.5?'Carga em 150% ou mais: não pode carregar itens adicionais, deslocamento cai para 1 m e testes físicos recebem −2.':s.pct>1?'Acima do limite: deslocamento reduzido à metade e sem reação a ataques.':'';return '<div class="heading"><div><h2>Inventário</h2><p class="muted">Capacidade-base: 8 + (6 × Força) espaços; bolsas podem aumentar o limite.</p></div><button class="btn" id="inventorySettings">Ajustar limite</button></div><div class="stats"><div class="stat"><small>Ocupado</small><b>'+s.total.toFixed(1)+'</b></div><div class="stat"><small>Limite</small><b>'+s.base.toFixed(1)+'</b></div><div class="stat"><small>Força</small><b>'+s.force+'</b></div><div class="stat"><small>Durabilidade</small><b>Rastreadas</b></div></div>'+(over?'<div class="overload">'+over+'</div>':'')+'<div class="toolbar"><span class="muted">'+(sheet.items||[]).length+' itens</span><button class="btn primary" id="addItem">＋ Criar item</button></div><div class="itemgrid">'+(sheet.items||[]).map((x,i)=>'<article class="itemcard"><div class="cardtop"><span class="tag">'+$esc(x.category||'Item')+'</span><button class="iconbtn" data-edititem="'+i+'">Editar</button></div><h4>'+$esc(x.name)+'</h4><p class="muted">'+$esc(x.description||x.effects||'')+'</p><div class="pills"><span class="pill">PESO '+$esc(x.weight||0)+' × '+$esc(x.quantity||1)+'</span><span class="pill">DUR. '+$esc(x.durability||'—')+'/'+$esc(x.durMax||'—')+'</span><span class="pill">CUSTO '+$esc(x.cost||'—')+'</span></div><div class="pills"><span class="pill">'+$esc(x.damage||'—')+'</span><span class="pill">'+$esc(x.range||'')+'</span><span class="pill">'+$esc(x.damageType||'')+'</span></div><button class="iconbtn" data-delitem="'+i+'">Remover</button></article>').join('')||'<div class="empty">Seu inventário está vazio.</div>')+'</div>'}
function abilitiesView(){let list=sheet.abilities||[];return '<div class="heading"><div><h2>Habilidades</h2><p>Registre habilidades por origem e tipo.</p></div><button class="btn primary" id="newAbility">＋ Adicionar habilidade</button></div><div class="abilitygrid">'+(list.map((x,i)=>'<article class="abilitycard"><div class="cardtop"><span class="tag">'+$esc(x.type||'Outro')+'</span><button class="iconbtn" data-delability="'+i+'">×</button></div><h4>'+$esc(x.name)+'</h4><p class="muted">'+$esc(x.description)+'</p><div class="pills"><span class="pill">'+$esc(x.source||sheet.className)+'</span><span class="pill">NÍVEL '+$esc(x.level||'—')+'</span></div></article>').join('')||'<div class="empty">Nenhuma habilidade registrada.</div>')+'</div>'}
function themeClass(c){let s=(c.className||'').toLowerCase();if(s.includes('escolhido'))return 'style-spectral';if(s.includes('experimento'))return 'style-experiment';if(s.includes('vítima')||s.includes('vitima'))return 'style-victim';if(s.includes('mutante'))return 'style-mutant';if(s.includes('explorador'))return 'style-scroll';if(s.includes('bruxo'))return 'style-bruxo';if(s.includes('mago'))return 'style-mago';if(s.includes('clérigo')||s.includes('clerigo'))return 'style-clerigo';if(s.includes('militar'))return 'style-militar';if(s.includes('formado'))return 'style-formado';if(s.includes('arrependido'))return 'style-arrependido';if(s.includes('investigador'))return 'style-investigador';return ''}
function specialView(){let cls=themeClass(sheet);if(sheet.archetype==='Feiticeiro'){let xs=sheet.spells||[];return '<div class="heading"><div><h2>Feitiços</h2><p>Registre conjuração, requisitos e efeitos.</p></div><button class="btn primary" id="newSpell">＋ Novo feitiço</button></div><div class="abilitygrid '+cls+'">'+(xs.map((x,i)=>'<article class="spellcard '+cls+'"><div class="cardtop"><span class="tag">NÍVEL '+$esc(x.level||'—')+'</span><button class="iconbtn" data-delspell="'+i+'">×</button></div><h4>'+$esc(x.name)+'</h4><p class="muted">'+$esc(x.description)+'</p><div class="pills"><span class="pill">ETAPA '+$esc(x.stage||'—')+'</span><span class="pill">TEMPO '+$esc(x.time||'—')+'</span><span class="pill">ALCANCE '+$esc(x.range||'—')+'</span></div><p class="muted">Requisitos: '+$esc(x.requirements||'—')+'<br>Área: '+$esc(x.area||'—')+' · Alvos: '+$esc(x.targets||'—')+'<br>Efeito: '+$esc(x.effect||'—')+'</p></article>').join('')||'<div class="empty">Nenhum feitiço registrado.</div>')+'</div>'}
if(sheet.archetype==='Especialista'){let xs=sheet.practices||[];return '<div class="heading"><div><h2>'+$esc(specialName(sheet))+'</h2><p>Práticas e conhecimentos do personagem.</p></div><button class="btn primary" id="newPractice">＋ Adicionar prática</button></div><div class="abilitygrid '+cls+'">'+(xs.map((x,i)=>'<article class="abilitycard"><div class="cardtop"><span class="tag">'+$esc(x.category||'Conhecimento')+'</span><button class="iconbtn" data-delpractice="'+i+'">×</button></div><h4>'+$esc(x.name)+'</h4><p class="muted">'+$esc(x.description)+'</p></article>').join('')||'<div class="empty">Nenhuma prática ou conhecimento registrado.</div>')+'</div>'}
let p=sheet.power||{},nodes=sheet.powers||[];return '<div class="heading"><div><h2>'+$esc(specialName(sheet))+'</h2><p>Árvore do poder único: comece pela habilidade-base e expanda seus usos.</p></div><button class="btn" id="editPower">Editar habilidade-base</button></div><div class="tree '+cls+'"><div class="tree-node"><span class="tag">PODER ÚNICO · BASE</span><h3>'+$esc(p.name||'Habilidade-base ainda sem nome')+'</h3><p class="muted">'+$esc(p.description||'Defina aqui o poder único do herdeiro e os seus usos conhecidos.')+'</p></div>'+nodes.map((x,i)=>'<div class="tree-node"><div class="cardtop"><span class="tag">'+$esc(x.kind||'Expansão')+'</span><button class="iconbtn" data-delpoder="'+i+'">×</button></div><h4>'+$esc(x.name)+'</h4><p class="muted">'+$esc(x.description)+'</p><small class="muted">Usos: '+$esc(x.uses||'—')+' · Pré-requisito: '+$esc(x.parent||p.name||'Base')+'</small></div>').join('')+'</div><div class="toolbar"><span class="muted">'+nodes.length+' expansões</span><button class="btn primary" id="newPower">＋ Expandir árvore</button></div><p class="muted">Habilidades de classe ficam na aba Habilidades; esta árvore acompanha o desenvolvimento do poder único.</p>'}
function renderCampaigns(){return '<div class="eyebrow">Jogo compartilhado</div><div class="heading"><div><h1>Campanhas</h1><p>Campanhas em que você participa. O criador é o mestre.</p></div><button class="btn primary" id="createCampaign">＋ Criar campanha</button></div><div class="toolbar"><button id="joinCampaign" class="btn">Entrar com link de convite</button></div><div class="cards">'+(campaigns.map(c=>'<article class="card click" data-campaign="'+$esc(c.id)+'"><div class="cardtop"><span class="tag">'+(c.role==='gm'?'MESTRE':'JOGADOR')+'</span><span class="pill">ABRIR →</span></div><h3>'+$esc(c.name)+'</h3><p class="muted">'+$esc(c.description||'Sem descrição.')+'</p></article>').join('')||'<div class="empty">Você ainda não participa de campanhas.</div>')+'</div>'}
async function openCampaign(id){let d=await api('campaign/'+encodeURIComponent(id));campaign=d;view='campaigns';render()}
function renderCampaign(){let c=campaign.campaign,gm=c.role==='gm';return '<div class="eyebrow">Campanha · '+(gm?'Mestre':'Jogador')+'</div><div class="heading"><div><h1>'+$esc(c.name)+'</h1><p>'+$esc(c.description||'')+'</p></div><button id="backCampaigns" class="btn">← Campanhas</button></div><div class="toolbar">'+(gm?'<button class="btn" id="editCampaign">Editar campanha</button><button class="btn" id="copyInvite">Copiar convite</button><button class="btn" id="revokeInvite">Gerar novo convite</button><button class="btn danger" id="deleteCampaign">Excluir campanha</button>':'')+'</div><div class="sectiontitle">Participantes · '+campaign.members.length+'</div><div class="cards">'+campaign.members.map(m=>'<article class="card"><div class="cardtop"><span class="tag">'+(m.role==='gm'?'MESTRE':'JOGADOR')+'</span>'+(gm&&m.id!==me.id?'<button class="btn small danger" data-kick="'+$esc(m.id)+'">Remover</button>':'')+'</div><h3>'+$esc(m.name)+'</h3></article>').join('')+'</div><div class="sectiontitle">Agentes da campanha</div><div class="toolbar"><button id="attachSheet" class="btn primary">＋ Adicionar uma das minhas fichas</button></div><div class="cards">'+campaign.sheets.map(s=>'<article class="card click" data-campsheet="'+$esc(s.id)+'"><div class="cardtop"><div class="initial">'+$esc((s.name||'?')[0])+'</div><span class="tag">'+$esc(s.archetype)+'</span></div><h3>'+$esc(s.name)+'</h3><div class="muted">'+$esc(s.className)+' · nível '+$esc(s.level)+'</div><div class="pills"><span class="pill">'+(s.ownerId===me.id?'SUA FICHA':'FICHA DE JOGADOR')+'</span></div></article>').join('')||'<div class="empty">Nenhum agente foi adicionado à campanha.</div>'+'</div>'}
function renderHomebrew(){return '<div class="eyebrow">Criações da mesa</div><div class="heading"><div><h1>Catálogo Homebrew</h1><p>Crie conteúdo para suas fichas e campanhas.</p></div><button class="btn primary" id="newHomebrew">＋ Criar homebrew</button></div><div class="subtabs"><button class="active">Tudo</button><span class="muted">Itens · Habilidades · Feitiços · Práticas</span></div><div class="cards">'+(homebrew.map(x=>'<article class="card"><div class="cardtop"><span class="tag">'+$esc(x.type||'Criação')+'</span><button class="iconbtn" data-delhomebrew="'+$esc(x.id)+'">×</button></div><h3>'+$esc(x.name)+'</h3><p class="muted">'+$esc(x.description||'')+'</p><span class="pill">'+$esc(x.scope||'Pessoal')+'</span></article>').join('')||'<div class="empty">Seu catálogo ainda está vazio.</div>')+'</div>'}
function renderRules(){let create=ruleTab==='create';return '<div class="eyebrow">Livro do Jogador</div><div class="heading"><div><h1>Regras de O FIM</h1><p>Consulta rápida para criar personagens e jogar.</p></div></div><div class="tabs"><button class="'+(create?'active':'')+'" data-rule="create">Criação de fichas</button><button class="'+(!create?'active':'')+'" data-rule="general">Regras gerais</button></div>'+(create?'<div class="rulesgrid"><article class="ruleblock"><h3>Conceito e identidade</h3><p>Defina nome, idade, aparência, personalidade, objetivo, alinhamento, história e valores morais.</p></article><article class="ruleblock"><h3>Atributos</h3><p>Distribua 5 pontos de atributo; a função concede mais 1. Um atributo pode cair a −1 para receber 1 ponto adicional. O limite aumenta nos níveis 7, 15, 21, 25 e 29.</p></article><article class="ruleblock"><h3>Arquétipos</h3><ul><li>Herdeiro: +1 Saúde e +1 Stamina por nível; 2 perícias sociais e 2 físicas.</li><li>Feiticeiro: +2 Stamina por nível; 3 perícias mentais e 1 social.</li><li>Especialista: +2 Saúde por nível; 1 perícia mental, 1 física e 2 à escolha.</li></ul></article><article class="ruleblock"><h3>Função</h3><p>Linha de Frente concede +1 Corpo e perfil Proativo; Desafiador concede +1 Técnica e perfil Rastreador Nato; Retaguarda concede +1 Raciocínio e perfil Diligente.</p></article><article class="ruleblock"><h3>Perícias</h3><p>Escolha perícias dentro dos grupos de atributos. Bônus iniciais podem ser +1 ou +2; os limites máximos sobem nos níveis 8, 15, 23 e 28.</p></article><article class="ruleblock"><h3>Progressão</h3><p>O nível distribui melhorias de atributo, perícia, vantagens de classe, poderes de função e técnicas de subclasse. Consulte a tabela de progressão do capítulo de classes para o avanço completo.</p></article></div>':'<div class="rulesgrid"><article class="ruleblock"><h3>Testes</h3><p>Role d8 para testes muito difíceis, d10 para situações complicadas e d12 para testes normais. Some o modificador do atributo e o da perícia. DIF 7 é comum.</p></article><article class="ruleblock"><h3>Dificuldades</h3><p>Muito trivial 4; fácil 5–6; regular 7–8; desafio moderado 9–10; difícil 11–12; exigente 13–14; extremo 15–17; quase impossível 18–20; cósmico 21+.</p></article><article class="ruleblock"><h3>Testes opostos</h3><p>Ambas as partes rolam; o maior resultado vence. Em empate, vence quem ataca.</p></article><article class="ruleblock"><h3>Críticos</h3><p>Para crítico, tire o máximo do dado e depois 7 ou mais em outro dado igual. Ao tirar 1, role novamente: resultado ímpar causa falha crítica.</p></article><article class="ruleblock"><h3>Medidores</h3><p>Saúde representa dano físico; Resistência mede defesa e reação; Stamina sustenta ações. Os valores máximos dependem de nível, arquétipo e função.</p></article><article class="ruleblock"><h3>Inventário</h3><p>Limite-base: 8 + (6 × Força). Acima do limite, deslocamento cai à metade e o personagem não reage; em 150%, deslocamento fica em 1 m e testes físicos sofrem −2. Abaixo de 50% de durabilidade, dano ou efeito cai pela metade; abaixo de 10%, o item não pode ser usado; em 0%, não pode ser reparado.</p></article><article class="ruleblock"><h3>Itens</h3><p>O livro registra categoria, peso, durabilidade, custo e efeitos. A venda vale 50% do preço de compra. Armas podem incluir dano, alcance, tipo de dano, munição e recarga.</p></article><article class="ruleblock"><h3>Referência completa</h3><p>Use esta página como resumo inicial. A versão completa e atualizada das regras pode ser ligada ao capítulo correspondente do Livro do Jogador.</p></article></div>')}
function editSheetModal(){let f=field('Nome','name',sheet.name)+field('Idade','age',sheet.age)+selectField('Arquétipo','archetype',['Herdeiro','Feiticeiro','Especialista'],sheet.archetype)+selectField('Classe / subclasse','className',Object.keys(CLASSNAMES),sheet.className)+selectField('Função','function',['Linha de Frente','Desafiador','Retaguarda'],sheet.function)+field('Nível','level',sheet.level,'number')+field('Alinhamento','alignment',sheet.alignment)+field('Saúde atual / máxima','health',sheet.health)+field('Resistência atual / máxima','resistance',sheet.resistance)+field('Stamina atual / máxima','stamina',sheet.stamina)+field('Defesa','defense',sheet.defense,'number')+area('Aparência','appearance',sheet.appearance)+area('Personalidade','personality',sheet.personality)+area('Objetivo','objective',sheet.objective)+area('Valores morais','moral',sheet.moral)+area('História','backstory',sheet.backstory)+area('Notas','notes',sheet.notes);f+='<div class="field full"><label>Atributos (DES, TEC, COR, CHA, PER, CON, RAC)</label><input name="attrs" value="'+ATTRS.map(x=>Number(sheet.attrs?.[x[0]]||0)).join(',')+'"><small class="muted">Informe sete valores separados por vírgula, na ordem indicada.</small></div>';formModal('Editar ficha',f,async d=>{for(let k of ['name','age','archetype','className','function','alignment','health','resistance','stamina','appearance','personality','objective','moral','backstory','notes'])sheet[k]=d.get(k);sheet.level=+d.get('level')||0;sheet.defense=+d.get('defense')||0;sheet.attrs=Object.fromEntries(ATTRS.map((x,i)=>[x[0],Number(d.get('attrs').split(',')[i])||0]));await persistSheet()})}
function itemModal(old,index){let x=old||{},f=selectField('Categoria','category',['Arma corpo a corpo','Arma de disparo','Arma pesada','Explosivo','Ferramenta','Operacional','Armadura','Veículo','Consumível','Item mágico','Outro'],x.category||'Outro')+field('Nome','name',x.name)+field('Quantidade','quantity',x.quantity||1,'number')+field('Peso / espaços por unidade','weight',x.weight||0,'number')+field('Durabilidade atual','durability',x.durability||0,'number')+field('Durabilidade máxima','durMax',x.durMax||0,'number')+field('Preço','cost',x.cost)+field('Dano','damage',x.damage)+field('Alcance ou raio','range',x.range)+field('Tipo de dano','damageType',x.damageType)+field('Tipo de munição','ammoType',x.ammoType)+field('Munição atual / capacidade','ammo',x.ammo)+field('Recarga por ação','reload',x.reload)+field('Efeitos bônus','effects',x.effects,'text',true)+area('Descrição','description',x.description);formModal(old?'Editar item':'Criar item',f,async d=>{let v=Object.fromEntries(d);let item={...v,quantity:+v.quantity||1,weight:+v.weight||0,durability:+v.durability||0,durMax:+v.durMax||0};if(index==null)sheet.items.push(item);else sheet.items[index]=item;await persistSheet()})}
function abilityModal(){let f=selectField('Tipo','type',['Função','Investigação','Classe','Arquétipo','Outro'],'Outro')+field('Origem','source',sheet.className)+field('Nome','name')+field('Nível','level','','number')+area('Descrição e efeito','description','',true);formModal('Nova habilidade',f,async d=>{sheet.abilities=sheet.abilities||[];sheet.abilities.push(Object.fromEntries(d));await persistSheet()})}
function powerBaseModal(){let f=field('Nome da habilidade única','name',sheet.power?.name)+area('Descrição do poder','description',sheet.power?.description);formModal('Habilidade-base do poder',f,async d=>{sheet.power=Object.fromEntries(d);await persistSheet()})}
function powerModal(){let opts=['Habilidade-base',...(sheet.powers||[]).map(x=>x.name)];let f=field('Nome da expansão','name')+selectField('Pré-requisito','parent',opts,opts[0])+selectField('Tipo','kind',['Novo uso','Técnica','Evolução','Limitação','Outro'],'Novo uso')+field('Uso ou condição','uses')+area('Descrição detalhada','description');formModal('Expandir árvore do poder',f,async d=>{sheet.powers=sheet.powers||[];sheet.powers.push(Object.fromEntries(d));await persistSheet()})}
function spellModal(){let f=field('Nome','name')+field('Nível de feitiço','level','','number')+field('Etapa de conjuração','stage')+field('Tempo de conjuração','time')+field('Requisitos','requirements')+field('Alcance','range')+field('Área','area')+field('Alvos','targets')+area('Descrição','description')+area('Efeito','effect');formModal('Novo feitiço',f,async d=>{sheet.spells=sheet.spells||[];sheet.spells.push(Object.fromEntries(d));await persistSheet()})}
function practiceModal(){let f=field('Nome','name')+selectField('Categoria','category',['Prática','Conhecimento','Geral','Outro'],'Prática')+area('Descrição e usos','description');formModal('Nova prática ou conhecimento',f,async d=>{sheet.practices=sheet.practices||[];sheet.practices.push(Object.fromEntries(d));await persistSheet()})}
function createCampaign(){formModal('Criar campanha',field('Nome da campanha','name','','text',true)+area('Descrição','description'),async d=>{let r=await api('campaigns','POST',{name:d.get('name'),description:d.get('description')});view='campaigns';notify('Campanha criada. Gere ou copie o convite.')})}
function renderHomebrewModal(){let f=selectField('Tipo','type',['Item','Habilidade','Feitiço','Prática','Regra','Outro'],'Item')+field('Nome','name','','text',true)+area('Descrição','description')+field('Vincular a campanha (opcional)','campaign');formModal('Criar conteúdo Homebrew',f,async d=>{await api('homebrew','POST',{item:{name:d.get('name'),type:d.get('type'),description:d.get('description'),campaign:d.get('campaign')||null,scope:d.get('campaign')?'Campanha':'Pessoal'}})})}
function campaignInvite(){let url=location.origin+location.pathname+'?join='+encodeURIComponent(campaign.campaign.invite);navigator.clipboard.writeText(url).then(()=>notify('Convite copiado')).catch(()=>prompt('Copie este link:',url))}
function attachSheetModal(){if(!sheets.length)return notify('Crie uma ficha antes de adicionar agentes.');let f='<div class="field full"><label>Escolha uma das suas fichas</label><select name="sheet">'+sheets.map(x=>'<option value="'+$esc(x.id)+'">'+$esc(x.name)+' · '+$esc(x.archetype)+'</option>').join('')+'</select></div>';formModal('Adicionar agente à campanha',f,async d=>{await api('campaign/'+encodeURIComponent(campaign.campaign.id)+'/add-sheet','POST',{sheet:d.get('sheet')});await openCampaign(campaign.campaign.id)})}
function bindDelegated(){document.addEventListener('click',async e=>{let b=e.target.closest('button,[data-sheet],[data-campaign],[data-campsheet]');if(!b)return;try{
if(b.dataset.sheet){sheet=sheets.find(x=>x.id===b.dataset.sheet);specialTab='overview';campaign=null;campaignFrom=false;render();return}
if(b.dataset.campaign){await openCampaign(b.dataset.campaign);return}
if(b.dataset.campsheet){let s=campaign.sheets.find(x=>x.id===b.dataset.campsheet);sheet=s;campaignFrom=true;specialTab='overview';render();return}
if(b.dataset.stab){specialTab=b.dataset.stab;render();return}
if(b.dataset.rule){ruleTab=b.dataset.rule;render();return}
if(b.dataset.delitem!=null){sheet.items.splice(+b.dataset.delitem,1);await persistSheet();render();return}
if(b.dataset.edititem!=null){itemModal(sheet.items[+b.dataset.edititem],+b.dataset.edititem);return}
if(b.dataset.delability!=null){sheet.abilities.splice(+b.dataset.delability,1);await persistSheet();render();return}
if(b.dataset.delspell!=null){sheet.spells.splice(+b.dataset.delspell,1);await persistSheet();render();return}
if(b.dataset.delpractice!=null){sheet.practices.splice(+b.dataset.delpractice,1);await persistSheet();render();return}
if(b.dataset.delpoder!=null){sheet.powers.splice(+b.dataset.delpoder,1);await persistSheet();render();return}
if(b.dataset.delhomebrew){await api('homebrew/'+encodeURIComponent(b.dataset.delhomebrew),'DELETE');await refresh();render();return}
if(b.dataset.detach){if(confirm('Remover esta ficha da campanha? A ficha pessoal continua guardada.')){await api('campaign/'+campaign.campaign.id+'/remove-sheet','POST',{sheet:b.dataset.detach});await openCampaign(campaign.campaign.id)}return}
if(b.dataset.kick){if(confirm('Remover este participante e bloquear o acesso à campanha?')){await api('campaign/'+campaign.campaign.id+'/kick','POST',{user:b.dataset.kick});await openCampaign(campaign.campaign.id)}return}
if(b.id==='createSheet'){createSheet();return}
if(b.id==='editSheet'){editSheetModal();return}
if(b.id==='backSheets'){if(campaignFrom){campaignFrom=false;let id=campaign.campaign.id;sheet=null;await openCampaign(id)}else{sheet=null;render()}return}
if(b.id==='addItem'){itemModal();return}
if(b.id==='inventorySettings'){let f=field('Limite manual de espaços (0 usa fórmula)','limit',sheet.inventory?.limit||0,'number')+field('Espaços de bônus de bolsas e acessórios','bonus',sheet.inventory?.bonus||0,'number');formModal('Ajustar inventário',f,async d=>{sheet.inventory={limit:+d.get('limit')||0,bonus:+d.get('bonus')||0};await persistSheet()});return}
if(b.id==='newAbility'){abilityModal();return}
if(b.id==='editPower'){powerBaseModal();return}
if(b.id==='newPower'){powerModal();return}

function renderRules(){let create=ruleTab==='create';return '<div class="eyebrow">Livro do Jogador</div><div class="heading"><div><h1>Regras de O FIM</h1><p>Índice de consulta para criação e jogo.</p></div></div><div class="tabs"><button class="'+(create?'active':'')+'" data-rule="create">Criação de fichas</button><button class="'+(!create?'active':'')+'" data-rule="general">Regras gerais</button></div>'+(create?'<div class="rulesgrid"><article class="ruleblock"><h3>Conceito e identidade</h3><p>Nome, idade, aparência, personalidade, objetivo, alinhamento, história e valores morais.</p></article><article class="ruleblock"><h3>Atributos</h3><p>5 pontos iniciais +1 da função. Um atributo pode ser reduzido a −1 para receber 1 ponto. O limite aumenta nos níveis 7, 15, 21, 25 e 29.</p></article><article class="ruleblock"><h3>Arquétipos</h3><ul><li>Herdeiro: +1 Saúde e +1 Stamina por nível; 2 perícias sociais e 2 físicas.</li><li>Feiticeiro: +2 Stamina por nível; 3 perícias mentais e 1 social.</li><li>Especialista: +2 Saúde por nível; 1 mental, 1 física e 2 perícias à escolha.</li></ul></article><article class="ruleblock"><h3>Funções</h3><p>Linha de Frente: +1 Corpo e Proativo. Desafiador: +1 Técnica e Rastreador Nato. Retaguarda: +1 Raciocínio e Diligente. Cada função também altera os medidores por nível.</p></article><article class="ruleblock"><h3>Perícias</h3><p>Modificadores treinados agrupados por atributo. Bônus iniciais +1 ou +2; limites maiores nos níveis 8, 15, 23 e 28.</p></article><article class="ruleblock"><h3>Valores de nível 0</h3><p>Ser humano comum: Saúde 5 + Corpo; Resistência 4; Stamina 5; Defesa 6; 5 + RAC pontos de perícia.</p></article><article class="ruleblock"><h3>Progressão de nível</h3><p>Saúde, Resistência e Stamina crescem em faixas de níveis; arquétipo e função acrescentam seus próprios valores. A tabela de classe define atributos, perícias, vantagens, poderes de função e técnicas de subclasse.</p></article><article class="ruleblock"><h3>Classe e subclasse</h3><p>Herdeiros: Escolhido, Experimento, Vítima e Mutante. Feiticeiros: Explorador do Oculto, Bruxo, Mago e Clérigo. Especialistas: Militar, Formado, Arrependido e Investigador.</p></article></div>':'<div class="rulesgrid"><article class="ruleblock"><h3>Testes e dados</h3><p>d8 para situação difícil, d10 para teste complicado, d12 para teste normal. Some atributo e perícia. A categoria do dado pode subir ou descer passos.</p></article><article class="ruleblock"><h3>Dificuldades</h3><p>Muito trivial 4; fácil 5–6; regular 7–8; desafio moderado 9–10; difícil 11–12; exigente 13–14; extremo 15–17; quase impossível 18–20; cósmico 21+.</p></article><article class="ruleblock"><h3>Opostos, críticos e modificadores</h3><p>Em testes opostos, maior resultado vence; empate favorece quem ataca. Crítico: máximo no dado e depois 7+ num dado igual. No 1, role de novo: ímpar causa falha crítica. Vantagem rola dois dados e usa o maior; desvantagem usa o menor.</p></article><article class="ruleblock"><h3>Testes em equipe</h3><p>Teste auxiliado soma 1d4 + modificador ao teste principal. Teste conjunto resolve um objetivo comum; testes acumulados somam sucessos ou falhas definidos pelo mestre. Uma nova tentativa após falha pode custar outra ação e trazer consequências.</p></article><article class="ruleblock"><h3>Ações, habilidades e Stamina</h3><p>A habilidade indica o tipo de ação; se não indicar, é ação simples. Custos de Stamina, duração, recarga, condições e pré-requisitos acompanham cada habilidade. Habilidades passivas não consomem ação nem Stamina. Afinidade pode alterar custo, ação ou efeito.</p></article><article class="ruleblock"><h3>Saúde, Resistência e Stamina</h3><p>Com Saúde 0, pode ocorrer estado moribundo. Com Resistência abaixo da metade, Defender é limitado a uma vez por rodada; com 0, não pode Defender. Com Stamina 0, fica Vulnerável e Desgastado e não usa habilidades com custo.</p></article><article class="ruleblock"><h3>Lesões, sanidade e traumas</h3><p>Lesões são determinadas por 1d20 e podem causar sequelas graves. Sanidade acumula contadores; descanso completo remove 2. Ao exceder Coragem +8, o personagem fica enlouquecendo. Traumas também usam uma tabela de 1d20.</p></article><article class="ruleblock"><h3>Perigos</h3><p>O livro aborda fogo, água, quedas, pressão, temperatura, fumaça, veneno, eletricidade, explosões, desabamentos, gravidade e terreno árduo.</p></article><article class="ruleblock"><h3>Inventário e durabilidade</h3><p>Limite 8 + (6 × Força), com bônus de acessórios. Acima do limite: metade do deslocamento e sem reação. Em 150%: deslocamento 1 m, sem carregar mais e −2 em testes físicos. Abaixo de 50% da durabilidade, dano/efeito cai pela metade; abaixo de 10%, não usa; em 0%, não repara. Venda vale metade do preço.</p></article><article class="ruleblock"><h3>Consultar o livro completo</h3><p><a class="link" target="_blank" rel="noreferrer" href="https://docs.google.com/document/d/14mfc5KO6JHzqU6RHpNsd1zpVyaFfGEaI26N2NaVfFVU/edit">Abrir O FIM: RPG — Livro do Jogador</a></p></article></div>')}

function spellModal(){let f=field('Nome','name')+field('Nível do feitiço','level','','number')+field('Etapa de conjuração','stage')+field('Tempo de conjuração','time')+field('Custo de Stamina','stamina','','number')+field('Requisitos','requirements')+field('Alcance','range')+field('Área','area')+field('Alvos','targets')+field('Duração','duration')+field('Recarga','recharge')+area('Descrição','description')+area('Efeito','effect');formModal('Novo feitiço',f,async d=>{sheet.spells=sheet.spells||[];sheet.spells.push(Object.fromEntries(d));await persistSheet()})}
function renderRules(){let create=ruleTab==='create';return '<div class="eyebrow">Livro do Jogador</div><div class="heading"><div><h1>Regras de O FIM</h1><p>Índice de consulta para criação e jogo.</p></div></div><div class="tabs"><button class="'+(create?'active':'')+'" data-rule="create">Criação de fichas</button><button class="'+(!create?'active':'')+'" data-rule="general">Regras gerais</button></div>'+(create?'<div class="rulesgrid"><article class="ruleblock"><h3>Identidade</h3><p>Defina nome, idade, aparência, personalidade, objetivo, alinhamento, história e valores morais.</p></article><article class="ruleblock"><h3>Atributos</h3><p>5 pontos iniciais +1 da função. Um atributo pode ser reduzido a −1 para receber 1 ponto. O limite aumenta nos níveis 7, 15, 21, 25 e 29.</p></article><article class="ruleblock"><h3>Arquétipos</h3><ul><li>Herdeiro: +1 Saúde e +1 Stamina por nível; 2 perícias sociais e 2 físicas.</li><li>Feiticeiro: +2 Stamina por nível; 3 perícias mentais e 1 social.</li><li>Especialista: +2 Saúde por nível; 1 mental, 1 física e 2 perícias à escolha.</li></ul></article><article class="ruleblock"><h3>Funções</h3><p>Linha de Frente: +1 Corpo e Proativo. Desafiador: +1 Técnica e Rastreador Nato. Retaguarda: +1 Raciocínio e Diligente. Cada função também altera medidores por nível.</p></article><article class="ruleblock"><h3>Perícias</h3><p>Modificadores treinados agrupados por atributo. Bônus iniciais +1 ou +2; limites maiores nos níveis 8, 15, 23 e 28.</p></article><article class="ruleblock"><h3>Nível 0</h3><p>Ser humano comum: Saúde 5 + Corpo; Resistência 4; Stamina 5; Defesa 6; 5 + RAC pontos de perícia.</p></article><article class="ruleblock"><h3>Progressão</h3><p>Saúde, Resistência e Stamina crescem em faixas de níveis; arquétipo e função acrescentam valores. Tabelas de classe definem atributos, perícias, vantagens, poderes de função e técnicas de subclasse.</p></article><article class="ruleblock"><h3>Classes e subclasses</h3><p>Herdeiros: Escolhido, Experimento, Vítima e Mutante. Feiticeiros: Explorador do Oculto, Bruxo, Mago e Clérigo. Especialistas: Militar, Formado, Arrependido e Investigador.</p></article></div>':'<div class="rulesgrid"><article class="ruleblock"><h3>Testes e dados</h3><p>d8 para testes difíceis, d10 para situações complicadas, d12 para testes normais. Some atributo e perícia. Categorias de dado podem subir ou descer passos.</p></article><article class="ruleblock"><h3>Dificuldades</h3><p>Muito trivial 4; fácil 5–6; regular 7–8; desafio moderado 9–10; difícil 11–12; exigente 13–14; extremo 15–17; quase impossível 18–20; cósmico 21+.</p></article><article class="ruleblock"><h3>Opostos, críticos e modificadores</h3><p>Maior resultado vence; empate favorece quem ataca. Crítico: máximo no dado e depois 7+ num dado igual. No 1, role novamente: ímpar causa falha crítica. Vantagem usa o maior de dois dados; desvantagem, o menor.</p></article><article class="ruleblock"><h3>Testes em equipe</h3><p>Teste auxiliado soma 1d4 + modificador ao teste principal. Testes conjuntos partilham um objetivo; acumulados somam sucessos ou falhas definidos pelo mestre. Uma nova tentativa pode custar outra ação e trazer consequências.</p></article><article class="ruleblock"><h3>Rodada de combate</h3><p>Todos anunciam ações; a rodada ocorre em duas fases simultâneas. A primeira é preparação ou ofensiva rápida. Na segunda, os personagens reagem às decisões da primeira fase.</p></article><article class="ruleblock"><h3>Ataque e defesa</h3><p>Compare o ataque com a Defesa. Contra ataques que permitem reação, Defender usa Proteção; não vale contra disparos à distância. A Resistência atual limita quantas vezes pode Defender na rodada.</p></article><article class="ruleblock"><h3>Ações e movimento</h3><p>Ações comuns incluem atacar, manobra, deslocar (7,5 m), preparar, mirar, levantar, esconder-se, ajudar, cautela/cobertura e primeiros socorros. Investida e conjuração são ações complexas; sacar item e pegar objeto são simples.</p></article><article class="ruleblock"><h3>Dano</h3><p>Crítico multiplica dano por 1,5. Vulnerabilidade a um tipo de dano ou a condição Vulnerável também multiplica por 1,5. Resistência a dano reduz o dano recebido.</p></article><article class="ruleblock"><h3>Tipos e distância</h3><p>Danos físicos, de natureza, especiais e hierofantes têm tipos próprios. Um quadrado mede 1,25 m; adjacente até 1,25 m, próximo até 10 m, médio até 20 m, extenso até 35 m, distante até 60 m e extremo até 100 m.</p></article><article class="ruleblock"><h3>Saúde, Resistência e Stamina</h3><p>Com Resistência abaixo da metade, Defender fica limitado a uma vez por rodada; com 0, não pode Defender. Com Stamina 0, fica Vulnerável e Desgastado e não usa habilidades com custo. Saúde 0 pode levar a Moribundo.</p></article><article class="ruleblock"><h3>Habilidades</h3><p>Se não indicar ação, a habilidade usa ação simples. A ficha pode guardar custo de Stamina, duração, recarga, condições e pré-requisitos. Habilidades passivas não gastam ação nem Stamina; afinidade pode modificar seus efeitos.</p></article><article class="ruleblock"><h3>Investigação e perseguição</h3><p>Testes de perícia, auxílio e acumulação de sucessos apoiam busca por pistas e perseguições. Funções têm perfis de investigação: Proativo, Rastreador Nato e Diligente.</p></article><article class="ruleblock"><h3>Lesões, sanidade e perigos</h3><p>Lesões e traumas usam tabelas de 1d20. Sanidade acumula contadores e descanso completo remove 2. O livro inclui fogo, água, quedas, pressão, fumaça, venenos, eletricidade, explosões e outros riscos.</p></article><article class="ruleblock"><h3>Inventário e durabilidade</h3><p>Limite 8 + (6 × Força), com bônus de acessórios. Acima do limite, metade do deslocamento e sem reação; em 150%, deslocamento 1 m e −2 em testes físicos. Abaixo de 50% de durabilidade, dano/efeito cai pela metade; abaixo de 10%, item não se usa; em 0%, não se repara. Venda vale metade.</p></article><article class="ruleblock"><h3>Livro completo</h3><p>Para consultar tabelas e descrições completas, <a class="link" target="_blank" rel="noreferrer" href="https://docs.google.com/document/d/14mfc5KO6JHzqU6RHpNsd1zpVyaFfGEaI26N2NaVfFVU/edit">abra O FIM: RPG — Livro do Jogador</a>.</p></article></div>')}
function renderCampaign(){let c=campaign.campaign,gm=c.role==='gm';let agentCards=campaign.sheets.map(s=>'<article class="card click" data-campsheet="'+$esc(s.id)+'"><div class="cardtop"><div class="initial">'+$esc((s.name||'?')[0])+'</div><span class="tag">'+$esc(s.archetype)+'</span></div><h3>'+$esc(s.name)+'</h3><div class="muted">'+$esc(s.className)+' · nível '+$esc(s.level)+'</div><div class="pills"><span class="pill">'+(s.ownerId===me.id?'SUA FICHA':'FICHA DE JOGADOR')+'</span></div>'+(gm||s.ownerId===me.id?'<button class="btn small danger" data-detach="'+$esc(s.id)+'">Remover da campanha</button>':'')+'</article>').join('');return '<div class="eyebrow">Campanha · '+(gm?'Mestre':'Jogador')+'</div><div class="heading"><div><h1>'+$esc(c.name)+'</h1><p>'+$esc(c.description||'')+'</p></div><button id="backCampaigns" class="btn">← Campanhas</button></div><div class="toolbar">'+(gm?'<button class="btn" id="editCampaign">Editar campanha</button><button class="btn" id="copyInvite">Copiar convite</button><button class="btn" id="revokeInvite">Gerar novo convite</button><button class="btn danger" id="deleteCampaign">Excluir campanha</button>':'')+'</div><div class="sectiontitle">Participantes · '+campaign.members.length+'</div><div class="cards">'+campaign.members.map(m=>'<article class="card"><div class="cardtop"><span class="tag">'+(m.role==='gm'?'MESTRE':'JOGADOR')+'</span>'+(gm&&m.id!==me.id?'<button class="btn small danger" data-kick="'+$esc(m.id)+'">Remover participante</button>':'')+'</div><h3>'+$esc(m.name)+'</h3></article>').join('')+'</div><div class="sectiontitle">Agentes da campanha</div><div class="toolbar"><button id="attachSheet" class="btn primary">＋ Adicionar uma das minhas fichas</button></div><div class="cards">'+(agentCards||'<div class="empty">Nenhum agente foi adicionado à campanha.</div>')+'</div>'}
function renderSheet(){let canEdit=sheet.ownerId===me.id||(campaignFrom&&campaign?.campaign.role==='gm');let owner=sheet.ownerId===me.id;return '<div class="eyebrow">Ficha de personagem'+(campaignFrom?' · campanha':' · pessoal')+'</div><div class="heading"><div><h1>'+$esc(sheet.name)+'</h1><p>'+$esc(sheet.className)+' · '+$esc(sheet.archetype)+' · '+$esc(sheet.function)+' · nível '+$esc(sheet.level)+'</p></div><div><button class="btn" id="backSheets">← '+(campaignFrom?'Campanha':'Fichas')+'</button> '+(canEdit?'<button class="btn" id="editSheet">Editar</button>':'')+' '+(owner?'<button class="btn danger" id="deleteSheet">Excluir ficha</button>':'')+'</div></div>'+sheetTab()+(specialTab==='overview'?overview():specialTab==='inventory'?inventoryView():specialTab==='abilities'?abilitiesView():specialView())}
let campaignFrom=false;bindDelegated();
async function init(){try{let x=await api('me');me=x.user;if(me)await afterLogin();else render()}catch{render()}}
init();
</script></body></html>
