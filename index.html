.rule-search{display:flex;gap:10px;align-items:center;margin:22px 0 18px}.rule-search input{flex:1;min-width:0;background:#17131b;border:1px solid #675238;color:#f6ead4;border-radius:12px;padding:13px 16px;font:inherit}.rule-chapters{display:flex;gap:10px;overflow-x:auto;padding:4px 0 16px}.rule-chapter{flex:1 0 150px;text-align:left;padding:13px 15px;border:1px solid #55452e;border-radius:12px;color:#eadcc3;background:rgba(35,27,21,.78);font:inherit;cursor:pointer}.rule-chapter small{display:block;color:#bca77e;margin-top:5px}.rule-chapter.active,.rule-section.active{border-color:#d1ad67;background:rgba(116,83,42,.33);color:#ffe2a0}.rule-reader{display:grid;grid-template-columns:minmax(190px,270px) minmax(0,1fr);gap:18px;align-items:start}.rule-outline{max-height:70vh;overflow:auto;position:sticky;top:14px;padding:15px;border:1px solid #59472f;border-radius:14px;background:rgba(24,20,19,.82)}.rule-section{display:block;width:100%;text-align:left;background:transparent;color:#d6c8b1;border:1px solid transparent;border-radius:8px;padding:9px 10px;margin-top:3px;font:inherit;font-size:.88rem;cursor:pointer}.rule-prose{min-height:260px;padding:clamp(20px,4vw,42px);background:linear-gradient(135deg,rgba(54,41,29,.91),rgba(25,22,24,.94))}.rule-prose h2{margin:7px 0 24px}.rule-prose p{color:#e5d8c4;line-height:1.8;margin:0 0 14px;white-space:normal}.rule-results{display:grid;gap:10px}.rule-result{display:grid;gap:7px;text-align:left;padding:16px;border:1px solid #59472f;border-radius:12px;background:rgba(28,24,24,.9);color:#eee2cf;cursor:pointer;font:inherit}.rule-result span,.rule-result small{color:#bca77e}.rule-result strong{font-size:1.05rem}@media(max-width:760px){.rule-reader{grid-template-columns:1fr}.rule-outline{position:static;max-height:35vh}.rule-chapters{scroll-snap-type:x mandatory}.rule-chapter{scroll-snap-align:start}}
</style></head><body><div id="app"></div><div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div><div id="toast" class="toast"></div><script>window.RULEBOOK=[{"id":"regras-basicas","title":"Regras básicas","sections":[{"id":"regras-basicas-section-1","title":"Regras básicas","content":"1. O FIM - RPG:\nO sistema de O Fim RPG, criado por Arthur Ottati e Felipe Giusti em 2024, mostra um mundo interdimensional sobre heróis e vilões que estão sempre em conflito pelo bem e o mal de todo o multiverso. Heróis de diversas dimensões se juntam para evitar o principal evento dentro desse sistema… O Fim, O Fim de toda a realidade, O Fim de toda vida no multiverso, O Fim de tudo que conhecemos. E você, como jogador, deve tentar seu melhor evitar O Fim, ou não, depende de você…\nCriamos esse mundo em 2024, jogando um sistema de RPG conhecido no Brasil. Nós fazíamos batalhas de arenas entre criaturas aleatórias do livro, o que foi evoluindo para formação de personagens: os grandes irmãos Marco e Peter, que passaram por grandes aventuras. Depois de um tempo isso foi evoluindo ainda mais, de pequenas arenas viraram grandes campanhas, dimensões inteiras, até que chegamos em O FIM: RPG, um sistema inspirado em outros famosos sistemas de RPG.\nNesse mundo utilizamos dos básicos de um RPG: a presença de um grupo de amigo (sendo 1 mestre e um grupo de múltiplos jogadores, um set de dados para todos os jogadores, fichas do sistema (página X) e entre outras necessidades que usaremos para ter a melhor experiência sobrevivendo ao mundo de O Fim."},{"id":"regras-basicas-section-2","title":"1.1 · ROLAGENS","content":"O Fim RPG se baseia em rolagens de dados diferentes, dependendo da situação e de como o mestre interpreta a ação do personagem. Essas rolagens podem ser de d8, d10 e d12 rolando d8 para testes mais difíceis, onde a situação está contra ele e muito dificilmente ele conseguirá fazer o que quer da maneira completa, d10 em testes um tanto complicados numa situação um pouco mais comum (normalmente o que será mais usado na mesa) e por fim d12 para testes normais, onde existe uma quantidade normal de pressão.\n\nSempre que rola um teste você soma o seu modificador do atributo definido para esse teste e também o seu de perícia (Caso tenha modificador).\n\nO mestre então pedirá por um teste da seguinte maneira: “Você então se aproxima do computador e começa a interagir com os sistemas de segurança dele. Você planeja tomar seu tempo enquanto faz isso ou quer tentar agilizar o processo para fazer ainda nessa rodada?”. Se responder que quer tomar seu tempo ele pode pedir para um teste de Raciocínio com Prestidigitação rolando um d12. Se pedir para agir mais depressa pode acabar rolando um d10 ou d8.\n\nA dificuldade deste teste pode variar, dependendo do nível de segurança do computador, da tensão da situação atual e de muitos outros fatores que o mestre possa querer levar em consideração. Normalmente é importante levar em conta que o valor médio que um personagem pode ter é 1d12+1 se não tiver a perícia ou 1d12+2 se tiver ela (valor médio sendo então ~8).\n\nUma DIF comumente usada mas não necessariamente obrigatória é 7, já que num teste difícil com um modificador de +1 é necessário de um 6-8 (3/8), num teste médio é necessário de 6-10 (1/2), e por fim num fácil é necessário 6-12 (7/12).\n\nEm alguns casos, um teste não será feito com uma dificuldade em mente e sim contra outra pessoa, nesse tipo de teste os dois fazem uma rolagem e quem tiver o maior valor vence sobre o outro. Em um cenário onde tirem o mesmo valor a pessoa fazendo o teste de “ataque”, ou seja o ofensivo, ganha (Ex. Ver alguém escondido, lançar um feitiço, realizar um ataque, tentar agarrar e etc.)"},{"id":"regras-basicas-section-3","title":"1.2 · CRÍTICOS","content":"Conseguir um resultado crítico num teste não é uma tarefa fácil, afinal conseguir um crítico significa ter um acerto perfeito ou uma falha desastrosa. Um resultado crítico num teste geralmente significa um sucesso automático, independente da dificuldade e do valor adversário. Se você e seu adversário tirarem críticos em testes opositores segue a regra de desempate onde quem ataca, vence.\n\nA primeira etapa para obter um valor crítico é tirar o número máximo do dado jogado\n(8, 1o e 12), se conseguir fazer isso jogue então mais um dado com a mesma quantidade de lados do dado rolado anteriormente, o teste é crítico se o valor for igual ou superior a 7 (independente do dado). Sendo as chances então:\nd8: 1/32\nd10: 1/25\nd12: 1/24\n(Em outras instâncias, o mestre pode optar por um sistema mais trivial, onde é necessário apenas um valor igual ou superior a 6 para realizar um crítico. Sendo as chances então:)\nd8: 1/~21\nd10: 1/20\nd12: 1/~20\n1d8\nUm resultado crítico tem efeitos diferentes dependendo da cena, em combate um ataque ou feitiço crítico tem seu dano aumentado num valor igual seu dano médio + modificador de crítico (se o tiver). Numa investigação um crítico da informações adicionais e únicas relativas ao ponto investigado. Por fim, em situações mais diversas o mestre pode analisar e escolher o que ele vê como melhor alteração num teste que tenha um resultado crítico.\n\nPor outro lado, ao tirar 1 em qualquer um dos três tipos de dados, jogue então mais um dado com a mesma quantidade de lados do dado rolado anteriormente, se tirar um número ímpar nele o teste é considerado uma falha crítica. Esse tipo de falha pode ter diferentes efeitos dependendo do tipo de ação sendo feita, mas geralmente significa um acidente e um momento descuidado onde tudo dá errado. Sendo as chances então:\nd8: 1/16\nd10: 1/20\nd12: 1/24"},{"id":"regras-basicas-section-4","title":"1.3 · MEDIDORES","content":"Três medidores são o que definem sua condição atual como personagem, sendo o fator mais importante quando se verifica se um personagem deve continuar ou não numa luta ou missão. Às vezes a melhor opção pode ser recuar e descansar, voltando em um momento futuro para tratar outra vez da situação.\n\nSaúde: Define a sua condição física, como está de vida e quanto consegue sofrer de dano ainda antes de morrer, um medidor de saúde vazio significa um personagem que está muito machucado, tanto que pode morrer com qualquer ataque que venha em sua direção.\nResistência: Define quanto você consegue resistir e reagir a ataques em relação a seu cansaço que se cria por fazer isso muitas vezes, um medidor de resistência vazio significa um personagem que não tem mais capacidade para reagir e se defender, já tendo gasto a força em seus braços para se defender.\nStamina: Define sua stamina para combater e tomar ações, diferente das outras esse medidor irá se encher muito mais raramente, muitas vezes só com descanso, um medidor de stamina vazio significa um personagem que não tem energia para seguir em frente."},{"id":"regras-basicas-section-5","title":"1.4 · ATRIBUTOS","content":"Atributos são tipos diferentes de talentos que podem ser usados ao realizar um teste, cada um relacionado a uma característica sua, eles são usados como modificadores nos valores de seus testes.\n\nO máximo que um personagem pode ter em um atributo é +2, esse valor aumenta para +3 no nível 7, +4 no nível 15, +5 no nível 21, +6 no nível 25, +7 no nível 29.\n\nATRIBUTOS FÍSICOS:\n* DES - Destreza (Testes que envolvem velocidade de ação e reação)\n* TEC - Técnica (Testes que demanda maestria de suas capacidades físicas)\n* COR - Corpo (Testes relacionados a seu desempenho físico, sendo esses seu metabolismo, resistência e força)\nATRIBUTOS SOCIAIS:\n* CHA- Charme (Testes que envolvam alguma habilidade de fala, seja para enganar, incentivar, apresentar entre outras)\n* PER - Perspicácia (Testes para notar coisas através da noção e não do pensamento, como sua visão panorâmica, intuição e capacidade de notar ilusões)\nATRIBUTOS MENTAIS:\n* CON - Conhecimento (Testes para todo tipo de conhecimento técnico, profissional e entre outros)\n* RAC - Raciocínio (Testes que demandam pensamento lógico, procura de pistas e manuseamento de  informações)"},{"id":"regras-basicas-section-6","title":"1.5 · PERÍCIAS","content":"Perícias são tipos diferentes de treinamento que se pode ter, cada um relacionado a uma arte treinável, elas são usados como modificadores menores no valor de seus testes.\n\nSempre que recebe pontos de perícia, pode distribuir eles entre as perícias existentes, as perícias na sua base podem receber um\nbônus de +1 ou +2 apenas. No nível 8, 15, 23, 28 ao receber mais perícias esse máximo aumenta para +3, +4, +5, +6 pontos máximos.\n\nDestreza\nACROBACIA: Pule, gire e faça piruetas para evitar perigo\nFURTO: Cometa crimes rapidamente e furtivamente.\nESCALAGEM: Suba e desça superfícies de maneira eficiente.\nESQUIVA: Evite ataques ou projéteis disparados contra você.\n* Técnica\nDISPARO: Use uma arma de longo alcance.\nFURTIVIDADE: Se esconda em meio ao cenário para evitar ser percebido.\nLUTA: Use armas brancas para destruir inimigos e anomalias à sua frente.\nMANOBRA: Use do seu corpo para atrapalhar um inimigo sem necessariamente causar dano nele.\n* Corpo\nFORÇA: Usar sua força para segurar pesos, levantar pessoas e coisas relacionadas.\nINTIMIDAÇÃO: Usar do seu tamanho e robustez para intimidar os outros e os forçar a desembuchar.\nMETABOLISMO: Resistir a efeitos mágicos ou de doenças/infecções que afetam diretamente o interior de seu corpo\nPROTEÇÃO: Resistir a grandes impactos, magias, poderes e efeitos que lhe atacam diretamente\n* Charme\nADESTRAMENTO: Conseguir a confiança de um animal selvagem, guiar um rebanho de gado.\nDIPLOMACIA: Convencer um segurança que pode acreditar em você, representar alguém num discurso ou motivar aliados.\nFLERTE: Dar em cima de uma bela dama em um baile, conquistar o coração de um dragão.\nLÁBIA: Mentir para alguém sobre onde você esteve na última noite, utilizar um documento falso.\nPERFORMANCE: Fazer uma peça de teatro, viver um papel diferente de quem você é.\n* Perspicácia\nAUDIÇÃO: Escutar sons de passos no outro lado da porta, ouvir as conversas mais obscuras de seus aliados.\nPERCEPÇÃO: Analisar um cômodo para ver se encontra um inimigo, ver na distância quantos guardas estão em um prédio\nINTUIÇÃO: Perceber uma mentira sendo contada, ver um criminoso gaguejando na hora de contar seu álibi.\nDETECÇÃO: Perceber uma ilusão do Ilusionista ou uma magia que mexe com a realidade.\n* Conhecimento\nCIÊNCIAS: Fazer uma experiência, manusear substâncias químicas delicadas sem arriscar a segurança de ninguém.\nCONSERTO: Reparar um carro, montar uma ferramenta que foi danificada.\nHISTÓRIA: Lembrar de um evento histórico que marcou esse local, identificar uma figura histórica só pela imagem ou coisa associada.\nINFORMAÇÕES: Explorar e extrair informações de um livro, computador ou outros sistemas que guardem informação.\nLINGUÍSTICA: Compreender uma língua perdida, conversar com uma pessoa com uma língua não compreensível.\nMEDICINA: Identificar uma condição, fazer uma autópsia ou remover uma infecção de alguém.\nOCULTO: Perceber uma referência ao oculto, identificar um feitiço ou manifestação.\nPILOTAGEM: Pegar um carro e acelerar o máximo para fugir do exército de criaturas atrás de você!\nRELIGIÃO: Desmontar a fé de um culto, pregar sobre a sua religião.\nSOBREVIVÊNCIA: Criar uma fogueira no meio do mato, caçar um porco perto do rio e entre outros.\n* Raciocínio\nCORAGEM: Controlar suas emoções numa situação de tensão, resistir a um charme de Hemera.\nCURA: Forneça suporte direto a um personagem, recuperando saúde desse.\nINVESTIGAÇÃO: Analisar detalhadamente um local para encontrar qualquer coisa diferente do normal, identificar uma diferença de caligrafia de uma carta para a outra.\nNAVEGAÇÃO: Se encontrar no meio do Oceano, achar a saída do Castelo do Conde.\nTÁTICA: Ver a melhor saída para escapar de um prédio em ruínas, identificar o ponto fraco do líder do culto da Ilusão.\nTECNOLOGIA: Utilizar um dispositivo eletrônico para encontrar informações pela internet.\n\n1.6 DIFICULDADES[a]:\nDificuldades podem variar, e definir uma muitas vezes pode ser difícil, por isso essa tabela existe para ajudar a definir algumas dificuldades\n\nDificuldade\n\tValor\n\tMuito Trivial\n\t4\n\tFácil\n\t5-6\n\tRegular\n\t7-8\n\tDesafio Moderado\n\t9-10\n\tDifícil\n\t11-12\n\tExigente\n\t13-14\n\tExtremo\n\t15-17\n\tQuase Impossível\n\t18-20\n\tCósmico\n\t21+\n\n* Destreza\nACROBACIA: Pule, gire e faça piruetas para evitar perigo\n* Esgueirar: Passar por espaço difícil (DIF 5+Corpo do ser / Tamanho do espaço)\n* Aterrissar: Reduzir dano de queda (Mais no Cap. IV)\n* Pular: Saltar verticalmente ou horizontalmente  (DIF 1 a cada 0,2m saltados)\nFURTO: Cometa crimes rapidamente e furtivamente.\n* Pickpocket: Tirar um item do bolso de alguém sem que esse perceba (DIF é seu teste contra um de percepção do inimigo)\n* Arrombar: Destrancar um cadeado usando gazuas, lidar com cofres e trancas complexas (DIF variada por cadeado)\nESCALAGEM: Suba e desça superfícies de maneira eficiente.\n* Amortecer Queda: Aterrissar usando do atrito para reduzir o dano levado, assim funcionando apenas em quedas onde se tem alguma superfície horizontal próxima (Mais no Cap. IV)\n* Escalar Rapidamente: Subir uma superfície sem perder tempo, como ação padrão ao invés de completa (DIF 8)\nESQUIVA: Evite ataques ou projéteis disparados contra você.\n* Esquivar: Pular para o lado para evitar certos danos, (DIF variada dependendo do efeito que você estiver se esquivando)\n\n* Técnica\nDISPARO: Acerte ou jogue algo à distância.\n* Disparar: Atirar com armas de fogo e de disparo ou arremessar uma arma de arremesso, assim fazendo um teste contra a defesa ou contra um teste de proteção do seu inimigo, determinando seu efeito nele (DIF variada)\n* Jogar: Arremesse um item para um aliado seu, talvez porque este esteja longe e não quer andar até ele ou porque não consegue o alcançar (DIF 5)\nFURTIVIDADE: Se esconda em meio ao cenário para evitar ser percebido.\n* Esconder-se: Ficar fora do campo de visão de seus inimigos, atrás de uma moita, árvore ou outros obstáculos. Para se esconder de outro ser é necessário um teste seu contra um teste de Percepção do ser que você quer se esconder, caso você passe o seu inimigo não consegue te perceber e você fica desprevenido contra ele, caso não passe ele te percebe imediatamente (DIF Percepção do Inimigo).\n* Seguir: Funciona como esconder-se mas envolve manter-se furtivo enquanto se desloca, necessitando então de múltiplos testes (DIF Percepção do Inimigo).\nLUTA: Use armas brancas para destruir inimigos e anomalias à sua frente.\n* Atacar: Atacar um inimigo com uma arma corpo a corpo, assim fazendo um teste contra a defesa ou contra um teste de proteção do seu inimigo, determinando seu efeito nele (DIF Defesa).\nMANOBRA: Use do seu corpo para atrapalhar um inimigo sem necessariamente causar dano nele.\n* Desarmar: Desarmar um alvo segurando uma arma. Sendo um teste de Manobra contra um teste de Luta do alvo, quem tiver o maior resultado ganha, se você ganhar você derruba a arma do alvo (DIF Luta do Inimigo).\n* Fintar / Flanquear : T\n\n* Corpo\nFORÇA: Use sua força para segurar e erguer pesos de diversos tamanhos e características.\n* Sustentar Peso: Você ergue alguém para que essa pessoa alcance um lugar alto ou talvez segure um armário tombando para que as pessoas passem pelo espaço dele (DIF varia com o peso do objeto ou pessoa).\n* Agarrar: Agarrar um alvo para dificultar o alvo. Deve ser um teste de Força contra um teste de Luta do alvo, ganha quem tem maior resultado, se você ganhar o teste o alvo fica agarrado (DIF Luta do Inimigo).\nINTIMIDAÇÃO: Use do seu tamanho e robustez para intimidar os outros e os forçar a desembuchar.\n* Ameaçar: Você ameaça um alvo para seu prazer. Deve fazer um teste de Intimidação contra um teste de Coragem, quem tiver o maior resultado ganha, se você passar o alvo fica amedrontado (DIF Coragem do Inimigo).\n* Interrogar: Você usa de seu tamanho para colocar outros para baixo enquanto tira informação deles, usando disso para dar benefício nesse tipo de ação (DIF Variada).\nMETABOLISMO: Resista a efeitos mágicos ou de doenças/infecções que afetam diretamente o interior de seu corpo.\n* Resistir a Efeito: Metabolismo é uma das perícias que apenas servem para resistir a certos efeitos, assim como esquiva, detecção e proteção (DIF Variada).\nPROTEÇÃO: Resista a grandes impactos, magias, poderes e efeitos que lhe atacam diretamente.\n* Defender: Quando é atacado você pode usar essa reação para tentar diminuir ou evitar o acerto desse ataque inimigo (mais em CAP. IV).\n\n* Charme\nADESTRAMENTO: Consiga a confiança de um animal selvagem, guie um rebanho de gado.\n* Acalmar Animal: Você pode acalmar um animal enfurecido. Deve fazer um teste de Adestramento, se você ganhar o animal fica calmo (DIF Variada).\n* Cavalgar Animal: Você pode montar um animal para usá-lo como montaria, usa adestramento para ter controle do animal e cavalga-lo (DIF Variada).\nDIPLOMACIA: Convença um segurança que pode acreditar em você, represente alguém num discurso ou motive aliados.\n* Acalmar Pessoa: Acalmar alguém que esteja sob um estado mental instável ou situação de desespero (DIF 11).\n* Convencer: Convencer outro indivíduo, falando a verdade, que este deve lhes dar algo ou permitir que façam algo (DIF Variada).\n* Ganhar Confiança: Aumentar o nível de relação com um NPC, melhorando a forma como ele vê você (DIF Variada).\nFLERTE: Faça cantadas para uma bela dama em um baile, conquiste o coração de um dragão.\n* Dar Em Cima: Você pode dar em cima de uma pessoa. Deve fazer um teste de Flerte para conquistar o coração do alvo (DIF Variada).\nLÁBIA: Minta para alguém sobre onde você esteve na última noite, utilize um documento falso.\n* Mentir: Você pode mentir para uma pessoa. Deve fazer um teste de Lábia para convencer ele (DIF Variada).\n* Pedir: Você pode pedir para uma pessoa alguma coisa. Você deve fazer um teste de Lábia contra um teste de Intuição do alvo.\nPERFORMANCE: Faça uma peça de teatro, viver um papel diferente de quem você é.\n* Interpretar: Assuma uma personalidade ou papel específico, demonstrando ser esse indivíduo, serve num sentido mais simples.\n* Demonstrar Conhecimento Artístico: Opere e utilize um instrumento musical, pinte um quadro ou outras coisas relacionadas a arte.\n* Disfarçar: Finja ser outra pessoa, agindo e se vestindo como alguém que não seja, serve num sentido mais enganador.\n\n* Perspicácia\nAUDIÇÃO: Escutar sons de passos no outro lado da porta, ouvir as conversas mais obscuras de seus aliados.\nPERCEPÇÃO: Analisar um cômodo para ver se encontra um inimigo, ver na distância quantos guardas estão em um prédio\nINTUIÇÃO: Perceber uma mentira sendo contada, ver um criminoso gaguejando na hora de contar seu álibi.\nDETECÇÃO: Perceber uma ilusão do Ilusionista ou uma magia que mexe com a realidade.\n* Conhecimento\nCIÊNCIAS: Fazer uma experiência, manusear substâncias químicas delicadas sem arriscar a segurança de ninguém.\nCONSERTO: Reparar um carro, montar uma ferramenta que foi danificada.\nHISTÓRIA: Lembrar de um evento histórico que marcou esse local, identificar uma figura histórica só pela imagem ou coisa associada.\nINFORMAÇÕES:\nLINGUÍSTICA: Compreender uma língua perdida, conversar com uma pessoa com uma língua não compreensível.\nMEDICINA:  Identificar uma condição, fazer uma autópsia ou remover uma infecção de alguém.\nOCULTO: Perceber uma referência ao oculto, identificar um feitiço ou manifestação.\nPILOTAGEM: Pegar um carro e acelerar o máximo para fugir do exército de criaturas atrás de você!\nRELIGIÃO: Desmontar a fé de um culto, pregar sobre a sua religião.\nSOBREVIVÊNCIA: Criar uma fogueira no meio do mato, caçar um porco perto do rio e entre outros.\n\n* Raciocínio\nCORAGEM: Controlar suas emoções numa situação de tensão, resistir a um charme de Hemera.\n* Resistir a Efeito: Como diz o nome, tente resistir a o efeito de uma habilidade ou até pela mera visão de algo impossível (DIF Variada).\n* Enfrentar Medo: Tome uma ação que seu personagem nunca teria coragem de fazer, com um teste acompanhando, falhar nesse teste pode significar amarelar na hora errada, piorando as coisas (DIF Definida pelo Mestre).\nCURA: Forneça suporte a um personagem, recuperando saúde desse.\n* Fornecer Suporte: Qualquer efeito ou habilidade relacionada a dar saúde ou curar alguém diretamente ou não usará Cura.\n* Primeiros Socorros: Salvar alguém de sua possível morte, tire seu aliado dessa situação debilitada (DIF 11)\nINVESTIGAÇÃO: Analisar detalhadamente um local para encontrar qualquer coisa diferente do normal, identificar uma diferença de caligrafia de uma carta para a outra.\n* Procurar Pistas: Ação de investigação base (DIF depende de muitos fatores).\n* Vasculhar Corpo: Vasculhe alguém inconsciente ou um cadáver, conseguindo parte de seus pertences ou todos seus pertences com base no seu resultado (DIF depende de muitos fatores).\nNAVEGAÇÃO: Se encontrar no meio do Oceano, achar a saída do Castelo do Conde.\n* Se Localizar: Se encontre em meio a um labirinto ou local parecido. Faça um teste de Navegação e caso passe o mestre te informa sobre sua localização (DIF Variada).\n* Manusear Mapa: Encontre e identifique uma localização no mapa com base no que já viram ou no que vêem em frente, associando informações (DIF 7).\nTÁTICA: Ver a melhor saída para escapar de um prédio em ruínas, identificar o ponto fraco do líder do culto da Ilusão.\n* Analisar Terreno: Analise o terreno para absorver o melhor dele para o combate. Deve fazer um teste de Tática para encontrar vantagens no próprio terreno (DIF 8).\n* Comandar Aliado: Comanda um aliado para fazer uma ação. Você faz um teste de Tática, se passar o aliado recebe +1 em testes para fazer uma próxima ação (DIF 6).\nTECNOLOGIA: Utilizar um dispositivo eletrônico para encontrar informações pela internet.\n* Decodificar: Você pode quebrar o código de um site. Deve fazer um teste de Tecnologia, se passar você consegue o que quer (DIF Variada).\n* Adquirir Informações: Busque o que você precisar na internet. Faça um teste de Tecnologia para descobrir informações sobre o que quiser (DIF Variada).\n* Compreender Código: Compreenda a programação de algum site, ou programa. Deve fazer um teste de Tecnologia. (DIF Variada)."}]},{"id":"criacao","title":"Criação de personagem","sections":[{"id":"criacao-section-1","title":"2.1 · DEFINIÇÃO DE UM PERSONAGEM","content":"Neste capítulo mostraremos como você pode criar o seu herói, ou vilão, nesse mundo interdimensional, aqui determinaremos o seu nome, história, desejos, atributos, arquétipo e classe entre outros fatores que determinam como seu personagem irá agir."},{"id":"criacao-section-2","title":"2.1.1 · OS BÁSICOS","content":"Antes de determinarmos os poderes do seu personagem, nós devemos determinar o básico, assim já tendo um norte em como interpretar e jogar com o seu personagem. Sendo elas:\n1. Nome\n2. Idade\n3. Aparência\n4. Personalidade\n5. Objetivo\n6. Alinhamento\n7. História\n8. Valores morais\n9. Outras coisas que queira adicionar"},{"id":"criacao-section-3","title":"2.2 · ARQUÉTIPOS","content":"A primeira etapa da criação é decidir seu arquétipo, essa não te dá nenhum poder específico, apenas define seu ganho passivo de saúde, stamina e perícias. Boa parte das suas habilidades virão da sua classe, o arquétipo moldando como você irá seguir na criação de sua ficha."},{"id":"criacao-section-4","title":"2.2.1 · HERDEIRO","content":"Herdeiros são aqueles que recebem seus poderes através de fontes naturais ou não naturais, mas de maneira geral naturalmente ou através de eventos.\nJogar com um personagem herdeiro significa se comprometer a um poder único que seja seu e apenas seu, uma habilidade própria e um caminho guiado através dela, desenvolvendo sua capacidade com essa até os limites.\nCÁLCULO DE SAÚDE POR NÍVEL: +1\nCÁLCULO DE STAMINA POR NÍVEL:+1\nPERÍCIAS: Duas Sociais, Duas Físicas."},{"id":"criacao-section-5","title":"2.2.2 · FEITICEIRO","content":"Feiticeiros são aqueles que estudaram, exploraram e buscaram fontes de poder para aprofundar suas capacidades de maneira geral, utilizando do conhecimento do oculto para enfrentar seus oponentes e escapar de qualquer situação que venha à sua frente. Jogar com um personagem feiticeiro significa gastar tempo com estudos, entendendo aquilo que pode tanto te ajudar como lhe matar.\nCÁLCULO DE STAMINA POR NÍVEL: +2\nPERÍCIAS: Três Mentais, Uma Social."},{"id":"criacao-section-6","title":"2.2.3 · ESPECIALISTA","content":"Especialistas são aqueles que não possuem poderes, usando apenas de seus conhecimentos para lutar contra essas grandes forças. Esses indivíduos não têm nenhuma habilidade direta mas podem (ou não) possuir seu físico potencializados por soros, anabolizantes entre outros métodos científicos existentes. Jogar com um personagem Especialista significa lidar com as coisas da maneira que você conhece, utilizando de práticas e conhecimentos realistas, podendo ser sua profissão, caminho militar entre outros passados que possa ter.\nCÁLCULO DE SAÚDE POR NÍVEL: +2\nPERÍCIAS: Uma Mental, Uma Física e Duas de Escolha."},{"id":"criacao-section-7","title":"2.3 · FUNÇÕES","content":"Após ter sua classe escolhida o próximo passo é definir o posicionamento e sua técnica de ação em combate. Além disso, define também como esse contribuirá para as investigações. Cada função funciona diferentemente em cenas de Investigação e de Combate, sendo essas as vantagens e desvantagens:"},{"id":"criacao-section-8","title":"2.3.1 · LINHA DE FRENTE","content":"Aqueles que se especializam em ação de frente em combate, assegurando a segurança daqueles atrás de si e auxiliando aqueles ao seu lado a resistirem e se manterem preparados para o que vier."},{"id":"criacao-section-9","title":"2.3.2 · DESAFIADOR","content":"Aqueles que se especializam em invadir as linhas inimigas, destruindo e danificando as barreiras deles para tomar o tempo deles enquanto sua equipe avança e junta forças, sendo então a fonte principal de dano do time."},{"id":"criacao-section-10","title":"2.3.2 · RETAGUARDA","content":"Aqueles que se especializam em manter a equipe de pé e unida o máximo possível, são responsáveis pela saúde e manutenção do time, resistindo a tentativas de invasão nas linhas de retaguarda."},{"id":"criacao-section-11","title":"2.3.2 · FUNÇÕES EM INVESTIGAÇÃO","content":"* LINHA DE FRENTE >>> PROATIVO:\nAqueles que se especializam em tomada de ação rápida, investigando locais rapidamente sem perder tempo. Assim, esses são melhores em investigações onde exista uma contagem de rodadas até um evento.\n* Mais Ações de Investigação\n* Auxílio Aprimorado\n* DESAFIADOR >>> RASTREADOR NATO:\nAqueles que se especializam em não perder nenhuma informação, sempre conseguindo o que querem. Assim, esses são melhores em investigações onde existam informações que são essenciais de se coletar.\n* Mais Valor em Testes\n* Busca por Pistas Específicas\n* RETAGUARDA >>> DILIGENTE:\nAqueles que se especializam em procura minimalista, requerem mais tempo e ações de preparação, mas conseguem coletar informação de maneira completa com facilidade. Assim, esses são melhores em investigações onde exista muita informação para se levar em conta, ajudando a organizar tudo que já viram até agora e o que estão descobrindo no momento presente.\n* Bônus em Revisão de Informações\n* Revisão de Locais já Investigados"}]},{"id":"classes","title":"Classes e subclasses","sections":[{"id":"classes-section-1","title":"3.1 · HERDEIRO","content":"Herdeiros são aqueles que recebem seus poderes através de fontes naturais ou não naturais, mas de maneira geral naturalmente ou através de eventos inevitáveis.\nJogar com um personagem herdeiro significa se comprometer a um poder único que seja seu e apenas seu, uma habilidade própria e um caminho guiado através dela, desenvolvendo sua capacidade com essa até os limites."},{"id":"classes-section-2","title":"3.1.1 · EXPERIMENTO","content":"Aqueles que tomaram a decisão de se expor para conseguirem seus poderes, experimentando em si mesmos para obter seus poderes.\nSuas habilidades são chamadas de PECULIARIDADES"},{"id":"classes-section-3","title":"3.1.2 · MUTANTE","content":"Aqueles que possuem poderes desde a nascença, não tendo uma escolha sob eles, muitas vezes sofrendo por serem heróis desde sempre.\nSuas habilidades são chamadas de DONS"},{"id":"classes-section-4","title":"3.1.3 · VÍTIMA","content":"Aqueles que receberam seus poderes contra sua vontade, sendo experimentados ou sofrendo de acidentes que lhe deram seus poderes.\nSuas habilidades são chamadas de MUTAÇÕES"},{"id":"classes-section-5","title":"3.1.4 · ESCOLHIDO","content":"Aqueles que tiveram os poderes entregues por uma força superior, sendo abençoados por uma entidade para ter poderes.\nSuas habilidades são chamadas de BÊNÇÃOS"},{"id":"classes-section-6","title":"3.1 · FEITICEIRO","content":"Feiticeiros são aqueles que estudaram, exploraram e buscaram fontes de poder para aprofundar suas capacidades de maneira geral, utilizando do conhecimento do oculto para enfrentar seus oponentes e escapar de qualquer situação que venha à sua frente. Jogar com um personagem feiticeiro significa gastar tempo com estudos, entendendo aquilo que pode tanto te ajudar como lhe matar."},{"id":"classes-section-7","title":"3.1.1 · EXPLORADOR DO OCULTO","content":"Aqueles que estudaram, leram e procuraram entender sobre magias ocultas, e assim acabaram por entender como usá-las para seu próprio benefício.\nSeus conhecimentos proibidos são chamados de ESTUDOS."},{"id":"classes-section-8","title":"3.1.2 · BRUXO","content":"Aqueles que fizeram pactos com entidades ocultas, arriscando e entregando partes de si em troca de poder, recebendo assim habilidades em troca de vender sua própria alma para algo que nem entendiam.\nSeus sacrifícios feitos em troca de poder são chamados de PACTOS."},{"id":"classes-section-9","title":"3.1.3 · MAGO","content":"Aqueles que têm seus poderes através de algo específico, podendo ter habilidades ocultas vindas de um objeto como um livro, pedra, artefato entre outras coisas podendo em alguns casos terem o poder vindo de outro indivíduo e estão conectados a algo material.\nSeus objetos associados são chamados de CATALISADORES."},{"id":"classes-section-10","title":"3.1.4 · CLÉRIGO","content":"Aqueles que possuem poderes ligados a divindades (completo oposto do bruxo), tendo habilidades muitas vezes espirituais e religiosas, fortemente ligadas a uma crença existente. Esses poderes podem realmente vir dessa divindade do bem ou pode apenas ser o que o personagem clérigo pensa que é verdade, podendo verdadeiramente ser de uma outra fonte (cabe ao mestre).\nSuas palavras são chamadas de ORAÇÕES."},{"id":"classes-section-11","title":"3.1 · ESPECIALISTA","content":"Especialistas são aqueles que não possuem poderes, usando apenas de seus conhecimentos para lutar contra essas grandes forças. Esses indivíduos não têm nenhuma habilidade direta mas podem (ou não) possuir seu físico potencializados por soros, anabolizantes entre outros métodos científicos existentes. Jogar com um personagem Especialista significa lidar com as coisas da maneira que você conhece, utilizando de práticas e conhecimentos realistas, podendo ser sua profissão, caminho militar entre outros passados que possa ter."},{"id":"classes-section-12","title":"3.1.1 · MILITAR","content":"Aqueles que treinaram muito e suaram tanto para conseguirem trazer o mal para sua justiça. Aprendendo a combater e se defender através de ensinamentos semelhantes ou literalmente militares.\nSuas habilidades são chamadas de TREINAMENTOS MILITARES."},{"id":"classes-section-13","title":"3.1.2 · FORMADO","content":"Aqueles que usam de seus conhecimentos mundanos para lidar com toda situação, podendo saber consertar coisas, desenvolver novas habilidades e itens, e muitas vezes ter maneiras críticas de evitar situações ou até combatê-las diretamente.\nSuas habilidades são chamadas de OCUPAÇÕES."},{"id":"classes-section-14","title":"3.1.3 · ARREPENDIDO","content":"Aqueles que possuem conhecimentos criminosos, tendo um passado de crime e feitos malignos, até sendo possivelmente um vilão anteriormente. Assim, usando o que uma vez foram táticas malignas como experiências onde se pode aproveitar do melhor de cada situação.\nSuas habilidades são chamadas de FRUSTRAÇÕES."},{"id":"classes-section-15","title":"3.1.4 · INVESTIGADOR","content":"Aqueles que são profissionais em investigar, encontrando culpados e investigando os piores eventos sobrenaturais. Aprendendo a encontrar pistas, entrevistar qualquer um e assim alcançar a verdade.\nSuas habilidades são chamadas de ANÁLISES."}]},{"id":"poderes-funcao","title":"Poderes de Função","sections":[{"id":"poderes-funcao-section-1","title":"Linha de Frente","content":"* NÍVEL 1:\nvocê recebe:\nPOTÊNCIA: Você pode gastar 2 STA para receber +1 em um teste de COR.\n* NÍVEL 6:\nvocê recebe:\nLUTA COM ALGUÉM DO SEU TAMANHO: Você pode usar essa habilidade em ataques feitos por inimigos adjacentes a você (mesmo que o alvo desses esteja fora desse alcance) ou em ataques com alvos que estejam adjacentes a você (mesmo se o atacante estiver fora desse alcance). Ao usar essa habilidade você gasta 2 STA e o alvo do ataque se torna você (se usar a ação defender nesse ataque você tem -2 nesse teste).\nescolha um:\nEngolir o Choro: Ao rolar um teste com uma desvantagem ou redução de diminuidor causada por uma condição mental ou habilidade que não funciona fisicamente você pode gastar 2 STA para ignorar o efeito até o fim dessa rodada.\nImpacto Destrutivo: Ao realizar um ataque corpo a corpo você pode gastar 3 STA para fazer com que o alvo faça um teste de Força contra um seu, se ele falhar fica com a condição Ossos Quebrados por 2 rodadas.\nParede Viva: Aliados adjacentes a você recebem +2 na DEF e você sofre metade do dano que esses sofrem por efeitos que o acertem (não funciona com efeitos que afetam o metabolismo diretamente).\n* NÍVEL 12:\nescolha um:\nInstintos Defensivos: Quando usa à ação tomar cobertura o ganho de resistência pela habilidade é dobrado. Adicionalmente na primeira vez num combate que sua resistência desce para um valor inferior a metade da sua resistência máxima você automaticamente recupera ⅛ da sua resistência máxima.\nCombate Exaustivo: Uma vez por combate você pode usar uma ação simples, gastando até 40% da sua resistência máxima para receber stamina em troca, recebendo 2 STA para cada 8% de resistência sacrificada (máximo 10 STA).\nvocê recebe buffs a habilidades anteriores:\n* Ao usar a habilidade Potência você pode agora gastar 4 STA para ter +2 em um teste de corpo.\n* O alcance da habilidade Luta com Alguém do seu Tamanho aumenta para ataques feitos em alvos ou atacantes a 2,5m de você.\n* NÍVEL 18:\nescolha um:\nImunidade de Ferro: Você pode gastar 6 STA para remover uma condição que esteja lhe afetando que tenha sido causada por efeitos físicos ou uma condição de maneira geral associada ao sistema imunológico.\nHold the Line: Uma vez por rodada, ao fazer um ataque de oportunidade, você pode gastar 30 RES para receber +3 no teste do ataque, se acertar esse ataque o alvo acertado fica Imóvel e Desgastado por 1 rodada. Ao usar esse poder você se torna incapaz de reagir a ataques por 1 rodada.\nPreparação Defensiva: Em uma cena de Interlúdio você recebe uma nova ação;\nPreparação Defensiva: Você recebe uma quantidade de pontos de sobre-resistência  iguais a 50% da sua resistência máxima. Esse valor é duplicado se você realizar uma ação Descanso nesse mesmo interlúdio.\nNinguém Encosta nos Meus Aliados: Essa habilidade só pode ser usada na segunda fase de uma rodada, requerindo que você seja o último a agir, também necessitando que pelo menos dois aliados a 6m de você tenham sofrido dano desde o início da sua última rodada e você não tenha. Ao usar a habilidade você gasta 5 STA e até o fim da primeira fase da próxima rodada todo dano causado em aliados a 6m de você é redirecionado para você.\nvocê recebe buffs a habilidades anteriores:\n* O alcance da habilidade Luta com Alguém do seu Tamanho aumenta para ataques feitos em alvos ou atacantes a até 5m de você, porém requerendo um gasto adicional de 2 STA (ficando 4) para usar essa versão da habilidade.\n* Ao usar a habilidade Potência você pode agora gastar 6 STA para ter +3 em um teste de corpo.\nvocê recebe buffs a uma das habilidades abaixo, recebendo buff pra habilidade que escolheu obter anteriormente:\n* A habilidade Instintos Defensivos agora também se ativa quando sendo reduzido a 0 de resistência.\n* A habilidade Combate Exaustivo agora pode ser usada duas vezes por combate e seu limite de gasto aumenta para um máximo de 64% (máximo 16 STA).\n* NÍVEL 24:\nvocê recebe:\nAPEGO A VIDA: Enquanto sob a condição moribundo você agora não morre mesmo se ficar 5 rodadas, apenas morrendo mesmo por lesões, adicionalmente você recebe +2 na DEF enquanto com essa condição.\nvocê recebe buffs a habilidades anteriores:\n* Ao usar a habilidade Potência você pode agora uma vez por cena gastar 8 STA para ter um sucesso automático em um teste de COR ( quantidade de vezes que se pode usar a habilidade aumenta em 1 a cada nível subido após esse, podendo assim até 7 vezes por cena no nível 30).\nvocê recebe buffs a uma das habilidades abaixo, recebendo buff pra habilidade que escolheu obter anteriormente:\n* A habilidade Instintos Defensivos agora recupera ½ da resistência máxima quando ativada.\n* A habilidade Combate Exaustivo agora pode ser usada três vezes por combate e seu limite de gasto aumenta para um máximo de 90% e você recebe 2 STA a cada 6% de resistência sacrificada (máximo 30 STA).\n* NÍVEL 30:\nvocê recebe:\nPRONTO PRA DISPUTA: Sempre que você deixa de ficar sob a condição Moribundo você fica com resistência máxima.\nvocê recebe buffs a habilidades anteriores:\n* O alcance da habilidade Luta com Alguém do seu Tamanho aumenta para ataques feitos em alvos ou atacantes a 10m de você porém requerendo um gasto adicional de 6 STA (ficando 8) para usar essa versão da habilidade.\nvocê recebe buffs a uma das habilidades abaixo, recebendo buff pra habilidade que escolheu obter anteriormente:\n* A habilidade Engolir o Choro é transformada em uma nova habilidade:\nIgnorar Destino: Você pode gastar uma ação simples e 2 STA uma vez por rodada para ignorar o efeito de uma condição que esteja lhe afetando pela duração dessa rodada.\n* A habilidade Impacto Destrutivo é transformada em uma nova habilidade:\nPeso do Cosmos: Ao realizar um ataque corpo a corpo você pode gastar 3 STA para fazer com que o alvo faça um teste de Força contra um seu, se ele falhar fica com uma condição física e apropriada de sua escolha até o fim da primeira fase da próxima rodada.\n* A habilidade Parede Viva é transformada em uma nova habilidade:\nAbsorção de Dor: Aliados adjacentes a você sofrem metade do dano por efeitos que os acertem diretamente (não funciona com efeitos que afetam o metabolismo), e sempre que um aliado adjacente sofre dano você pode gastar 20 RES para aplicar uma Marca de Vingança no atacante dele, sempre que ataca um alvo com essa marca você causa o dobro de dano por cada marca que ele possuí."},{"id":"poderes-funcao-section-2","title":"Desafiador","content":"* NÍVEL 1:\nvocê recebe:\nDERRUBAR POSTURA: Danos causados diretamente a resistência de um alvo são mais destrutivos, você causa 110% de dano.\n* NÍVEL 6:\nvocê recebe:\nMOVIMENTAÇÃO TÁTICA: Essa habilidade só pode ser usada enquanto sua resistência atual é menor do que a metade de sua resistência máxima. Uma vez por rodada você pode gastar 1 STA para fazer uma das seguintes coisas: Se deslocar 2,5m e recarregar uma arma sendo usada, se deslocar 2,5m e tomar cobertura ou se deslocar 5m sem ativar ataques de oportunidade.\nescolha um:\n- Troca Defensiva: Ao acertar um ataque ou feitiço num alvo, você pode gastar 1 STA para ativar Troca Defensiva em relação a esse alvo (podendo ter um alvo com esse efeito por vez), enquanto ativo sua DEF aumenta em 2 em relação a ele. (buffs podem dar um contra-ataque)\n- Infiltração Ágil: Ao usar uma Investida você pode se mover metade do seu deslocamento uma segunda vez após ter feito o ataque.\n- Disparo / Pancada Tático(a): Ao acertar um alvo ou conjurar um feitiço que o acerte diretamente você pode gastar 3 STA para aplicar UM dos efeitos abaixo:\n* Potente: O impacto empurra o alvo 2,5m.\n* Quebra Guarda: O alvo fica quebrado (-3 DEF) até ser atacado novamente.\n* Revelador: Ninguém pode ficar desprevenido em relação a esse alvo por 1 rodada.\n* Letal: O ataque causa +1d4 de dano (multiplica com crítico).\n\n* NÍVEL 12:\nescolha um:\nDuelista: Esse caminho define um uso de personagem com um foco em dano contínuo  enquanto conseguindo se manter seguro. Você recebe um bônus de +1 em testes de ataque e para conjurar feitiços feitos à distância.\nInfiltrador: Esse caminho define um uso de personagem com um foco em dano rápido enquanto se arriscando. Você recebe um bônus de +1 em testes de ataque e para conjurar feitiços feitos corpo a corpo.\nvocê recebe buffs a habilidades anteriores:\n* O aumento de dano causado contra resistência através da habilidade Derrubar Postura muda para 125%\n* O deslocamento feito através dá habilidade Movimentação Tática duplica.\n* NÍVEL 18:\nescolha um:\nDesafiador Herdeiro: Poderes de sua classe de herdeiro que causem dano tem seus danos aumentados em 1d do mesmo tipo, seus efeitos que precisam ser resistidos que não causam dano têm suas DIF aumentadas em 1 (possivelmente também outros efeitos que o mestre veja que faça sentido melhorar).\nDesafiador Feiticeiro: Seus feitiços que causam dano têm seus dados aumentados em 1d do mesmo tipo, feitiços que não causam dano têm suas DIF aumentadas em 1. (possivelmente também outros efeitos que o mestre veja que faça sentido melhorar).\nDesafiador Especialista: Sempre que você usa efetivamente uma habilidade sua que requer pelo menos uma ação normal você recebe 1 Experiência Especialista. Fora de combate, você pode gastar 1h para gastar todos seus pontos de EE para receber mais SAU, RES ou STA máxima e atual: Cada três pontos gastos com SAU ou RES aumenta 1 valor em um dos dois medidores, cada seis pontos gastos com STA aumenta 1 no seu medidor.\nvocê recebe buffs a habilidades anteriores:\n* Ignorar Ataques de Oportunidade agora se torna um efeito padrão da habilidade Movimentação Tática e ela muda de algumas maneiras, você pode gastar 3 STA para fazer uma das seguintes coisas: Se deslocar 5m, recarregar uma arma sendo usada e receber 7 de RES, ou se deslocar 5m, tomar cobertura e receber +2 de DEF até o início da primeira fase da próxima rodada, ou se deslocar 10m sem ativar ataques de oportunidade.\n* O aumento de dano causado contra resistência através da habilidade Derrubar Postura muda para 150%\nvocê recebe buffs a uma das habilidades abaixo, recebendo buff pra habilidade que escolheu obter anteriormente:\n* Sua habilidade Duelista agora tem um efeito secundário: Você não sofre mais de desvantagens por cadência de tiro a maior distância e nem por atacar alvos em combate corpo a corpo com aliados.\n* Sua habilidade Infiltrador agora tem um efeito secundário: Você agora recebe +1 em testes de proteção enquanto existem mais inimigos do que aliados a 5m de você.\n\n* NÍVEL 24:\nvocê recebe:\nPrecisão Letal: Você agora precisa de apenas 6 num segundo dado quando rolando para um possível crítico (apenas em testes ofensivos), se for um feiticeiro pode optar por escolher aumentar em 2 sua DIF de magias para feitiços que um ser já tenha resistido nesse mesma combate.\nvocê recebe buffs a habilidades anteriores:\n* A habilidade Derrubar Postura agora recebe um uso adicional, uma vez por combate, ao acertar um ataque num alvo, você pode gastar 8 STA para ignorar o teste de proteção dele, assim ignorando resistência e garantindo que acerte diretamente a saúde dele. Sempre que você sobe um nível a quantidade de vezes que você pode usar essa habilidade num combate aumenta em 1 (podendo usar até 7 vezes por combate no nível 30).\nvocê recebe buffs a uma das habilidades abaixo, recebendo buff pra habilidade que escolheu obter anteriormente:\n* Sua habilidade Duelista agora tem um efeito terciário: Você pode como uma ação simples liberar caminho para aliados que queiram passar, não contando como ocupando um espaço, além de também ser ignorado no quesito de estar no caminho de ataques, assim não podendo tomar ataques ou bloquear caminho de uma cura por estar na frente de alguém.\n* Sua habilidade Infiltrador agora tem um efeito terciário: Você recebe +1 de RES e STA automaticamente e também sempre que avança de nível.\n* NÍVEL 30:\nvocê recebe:\nStay Down: Ao reduzir um personagem para 0 de saúde, você recebe uma ação adicional nessa fase da rodada. Adicionalmente todos seus ataques possuem execução II.\nvocê recebe buffs a habilidades anteriores:\n* Você agora pode usar Movimentação Tática uma vez por fase da rodada, não precisa mais estar com metade da resistência máxima, seu custo aumenta para 4 STA e agora e seus usos se tornam os seguintes:\n   * Deslocar 7,5m, recarregar e recuperar 20 RES\n   * Deslocar 7,5m, tomar cobertura e receber +2 DEF até o fim da próxima rodada\n   * Deslocar 5m e realizar uma ação física que o mestre veja como plausível\n   * Deslocar 15m\nvocê recebe buffs a uma das habilidades abaixo, recebendo buff pra habilidade que escolheu obter anteriormente:\n* A habilidade Troca Defensiva é transformada em uma nova habilidade:\nPorte Divino: Sempre que completa um confronto mínimo contra um ser (ele te atacou e você o atacou pelo menos uma vez nesse combate) ele recebe uma Sinalização de Confronto. Quando você ataca um ser que possuí essa condição ou um ser com essa condição te ataca você pode gastar 6 STA para ativar um Porte Divino que só funciona em relação a ele (Um ser só pode ter um porte por vez e para mudar um porte tem de usar a habilidade de novo).\n* Porte da Execução: Seus ataques feitos nele são críticos se seu segundo dado é 5 ao invés de 7 (soma com outras habilidades).\n* Porte Inquietante: Você recebe +4 de DEF contra ataques dele.\n* Porte do Casulo: Contra-ataques, efeitos de dano redirecionado, quebradores de postura ou qualquer efeito usado por ele que lhe acerte além do normal não lhe afeta.\n\n* A habilidade Infiltração Ágil é transformada em uma nova habilidade:\nMovimentação Espectral: Ao usar uma Investida você não precisa se deslocar (por efeitos de jogo você nunca saiu do lugar), fazendo-a como normal mas terminando no lugar que começou como se nunca estivesse lá. Adicionalmente você pode uma vez por rodada fazer um movimento sem gastar uma ação.\n\n* A habilidade Disparo Tático é transformada em uma nova habilidade:\nExecução Garantida: Ao acertar um alvo você pode gastar 6 STA para aplicar UM dos efeitos abaixo, ao acertar com um ataque crítico você aplica dois:\n* Potência: O impacto empurra o alvo 5m e o derruba.\n* Destruição: O alvo fica exposto (-5 DEF) até que ele gaste uma ação comum ou tenha um aliado fazer o mesmo para remover o efeito.\n* Revelação: Ninguém pode ficar desprevenido em relação a esse alvo até que ele gaste uma ação comum ou tenha um aliado fazer o mesmo para remover o efeito.\n* Letalidade: O ataque causa +1d12 de dano (multiplica com crítico).\n* Ricochete: O ataque acerta um segundo alvo a 2,5m ou menos do alvo principal causando metade do dano neste.\n* Brutalidade: Seres que vejam o ataque sendo feito precisam fazer um teste de coragem (DIF 15) se falharem ficam Apavorados por 1 rodada (cada vez que um ser é afetado por essa habilidade de novo a DIF diminui em 3)."},{"id":"poderes-funcao-section-3","title":"Retaguarda","content":"As curas concebidas por essa função aumentam teoricamente de maneira que se mantenha justa com o nível atual do personagem, portanto embaixo das habilidades terá um texto descrevendo uma fórmula de cálculo de cura da habilidade com o nível, definida por X.\n* NÍVEL 1:\nescolha uma cura principal:\nRecuperação Direta: Escolha uma arma, item, ferramenta ou capacidade mágica que possua como sua maneira de “Atacar Com Cura”. Em caso de algo mágico o valor de cura pode ser usado com a escala abaixo, causando em dano 25% da cura, mas em sua base, você gasta uma ação normal e 1 STA para usar ela, ela possuí alcance de 7,5m e fornece X Saúde a aliados acertados. Se ela já causava dano agora apenas causa 50% do dano original, porém ela agora pode também curar aliados numa quantia igual a 80% do dano que causaria normalmente com o item. “Atacar com Cura” é uma forma de cura simples, por que é como disparar projéteis de cura em aliados, e como isso exige também algum nível de habilidade para acertar você deve fazer um teste de Cura DIF 5, se falhar apenas cura metade do que iria normalmente por errar parte do ataque. Essa forma de cura principal significa uma jogatina focada em sempre estar atirando cura em seus aliados.\n(1,2 x nível) -1 + cura                   n1: c       n3: 3+c      n5: 5+c      n7: 7+c      n9: 10+c      n11: 12+c      n13: 15+c                                                    n15: 17+c      n17: 19+c      n19: 22+c      n21: 24+c      n23: 27+c      n25: 29+c      n27: 31+c      n29: 34+c\n\nRecuperação Constante: Escolha um objeto, magia ou o que quer que prefira para representar seus focos de cura, estes sendo habilidades que você pode uma vez por rodada colocar num aliado a até 7,5m como ação simples, porém requerendo uma ação normal para colocar uma segunda na mesma rodada, gastando 2 STA para aplicar cada foco. Adicionalmente você pode gastar +1 STA para colocar um foco de cura em si mesmo. Esses focos curam X por rodada (curando no início dela), durando por 2 rodadas. Um alvo só pode ter um desses por vez.\n(2.1 x nível) -1 + cura                   n1: 1+c      n3: 5+c      n5: 9+c      n7: 14+c      n9: 18+c      n11: 22+c      n13: 26+c                                                    n15: 30+c      n17: 35+c      n19: 39+c      n21: 43+c      n23: 47+c      n25: 51+c      n27: 56+c      n29: 60+c\n\nRecuperação Em Massa: Escolha um foco mágico, item ou ferramenta que possa representar ou manifestar suas zonas de cura, estás são áreas que você pode criar sob seus pés gastando uma ação normal e 3 STA, essa zona possuí 2,5m de raio e se manifesta por 3 rodadas, depois recarregando por mais 3 rodadas. Você pode gastar 2 STA para ignorar a recarga de sua zona de cura. Finalmente, essa zona cura X de saúde de todos os alvos que terminem uma fase da rodada dentro dela (curando uma vez por rodada).\n(2,3 x nível) +1 + (2 x cura)                n1: 3+(2xc)      n3: 8+(2xc)      n5: 12+(2xc)      n7: 17+(2xc)      n9: 21+(2xc)       n11: 26+(2xc)      n13: 31+(2xc)      n15: 35+(2xc)      n17: 40+(2xc)      n19: 45+(2xc)      n21: 49+(2xc)      n23: 54+(2xc)      n25: 58+(2xc)      n27: 63+(2xc)      n29: 68+(2xc)\n\nRecuperação Ofensiva: Escolha uma arma sua, você usará então dessa arma como sua fonte de geração de cura, assim ela causa 80% do dano que causaria normalmente e sempre que infringe dano ela transfere 25% do dano causado em recuperação de saúde para si mesmo e aliados a 5m de si e alternativamente você pode gastar 2 STA ao acertar um ataque para recuperar saúde de si mesmo ou de um aliado a 10m de si equivalente a 50% do dano causado com o ataque.\n\nRecuperação Versátil: Escolha duas das outras opções acima, você recebe as habilidades de ambas, mas a cura fornecida por elas é reduzida para 60% do total de cura que teria normalmente.\n\n* NÍVEL 6:\nvocê recebe:\nSozinho, Mas Não Indefeso: Enquanto não tiver nenhum aliado em um alcance de 7,5 m de você você recebe um bônus passivo de +2,5m extra de deslocamento sempre que faz a ação se movimentar além de +2 DEF.\nescolha um modificador para cura:\nExpansiva:\n* Direta: O alcance de sua cura aumenta em 2,5m, adicionalmente você recebe um overflow de cura a cada 6 curas acertadas / ataques acertados. Sempre que manifesta um overflow você recebe um movimento adicional e recupera 10% da sua saúde máxima.\n* Constante: Você recebe um terceiro foco de cura, adicionalmente o alcance dos seus focos de cura aumentam em 2,5m.\n* Em Massa: Tamanho da sua zona aumenta em 1,25m de raio e você agora possuí uma zona secundária com recarga própria que recupera 50% do valor original e tem tamanho 50% menor que o original.\n* Ofensiva: A área em que sua cura se dispersa aumenta em 2,5m e você também recupera 3 RES na primeira vez que realiza um ataque numa rodada\nExplosiva:\n* Direta: Seus projéteis de cura agora não precisam ter um alvo específico, já que agora explodem no local de impacto, afetando uma área circular de raio 1,25m no local de impacto. Por conta disso você pode mirar num local ou num ser, fazendo então o teste em relação a todos os alvos que estejam na área.\n* Constante: Quando você coloca um foco de cura em um aliado você pode gastar +1 STA para adicionar uma aura de cura nesse foco, que passa a recuperar saúde de aliados a 5m do alvo com o foco, recuperando 50% da cura original.\n* Em Massa: Ao conjurar uma zona de cura inimigos dentro da zona são empurrados para até 2,5m de um dos extremos da zona.\n* Ofensiva: Quando acertar um inimigo pela segunda vez com sua arma (1 vez a cada 2 ataques) você pode gastar 1 STA para força-lo a fazer um teste de Metabolismo (DIF cura+2), caso não passe ele fica Lento até se deslocar, caso passe ele não fica sob nenhuma condição.\nPerfurante / Ricochete:\n* Direta: Seus ataques / curas agora perfuram inimigos e aliados, podendo acertar mais de um aliado ou inimigo com um único ataque caso estejam na sua linha de ataque (que tem grossura 1,25m). Ou seus ataques agora fazem ricochete, podendo ignorar inimigos ou aliados no caminho do ataque e adicionalmente quando errar um teste de Cura você pode gastar 2 STA para refazer o teste.\n* Constante: Você pode manifestar um foco de cura ricochete gastando +1 STA, esse foco vai voando de um lado para o outro, ricocheteando nas paredes e curando seres acertados no caminho, ele se move até 5m uma vez por etapa da rodada. Ele cura 50% a menos do que o normal, mas dura 5 por rodadas ao invés de 2. (Esses contam como um de seus focos e portanto não podem ser feitos de maneira ilimitada, ocupando um espaço de foco enquanto existindo).\n* Em Massa: Inimigos dentro da sua zona agora sofrem 10% do valor da sua cura como dano.\n* Ofensiva: Quando acerta um inimigo, além de curar a si mesmo e seres na área você também causa dano a inimigos na área, causando metade da cura recebida em dano.\nRápida / Reutilizável:\n* Direta: Você agora pode fazer dois ataques / curas numa única ação, porém os efeitos de dano e cura dessa são apenas 50% do valor original.\n* Constante: Você agora possuí +2 focos de cura, e pode colocar 1 por fase da rodada como ação simples, o terceiro e quarto precisando de ações normais em cada fase. Porém suas durações mudam para apenas uma única rodada. Adicionalmente, ao colocar um foco de cura em um aliado ele causa +10% de dano em ataques que fizer pela duração do foco.\n* Em Massa: Suas zonas agora tem seu raio reduzido em 1,25m mas sua recarga é reduzida para 1 rodada.\n* Ofensiva: Quando acertar um inimigo você pode gastar +3 STA para dar um golpe adicional que causa 50% a menos de dano mas cura 25% a mais.\n\n* NÍVEL 12:\nescolha uma cura / efeito secundária:\nUma Forma de Fuga: Você sempre está preparado para o pior. Você manifesta uma distração ou simplesmente desaparece sem deixar rastros. Você pode gastar 4 STA para receber +3 em testes de furtividade e uma recuperação de 10% da saúde máxima por 2 rodadas, deixando então essa habilidade em recarga por 5 rodadas após o fim da sua duração. Enquanto ativo inimigos que tentam lhe procurar constam como cegos até que você realize uma ação ofensiva ou tome qualquer ação chamativa. Sempre que usa essa habilidade seu custo aumenta em 1 STA, reiniciando no fim do dia.\nEscudo Protetor: Tomem cobertura. Você cria uma barreira, sua aparência e formato dependendo de sua ideia, essa absorve todo dano direcionado a seres atrás dela. Você pode gastar 7 STA para criar um escudo de dimensões variadas, podendo ter uma soma de altura + comprimento = 10m. Ataques feitos por você e seus aliados atravessam o escudo sem o danificar, porém os de inimigos param assim que o atingem (o escudo ignora perfuração). Você pode escolher se quer que o escudo seja físico ou não, assim significando que nem você nem aliados ou inimigos podem o atravessar ou por um outro lado todos podem o ultrapassar. O escudo possuí vida igual a (2,5 x nível) + (3 x cura) e desaparece após 4 rodadas. Essa habilidade tem uma recarga de 3 rodadas após a sua destruição / fim de sua duração. Sempre que usa essa habilidade seu custo aumenta em 1 STA, reiniciando no fim do dia.\nn18: 45+(3xc)      n20: 50+(3xc)      n22: 55+(3xc)      n24: 60+(3xc)      n26: 65+(3xc)      n28: 70+(3xc)\nn30: 75+(3xc)\nLigação Espiritual: Um por todos e todos por um. Você forja uma conexão física entre você e aliados para que todos se mantenham saudáveis. Você pode gastar 4 STA por alma conectada e uma ação normal para conectar a até 5 seres (contando com você mesmo) que estejam a até 12,5m de você por 3 rodadas. Enquanto conectados o dano sofrido por cada ser é dividido com os outros seres também afetados, assim todo dano causado em qualquer um desses seres é dividido igualmente entre todos os seres. Essa habilidade tem uma recarga de 7 rodadas após o fim de sua duração.\nvocê recebe buffs a sua cura principal:\n* Sua habilidade Recuperação Direta recebe uma nova utilização: Uma vez por rodada, ao acertar um ataque ou cura você pode gastar 4 STA para recuperar um valor de saúde de si mesmo igual ao dano / cura causada.\n* Sua habilidade Recuperação Constante recebe uma melhoria: Seus focos de cura se mantém em alvos por +1 rodada mas custam +2 STA.\n* Sua habilidade Recuperação Em Massa recebe uma melhoria: Suas zonas de cura agora podem ser conjuradas em qualquer ponto em um alcance de 5m. Adicionalmente, quando uma zona mais de 1 rodada inteira sem ninguém entrar nela (não conta você mesmo) você pode gastar uma ação simples para desfazer ela, recuperar sua STA e remover a recarga da zona em questão, sempre que fizer isso você também recupera 10% da sua saúde máxima. Suas zonas de cura agora custam +2 STA\n* Sua habilidade Recuperação Ofensiva recebe uma melhoria: agora tem a cura fornecida para aliados na área aumentada para 33% do dano causado (a cura própria continua igual). Adicionalmente gasta +3 STA ao curar um ser específico a 10m do alvo acertado, porém cura 100% do dano causado.\n* Sua habilidade Recuperação Versátil tem sua cura aumentada para 70% do valor original.\n* NÍVEL 18:\nescolha uma cura / efeito secundária:\nBarreira Inquebrável: Recebam minha virtude. Você cria uma explosão de vida, uma zona de quase imortalidade a aliados próximos de você. Uma vez por dia você gasta uma ação simples e 50 STA para posicionar uma barreira que alcança até os céus com limites a 7,5m de raio da posição de manifestação por 4 rodadas. Aliados dentro da área recebem +2 DEF e reduzem qualquer dano que sofrem em 90%, sofrendo apenas 1/10 do dano que iriam sofrer normalmente. Adicionalmente, enquanto dentro da área inimigos ficam continuamente cegos, se saírem dela continuam com o efeito até o fim da primeira fase da próxima rodada.\nInspiração Absoluta: Avante! Você inspira seus aliados, fazendo eles superarem suas expectativas independente da situação e das complicações que podem estar lhes afetando. Uma vez por dia você pode gastar 50 STA para ativar uma onda de inspiração potente a todos os aliados a até 20m de você, gastando também uma ação normal. Ao ativar pelas próximas 3 rodadas você e todos seus aliados recuperam 20% da RES máxima por rodada, durante essa duração um ser pode ficar com um valor de resistência maior que seu máximo, continuando assim mesmo após o fim dessa duração.\nSegunda Chance: Enquanto alguém está de pé a batalha não acabou. Você traz de volta à luta aqueles que já caíram, também fortalecendo aqueles que ainda estão aqui. Uma vez por dia você pode gastar uma ação complexa (significando que pode ser interrompido caso alguém lhe aplique condições no meio da manifestação, sendo assim antes da sua segunda ação normal na segunda fase da rodada) e 60 STA para fazer uma conjuração automática que afeta aliados a até 100m de você. O efeito automático fornece 30 RES e faz com que qualquer condição física seja removida dos aliados afetados no alcance, além de também retirar aliados da condição moribundo. Após o efeito automático acontece um segundo efeito que dura 3 rodadas e afeta aliados a até 30m de você, esses podem ignorar uma única vez um ataque que lhe reduziria a 0 de saúde, ficando com 1 se saúde.\nvocê recebe buffs a seu modificador de cura:\nExpansiva:\n* Direta: O alcance de sua cura aumenta em 5m, adicionalmente você recebe um overflow de cura a cada 5 curas acertadas / ataques acertados. Sempre que manifesta um overflow você recebe um movimento adicional e recupera 20% da sua saúde máxima.\n* Constante: Você recebe um terceiro foco de cura, adicionalmente o alcance dos seus focos de cura aumentam em 7,5m.\n* Em Massa: Tamanho da sua zona aumenta em 2,5m de raio e você agora possuí uma zona secundária com recarga própria que tem tamanho 50% menor que o original.\n* Ofensiva: A área em que sua cura se dispersa aumenta em 5m e você também recupera 3 RES na primeira vez que realiza um ataque em cada fase da rodada.\nExplosiva:\n* Direta: Seus projéteis de cura agora não precisam ter um alvo específico, já que agora explodem no local de impacto, afetando uma área circular de raio 2,5m no local de impacto. Por conta disso você pode mirar num local ou num ser, fazendo então o teste em relação a todos os alvos que estejam na área.\n* Constante: Quando você coloca um foco de cura em um aliado você pode gastar +3 STA para adicionar uma aura de cura nesse foco, que passa a recuperar saúde de aliados a 7,5m do alvo com o foco, recuperando 50% da cura original.\n* Em Massa: Ao conjurar uma zona de cura inimigos dentro da zona são empurrados para até 2,5m de um dos extremos da zona. Suas zonas de cura fornecem um aumento de 10% de dano que seus aliados causam enquanto na área.\n* Ofensiva: Quando acertar um inimigo pela segunda vez com sua arma (1 vez a cada 2 ataques) com sua arma você pode gastar 4 STA para força-lo a fazer um teste de Metabolismo (DIF cura+6), caso não passe ele fica Lento até se deslocar, e caso passe ele não fica sob nenhuma condição. Além disso, ao usar essa habilidade você também aplica uma segunda vez sua cura em área se ele falhou no teste.\nPerfurante / Ricochete:\n* Direta: Seus ataques / curas agora perfuram inimigos e aliados, podendo acertar mais de um aliado ou inimigo com um único ataque caso estejam na sua linha de ataque (que tem grossura 2,5m). Ou seus ataques agora fazem ricochete duas vezes, podendo ignorar inimigos ou aliados no caminho do ataque e adicionalmente quando errar um teste de Cura você pode gastar 1 STA para refazer o teste.\n* Constante: Você pode manifestar um foco de cura ricochete gastando +3 STA, esse foco vai voando de um lado para o outro, ricocheteando nas paredes e curando seres acertados no caminho, ele se move até 7,5m uma vez por fase da rodada. Ele cura 25% a menos do que o normal, mas dura por 5 rodadas ao invés de 2.  (Esses contam como um de seus focos e portanto não podem ser feitos de maneira ilimitada, ocupando um espaço de foco enquanto existindo).\n* Em Massa: Inimigos dentro da sua zona agora sofrem 25% do valor da sua cura como dano.\n* Ofensiva: Quando acerta um inimigo, além de curar a si mesmo e seres na área você também causa dano a inimigos na área, causando 100% da cura recebida em dano\nRápida / Reutilizável:\n* Direta: Você agora pode fazer dois ataques / curas numa única ação.\n* Constante: Você agora possuí +3 focos de cura, e pode colocar 2 por etapa de rodada como ação simples, o quinto e sexto precisando de ações normais. porém suas durações mudam para apenas uma única rodada. Adicionalmente, ao colocar um foco de cura em um aliado ele causa +20% de dano em ataques que fizer enquanto com o foco.\n* Em Massa: Suas zonas agora tem sua recarga reduzida para 1 fase de rodada.\n* Ofensiva: Quando acertar um inimigo você pode gastar +5 STA pra dar um golpe adicional que cura 50% a mais.\nvocê recebe buffs a habilidades anteriores:\n* O Bônus de Sozinho, Mas Não Indefeso aumenta para +3,75m extra de deslocamento, +4 de DEF e permite rolar novamente 1 vez por rodada um teste feito, aceitando o segundo resultado casa tome essa ação.\n\n* NÍVEL 24:\nvocê recebe:\nLevantem, Meus Amigos: Quando um aliado seu estiver no estado moribundo e a menos de 3,75m de você, você pode ao invés de fazer um teste para remover à condição na verdade gastar 7 STA e uma ação normal para fazer as seguintes mudanças: retira do estado moribundo, pode se deslocar o dobro de deslocamento por 3 rodadas é recupera 10% de cada um de seus medidores (Funciona uma vez por aliado, por cena).\nvocê recebe buffs a sua cura principal:\n* Sua habilidade Recuperação Direta recebe uma melhoria: Você agora tem um bônus passivo onde 5% da cura fornecida por seus disparos é convertida em resistência para si mesmo, agora fazer um disparo custa 2 STA.\n* Sua habilidade Recuperação Constante recebe uma melhoria: Você recebe +1 foco e agora pode ter mais de um foco em um único ser por vez, seus focos tem seu custo aumentado em +1 STA.\n* Sua habilidade Recuperação Em Massa recebe uma melhoria: Suas zonas de cura podem ser imbuídas a objetos ou pessoas, gastando +2 STA e tendo seu raio reduzido pela metade, mas ficando fixa nessa coisa por sua duração, seguindo todo seu movimento.\n* Sua habilidade Recuperação Ofensiva recebe uma nova utilização: você recebe uma arma secundária de escolha, que atira um projétil que cura e também causa dano a seres que acerte. Esse projétil custa 5 STA e tem uma recarga de 5 rodadas, diminuindo essa em 1 rodada por alvo acertado (com recarga mínima de 2). Seu dano em seres acertados é de 5d10 + cura, a cura em alvos acertados é de 150% do valor causado pelo dano, enquanto a cura própria é de 50% do valor causado pelo dano. Por fim, esse cálculo de dano aumenta em um valor igual a sua cura para cada novo nível após esse.\nn24: 27 + c      n25: 27 + (2xc)      n26: 27 + (3xc)      n27: 27 + (4xc)      n28: 27 + (5xc)      n29: 27 + (6xc)    n30: 27 + (7xc)\n* Sua habilidade Recuperação Versátil tem sua cura aumentada para 70% do valor original.\n* NÍVEL 30:\nescolha uma cura / efeito secundária:\nEnergia Recuperativa Ilimitada: Suas habilidades do nível 18 tem seu limite por dia removido, podendo ser usada uma vez por combate, seu custo também aumentando em 10 STA a cada novo uso no mesmo dia.\nvocê recebe buffs a habilidades anteriores:\n* (Habilidade F recebe 1º buff).\n* O Bônus de Sozinho, Mas Não Indefeso aumenta para +5m extra de deslocamento e +6 de DEF e agora permite também uma vez por rodada, enquanto nessa distância gastar uma ação simples e 4 STA para curar 10 de Saúde de você e todos os aliados que estejam a mais de 7,5m e menos de 30m de você.\nvocê recebe buffs a seu modificador de cura:\nExpansiva:\n* Direta: O alcance de sua cura aumenta em 10m, adicionalmente você recebe um overflow de cura a cada 4 curas acertadas / ataques acertados. Sempre que manifesta um overflow você recebe um movimento adicional e recupera 20% da sua saúde máxima.\n* Constante: Você recebe um terceiro foco de cura, seus focos de cura adicionalmente o alcance dos seus focos de cura aumentam em 15m.\n* Em Massa: Tamanho da sua zona aumenta em 3,75m de raio e você agora possuí uma zona secundária com recarga própria.\n* Ofensiva: A área em que sua cura se dispersa aumenta em 5m e você também recupera 10 RES na primeira vez que realiza um ataque em cada fase da rodada.\nExplosiva:\n* Direta: Seus projéteis de cura agora não precisam ter um alvo específico, já que agora explodem no local de impacto, afetando uma área circular de raio 2,5m no local de impacto. Por conta disso você pode mirar num local ou num ser, fazendo então o teste em relação a todos os alvos que estejam na área. O centro da área acertada pelo seu projétil cura 200% do valor original.\n* Constante: Seus focos de cura agora também recuperam saúde de aliados a 7,5m do alvo com o foco, recuperando 50% da cura original.\n* Em Massa: Ao conjurar uma zona de cura inimigos dentro da zona são empurrados para até 5m de um dos extremos da zona. Suas zonas de cura fornecem um aumento de 25% de dano que seus aliados causam enquanto na área.\n* Ofensiva: Acertar um inimigo com uma arma deixa todos os inimigos dentro da sua área lentos até se deslocarem, sua área de cura aumenta em 2,5m.\nPerfurante / Ricochete:\n* Direta: Seus ataques / curas agora perfuram inimigos e aliados, podendo acertar mais de um aliado ou inimigo com um único ataque caso estejam na sua linha de ataque (que tem grossura 2,5m). Além disso, seus ataques também fazem ricochete duas vezes, podendo ignorar inimigos ou aliados no caminho dele e você não precisa mais fazer testes de cura para tentar acertar seus aliados.\n* Constante: Você pode manifestar um foco de cura ricochete gastando +7 STA, esse foco vai voando de um lado para o outro, ricocheteando nas paredes e curando seres acertados no caminho, ele se move até 10m uma vez por fase da rodada e dura pelo combate todo (Esses contam como um de seus focos e portanto não podem ser feitos de maneira ilimitada, ocupando um espaço de foco enquanto existindo).\n* Em Massa: Inimigos dentro da sua zona agora sofrem 75% do valor da sua cura como dano, suas zonas de cura tem raio aumentado em 1,25m.\n* Ofensiva: Quando acerta um inimigo, além de curar a si mesmo e seres na área você também causa dano a inimigos na área e deixa eles cegos por 1 rodada, causando 100% da cura recebida em dano.\nRápida / Reutilizável:\n* Direta: Você agora pode fazer dois ataques / curas numa única ação e recupera 15% da cura / dano causado em saúde para si mesmo.\n* Constante: Você agora possuí +2 focos de cura, e eles estão permanentemente ativos (sempre em um ser), podendo trocar de ser como ação normal. Adicionalmente, seres com focos de cura causam +20% de dano em ataques.\n* Em Massa: Suas zonas agora tem recarga reduzida para 1 fase da rodada, tem seu alcance de posicionamento aumentado em 5m, e pode curar duas vezes um mesmo ser caso esse esteja dentro de duas zonas ao mesmo tempo.\n* Ofensiva: Você pode fazer dois ataques com uma única ação normal, sua área de cura aumenta em 1,25m e você recupera em saúde própria 100% do dano causado."}]},{"id":"regras-de-jogo","title":"Regras de jogo","sections":[{"id":"regras-de-jogo-section-1","title":"4.1 · REGRAS GERAIS","content":"Neste capítulo mostraremos as regras básicas sobre combate, investigação, testes e entre outras."},{"id":"regras-de-jogo-section-2","title":"4.1.1 · REGRAS DE TESTES","content":"Categoria de Dados: Alguns poderes e inimigos podem mudar a sua categoria de dados, aumentando em um passo ou diminuindo em um passo, quando aumentar um dado você joga um dado de categoria maior (d4 para d6, d6 para d8, d8 para d10 e assim em diante), e quando diminuir você faz o oposto da ordem dita (d10 para d8, d8 para d6, d6 para d4).\n\nTentar Outra Vez: Em geral não é permitido tentar novamente um teste no qual tenha falhado. Porém, às vezes o mestre pode ter piedade e possibilitar uma segunda tentativa gastando outra ação. Nesse caso, se ele falhar outra vez terá consequências grandes pelo risco tomado em tentar fazer a mesma coisa de maneira desesperada (essas consequências podem ser definidas pelo mestre).\n\nTeste Conjunto: Quando múltiplos personagens tem o mesmo objetivo com uma ação e estão agindo em conjunto o mestre pode decidir que todos envolvidos na ação façam um mesmo teste e após todos realizarem esse, o mestre pega o resultado de todos eles e utiliza a regra de testes acumulados.\n\nTeste Auxiliado: Quando um personagem decide tomar uma ação e outro pretende ajudá-lo, não necessariamente tomando o mesmo esforço mas apenas dando uma mãozinha adicional, o realizador principal do teste define o valor principal enquanto a ajuda rola só 1d4+modificador e adiciona isso no teste principal.\n\nDiferença entre teste Auxiliado e Conjunto: um teste auxiliado é o único que pode ser feito em combate e na maioria dos casos o único permitido, sendo o teste conjunto mais usado para um trabalho em equipe direto (EX: Todos segurarem uma rocha que está caindo sobre eles em conjunto ou todos segurarem um único oponente, cada um ajudando a impedir que esse se mova).\n\nTestes de Resistência: Alguns testes específicos funcionam contra uma DIF específica como dita anteriormente, mas algumas vezes essa DIF não é uma DEF ou a dificuldade de achar algo, e sim funciona como o contrário, sendo assim a DIF o ataque sendo feito, e seu teste serve para EVITAR esse ataque. Normalmente esses testes são usados com as perícias: coragem, detecção, esquiva, metabolismo, proteção.\n\nTestes Acumulados: Quando uma situação envolve continuar tentando algo, muitas vezes sendo o caso em cenas de perseguição, furtividade e entre outras são necessários uma quantidade específica de valores de dados ou de sucessos em testes para ter um verdadeiro sucesso. Nesse cenário, o mestre pode definir algumas coisas:\n* Acumular x sucessos equivale a uma “vitória” no teste enquanto acumular x falhas tem o efeito oposto, sendo um evento desastroso equivalente a uma “derrota”.\n* Acumular x sucessos equivale a uma “vitória” no teste enquanto cada falha leva a uma perda de algo, talvez danificando um objeto, perdendo saúde ou outras coisas dependendo do contexto.\n* Conseguir uma vitória é uma questão de tempo, necessitando de um valor acumulado de resultados de testes para suceder, assim não tendo como “perder”, porém sempre que tem um valor muito baixo sofre um efeito negativo, assim sofrendo de pouco em pouco até conseguirem.\n* Conseguir uma vitória é uma questão de tempo, necessitando de um valor acumulado de resultados de testes para suceder, assim não tendo como “perder”, porém a cada rodada que não sucedeu ainda tem um efeito negativo, assim sofrendo de pouco em pouco até conseguirem.\n* Existem apenas x rodadas para se acumular o valor necessário de sucessos (que é menor), reiniciando esse valor e causando um efeito negativo sempre que essas x rodadas passam. Isso significa que o(s) personagem(ns) precisam tentar várias vezes até que consigam suceder dentro do número requisitado de ações.\n\nTestes Acumulados Difíceis: Semelhante aos testes acumulados, o mestre também pode optar por testes acumulados que envolvem outras mecânicas e tornam sucesso mais difícil:\n* Dificuldade Crescente: A cada sucesso obtido a dificuldade para obter um sucesso aumenta, cada vez se tornando mais complicado suceder.\n* Testes Múltiplos: Requer diferentes perícias para o total de sucessos acumulados.\n* Concentração: Testes acumulados podem ser requeridos que sejam sucessivos, assim uma falha reinicia a quantidade de sucessos já obtida.\n________________"},{"id":"regras-de-jogo-section-3","title":"4.1.2 · HABILIDADES E STAMINA","content":"Gasto de Ações: Grande maioria das habilidades têm descrito qual ação utilizar para usá-la, assim se uma habilidade ou feitiço estiver escrito “Ação Padrão” você gastará uma ação para utilizá-la. Habilidades que não especifiquem nenhuma ação são consideradas “Ação Simples”.\n\nCusto de Stamina: Habilidades com custo têm descrito o quanto de Stamina você vai gastar para utilizar uma habilidade, assim se estiver escrito que você tem que gastar 15 ST (Stamina) para utilizar essa habilidade.\n\nHabilidades Passivas: Existem habilidades que funcionam sem você precisar gastar Ação ou Stamina, assim ela está sempre ativa.\n\nRecarga: Algumas armas e habilidades precisam recarregar para serem reutilizadas. Todas as armas de disparo ou de fogo precisam ser recarregadas manualmente, ou seja, deve-se gastar uma ação simples ou complexa para recarregar a arma. Já as habilidades serão recarregadas normalmente, ao longo dos turnos. Por exemplo, se uma habilidade diz uma vez por fase da rodada ou uma vez por rodada ou uma vez por cena, isso significa que ela só recarrega na próxima vez que você agir, ou só recarrega na fase da próxima rodada equivalente a que a habilidade foi usada, ou na próxima cena que você participar.\n\nDuração: Assim como dito acima, algumas habilidades têm durações, significando o tempo que o efeito dela se mantém ativo, sendo uma rodada até você agir novamente (na próxima rodada).\n\nCondições a se Cumprir: Algumas habilidades precisam que você esteja em um estado específico para utilizá-lo. Exemplo: um poder de Herdeiro precisa que eu esteja com a minha vida no máximo.\n\nPré-Requisitos: Pré-requisito é uma necessidade que você tem que cumprir para ter um poder. Exemplo: Para ter uma certa é necessário ter +5 em Corpo\n\nAfinidade: Quando você atingir um certo nível específico você tem a possibilidade de Ter Afinidade com uma habilidade. A Afinidade pode mudar partes de uma habilidade, como o Gasto de Ações, Custo de Stamina, Dano e entre outros\n________________"},{"id":"regras-de-jogo-section-4","title":"4.1.3 · MODIFICADORES DE TESTE","content":"Vantagem e Desvantagem: Efeitos, habilidades, itens e outras coisas podem lhe fornecer vantagem ou desvantagem em um teste feito. Possuir vantagem significa que você rola um segundo dado quando faz seu teste, escolhendo o resultado maior dos dois, isso também significa que ao tirar o valor máximo num valor você rola dois dados para ver se terá um crítico no teste. No caso de desvantagem funciona exatamente como o contrário, ta
