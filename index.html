mbém rolando dois dados para ver se a falha é crítica.\nSorte: No começo de uma campanha cada jogador possuí um valor inicial de Sorte igual a 15, podendo gastar 1 valor para receber +1 em um teste. Sorte não pode ser recuperada.\n________________"},{"id":"regras-de-jogo-section-5","title":"4.1.4 · RECUPERAÇÃO E DESCANSO","content":"Recuperação de Saúde perdida fora de Combate: A única forma de recuperar Saúde perdida fora de combate é através de descanso, itens e algumas habilidades de classe. Enquanto isso, cura de retaguardas e habilidades de função não se aplicam nesses casos. Dependendo do descanso sua recuperação pode ser melhor ou pior, os tipos de descanso estão no capítulo 4.1.7.\nRecuperação Passiva de Resistência: Quando acabar uma cena que não seja de combate, você recupera metade da sua Resistência total.\nRecuperação de Resistência por Cobertura: Em cenas de Combate se você pode usar a ação Tomar Cobertura que custa uma ação padrão e requer que você não tenha feito (caso use na segunda fase da rodada) e não permitirá que faça (caso use na primeira) ações ofensivas (incluindo curar alguém que não está em cobertura com você) nessa rodada. Ao usar essa ação você recupera 10% de sua resistência total.\nRecuperação de Stamina por Descanso: A única forma de recuperar Stamina normalmente é por descanso, e dependendo do descanso você está tendo melhor é a sua recuperação, os tipos de descanso estão no capítulo 4.1.7.\n________________"},{"id":"regras-de-jogo-section-6","title":"4.1.5 · LIMITES DE MEDIDORES E MORTE","content":"Limite de Saúde: Ao ser reduzido a 0 pontos de saúde um ser fica sob a condição moribundo, podendo agir mas tendo os efeitos de qualquer ação que fizer diminuído, ataques, cura, habilidades e movimento todos pela metade. Enquanto com a condição o ser ainda continua tendo a possibilidade de morrer mesmo que curado, qualquer cura que afete um ser nessa condição será contada, aumentando sua vida normalmente, mas não removendo a condição dele.\nUm ser nessa condição precisa fazer um teste de metabolismo DIF 8 sempre que sofre dano, recebendo uma lesão sempre que falha em um teste. Esse teste tem sua DIF aumentada em 3 a cada teste feito anteriormente nessa cena. Por fim, no início da sua 5° rodada com a condição você morre, independente se somente passou em testes. Mais sobre essa condição no capítulo Condições.\nLimite de Resistência: Enquanto sua resistência atual for de um valor igual ou superior a metade da sua resistência máxima você pode usar a ação Defender em qualquer ataque que levar nessa rodada, sem um limite de vezes por rodada. Porém, enquanto com menos da metade da sua resistência máxima você só pode usar Defender uma vez por rodada, e por fim caso não possua nenhum valor atual de resistência não pode usar a ação Defender.\nLimite de Stamina: Ao ser reduzido a 0 pontos de Stamina, um ser fica Vulnerável, Desgastado e é incapaz de usar qualquer habilidade que tenha custo. Mais sobre essas condições no capítulo Condições.\nGolpes Finais: Alguns tipos de ataque que reduzem um ser a 0 pontos de saúde podem o deixar inconsciente ao invés de moribundo, nesse caso atacar esse ser remove a condição inconsciente dele e o deixa moribundo se ele ainda está sem nenhum ponto de saúde.\nExecução: Alguns tipos de ataque podem possuir a característica execução I, II ou III. Um ataque com execução I que reduz um ser a 0 pontos de saúde requer imediatamente um teste de metabolismo, possivelmente já causando uma falha assim que ele inicia com a condição. Já com execução II o teste automático resulta na morte instantânea do alvo em caso de falha e em uma lesão em caso de sucesso. Por fim, com execução III acontece a mesma coisa que execução II porém com o teste tendo sua dificuldade aumentada em 4 e também fazendo com que o ser morra após 4 rodadas com a condição ao invés de 5.\n________________"},{"id":"regras-de-jogo-section-7","title":"4.1.6 · LESÕES","content":"Role 1d20 ao adquirir uma lesão para defini-lá:\n1-4\n\tFerimento Letal: Você morre.\n\t5-9\n\tMorte Lenta: O ferimento é fatal, mas gera um surto de adrenalina que permite a você agir uma última vez. Você fica com 1 de Saúde e, se estava inconsciente, acorda, podendo agir na rodada seguinte. Contudo, ao fim dela, você morre. Nenhum efeito pode impedir isso. Use esse tempo para um último ato heróico ou, pelo menos, para dizer suas últimas palavras.\n\t10-11\n\tLaceração Profunda: Uma ferida que reduz sua capacidade física. Perde saúde e resistência máxima igual ao seu nível.\n\t12-13\n\tPerda de Olho: Você perde 1 de seus olhos, você perde 1 no seu modificador de perspicácia e sofre de -1 em outros testes de outros atributos que também utilizem sua visão. Se conseguir esse efeito uma segunda vez fica permanentemente sob efeito da condição cego.\n\t14-15\n\tPerda de Mão: Você perde o uso de uma mão ou de um braço (esse membro pode ter sido decepado ou inutilizado, como ter seus nervos rompidos ou ossos estilhaçados). Só pode empunhar um item por vez, não pode mais empunhar armas pesadas e, em tarefas que precisam das duas mãos, usa sempre um dado com passo inferior ao que iria utilizar\nou até mesmo falha automaticamente, à critério do mestre.\n\t16-17\n\tSem Pé: Você perde o uso de um pé ou de uma perna (esse membro pode ter sido decepado ou inutilizado, como ter seus nervos rompidos ou ossos estilhaçados). Fica permanentemente sob a condição lento e, em tarefas que precisam do uso dos pés sempre um dado com passo inferior ao que iria utilizar testes da ação movimentar-se e em testes de perseguição a pé.\n\t18\n\tÓrgão Interno Comprometido: Um de seus órgãos internos, como coração, pulmão ou fígado, tem sua capacidade reduzida. Sofre –1 em testes de Corpo.\n\t19\n\tMúsculo Comprometido: Um de seus músculos têm sua capacidade reduzida, diminuindo sua força e rapidez. Sofre –1 em testes de Destreza.\n\t20\n\tCicatriz Marcante: Uma cicatriz feia e aparente pode ser vista em seu corpo. Sofre -1 em testes de Charme.\n\t________________"},{"id":"regras-de-jogo-section-8","title":"4.1.6 · SANIDADE E TRAUMAS","content":"Um personagem pode acumular contadores de sanidade de muitas maneiras diferentes, e esses indicam o estado mental desse indivíduo. Um indivíduo pode acumular coragem+8 contadores de sanidade antes de ficarem com a condição enlouquecendo. Realizar um descanso completo remove 2 contadores de sanidade. Por fim, ao adquirir um trauma role 1d20 para defini-lo:\n\n1-7\n\tColapso Total: Sua mente sucumbe perante o horror. Seu corpo continua vivo, mas torna-se uma casca oca.\n\t8-11\n\tTranstorno de Estresse Pós-Traumático: Sempre que você recebe 1 contador de sanidade, receba +1, duplicando sua perda de consciência.\n\t12-15\n\tDegradação Cognitiva: O medo corroi sua capacidade de lógica.\nVocê perde 1 de Raciocínio.\n\t16-17\n\tMácula Psíquica: Sua visão de mundo se torna mais cinzenta.\nVocê perde 1 de Charme.\n\t18-19\n\tDissociação Frequente: Algo em seu espírito se quebra, te deixando distraído a todo momento. Você perde 1 de Perspicácia.\n\t20\n\tRetração Defensiva: O trauma faz você evitar contatos sociais, você perde todos os benefícios de relação com NPCs e outros jogadores\n\t________________"},{"id":"regras-de-jogo-section-9","title":"4.1.8 · PERIGOS","content":"* Fogo\nLugares contaminados por chamas e incêndios causam com que personagens que passam em meio a ele consigam pontos de chamas toda rodada, de acordo com quanto o mestre ver como viável. Aumentando o dano que sofre quanto mais tempo passa ali.\n* Água\nEnquanto embaixo da água você sofre constantemente da condição asfixiado.\n* Queda\nCair de lugares altos pode resultar em danos colaterais, sofrendo sempre 1d3 de dano a cada 4m caídos tendo dois tipos de quedas diferentes:\nQueda Calculada: Acontece quando um ser pula de um lugar de maneira consciente ou quando um ser que caí de maneira acidental passa no seu teste de amortecer queda ou aterrissar.\nQueda Acidental: Acontece quando um ser é empurrado ou escorrega de um lugar alto, assim podendo fazer um teste de acrobacia ou escalagem dependendo do caso. Se passar num teste de amortecer queda ou aterrissar a queda vira calculada.\n* Pressão\nVocê consegue resistir enquanto sob baixa pressão, porém perde 2 de saúde máxima cada rodada que siga assim, recuperando todos caso saia desse estado.\n* temperatura;\n* fumaça;\n* veneno;\n* eletricidade;\n* explosões;\n* desabamento e gravidade;\n* terreno árduo"},{"id":"regras-de-jogo-section-10","title":"4.2.1 · INÍCIO DO COMBATE","content":"Um combate pode se iniciar da maneira normal, onde todos já estavam prontos para isso ou com um personagem tomando uma ação que começa um combate antes deste começar, fazendo sua ação e iniciando o combate logo após, dando a preferência para ele na ordem de jogada. Outra opção é com um ataque surpresa, um personagem desprevenido é acertado sem poder reagir e então inicia-se um combate, dando a preferência para todos menos aquele que fez o ataque em um ser desprevenido.\n________________"},{"id":"regras-de-jogo-section-11","title":"4.2.2 · RODADA","content":"Em um combate não existe uma ordem de rodadas com ações acontecendo uma antes da outra, o combate nesse sistema tem um foco realista onde todos estão agindo ao mesmo tempo e não conseguem tomar ações com base no que outras pessoas fizeram (e quando fizerem isso considere como meta). Por esse motivo, no combate todos anunciam sua ação e tem um breve momento para poderem falar, podendo todos na cena falarem uns com os outros com base no que viram e estão vendo atualmente até esse ponto na rodada.\n\nUma rodada então é dividida em duas ações comum em dois momentos diferentes, essa duas ações são divididas em dois segmentos, sendo a primeira tomada na:\n1° FASE DA RODADA: Essa é a ação automática, ou seja, o que as pessoas fazem de cara no combate, ações sem tanto pensamento a longo prazo e sim uma preparação ou tomada de ofensiva rápida para criar pressão, porém também lhe deixando vulnerável. Depois de todos tomarem essa ação inicia-se a segunda fase.\n2° FASE DA RODADA: Essa é a ação onde todos reagem às decisões prévias que os outros fizeram na primeira fase (mecanicamente falando essas ações dependem do que pode ser considerado justo no quesito de: aconteceu agora / aconteceu antes, e por isso cabe ao mestre decidir se podem ser feitas ou não, e por isso acabam por ser bastante narrativas).\n\nEXEMPLO: Jeremias, Carlos e Marco estão lutando contra Peter e Tobias.\nNa 1º Fase, Jeremias e Peter anunciam que irão se defender enquanto Carlos anuncia que vai se movimentar para a direção dos oponentes enquanto recarrega sua pistola, já Tobias diz que irá ficar mirado caso alguém se mova. Marco preparou os componentes para conjurar um feitiço.\nNa 2° Fase, Carlos estava se movimentando em direção a eles e irá terminar seu movimento ao se aproximar de Peter e disparar contra ele, porém ao fazer isso também permite com que Tobias atire nele antes que esse se aproxime por conta de sua ação estar associada a esperar o outro agir, só depois de levar o tiro de Tobias, Carlos consegue acertar Peter. Por fim, Peter, Marco Jeremias que estavam tomando ações preparativas e defensivas agem por último e fazem seus respectivos ataques, feitiços e etc.\n________________"},{"id":"regras-de-jogo-section-12","title":"4.2.3 · ATAQUES E REAÇÕES DEFENSIVAS","content":"Existem 3 etapas quando considerando um ataque que foi feito, independente se este usa Luta, Disparo ou Controle (às vezes oculto em rituais ofensivos que atacam ao invés de terem sua própria dificuldade).\n\nA primeira etapa é a rolagem desse teste de ataque para ver se este acerta a Defesa base do seu alvo, caso erre o ataque nem precisa avançar em etapas. A segunda etapa é quando o alvo decide se vai usar a ação Defender ou não (não pode ser usada contra disparos à distância), caso use ele rola um teste da perícia Proteção e compara com o teste de ataque do oponente, caso o teste do oponente seja maior que o seu você rola o dano do ataque e ele perde em resistência ⅓ do valor de dano causado por esse ataque e não perde saúde. Se o teste dele for igual ou menor que o seu você rola o dano do ataque e ele perde 1/2 do valor que o dano iria causar em saúde e a outra 1/2 em resistência.\n\nEnquanto sua resistência atual for de um valor igual ou superior a metade da sua resistência máxima você pode usar a ação Defender em qualquer ataque que levar nessa rodada, sem um limite de vezes por rodada. Porém, enquanto com menos da metade da sua resistência máxima você só pode usar Defender uma vez por rodada, e por fim caso não possua nenhum valor atual de resistência não pode usar a ação Defender.\n________________"},{"id":"regras-de-jogo-section-13","title":"4.2.4 · AÇÕES NORMAIS DE COMBATE","content":"Atacar: Tente acertar um alvo usando disparo ou luta (mais no CAP 4.2.3).\nDerrubar (M): Teste de manobra seu contra um de um alvo adjacente, se vencer você consegue o deixar sob a condição de derrubado.\nDesarmar (M): Teste de manobra seu contra um de um alvo adjacente, se vencer você consegue remover um item que esteja segurando da mão dele.\nEmpurrar (M): Teste de manobra seu contra um de um alvo adjacente, se vencer você consegue o empurrar 1,5m x seu modificador de força.\nAgarrar (M): Teste de manobra seu contra um de um alvo adjacente, se vencer você consegue deixar o ser sobre a condição agarrado, porém não podendo realizar ações que envolvam o corpo enquanto agarrando o ser, deixando de o agarrar se fizer isso.\nQuebrar: Teste de força para causar dano na vida do objeto (ver CAP 4.1.), causando dano equivalente a do seu teste de força.\nTomar Cautela / Cobertura: Se esconde atrás de uma cobertura, recuperando 4% de sua RES máxima e também ficando protegido até tomar uma ação ofensiva ou ser acertado.\nPrimeiros Socorros: Teste de medicina DIF 10 para remover a condição moribundo de um ser.\nDeslocar: Se movimenta 7,5m em uma direção de escolha, podendo repartir seu movimento para se movimentar o máximo possível.\nPreparar: Não age nessa ação, mas se prepara para um certo acontecimento, recebendo uma ação para poder agir se um personagem específico tomar essa ação, agindo antes dele.\nMirar: Foca em um alvo específico, removendo qualquer efeito negativo que tenha que afete sua mira pela duração do seu próximo ataque a distância e fornece +2 num teste de disparo caso não possua nenhum efeito negativo. Ao usar essa ação seu próximo ataque a distância ignora seres tomando cobertura e alvos que estejam no caminho do ataque.\nLevantar: Remove a condição derrubado ou simplesmente saí do chão.\nEsconder-se: Toma uma posição onde não possa ser visto, evitando que seres lhe percebam, caso use essa ação quando já envolvido em combate ou quando já havia sido avistado o ser ainda têm noção da sua localização. Para que isso não aconteça você precisa se deslocar enquanto furtivo, realizando um teste de furtividade para evitar ser avistado enquanto se move, assim podendo pegar ele de surpresa por estar em um local diferente de onde ele pensa.\nAjudar: Você pode ajudar outro personagem a terminar uma ação dele, gastando sua ação para auxiliar uma ação que este tem a intenção de fazer mas não conseguiu ainda (não pode simplesmente atirar por ele e sim pode fazer algo mais prático).\n\nM: manobra de combate\n________________"},{"id":"regras-de-jogo-section-14","title":"4.2.4 · AÇÕES COMPLEXAS E SIMPLES DE COMBATE","content":"Investida (COM): Se desloca 12,5m e realiza um ataque com +1 no teste.\nGolpe de Misericórdia (COM): Faz um ataque que automaticamente conta como crítico (só pode ser feito num ser inconsciente).\nConjurar (COM): Tente acertar um alvo com um feitiço (mais no CAP 3).\nPegar Objeto (SIM): Uma vez por rodada você pode pegar ou entregar um objeto como uma ação simples.\nSacar Item (SIM): Uma vez por rodada você pode trocar de lugar um item de suas mãos com um de seu inventário como uma ação simples.\n________________"},{"id":"regras-de-jogo-section-15","title":"4.2.5 · TIPOS DE DANO","content":"* FÍSICOS:\n   * Cortante\n   * Perfurante\n   * Contundente\n* NATUREZA:\n   * Fogo\n   * Gelo\n   * Podridão\n   * Trovão\n   * Veneno\n   * Radioativo\n* ESPECIAIS\n   * Psíquico\n   * Radiante\n   * Obscuro\n* HIEROFANTES\n   * Fantasmagórico\n   * Vampírico\n   * Apaixonante\n   * Metafísico\n________________"},{"id":"regras-de-jogo-section-16","title":"4.2.6 · DANO CRÍTICO E VULNERABILIDADE","content":"Quando um ataque é considerado um acerto crítico (tirou valor máximo em um dado e um valor igual ou maior que 7 no segundo) na hora de rolar o dano do ataque você multiplica o dano que ele causaria por 1,5.\n\nQuando um ser sofre dano de um tipo que ele possuí vulnerabilidade ou sofre dano enquanto com a condição vulnerável ele leva esse dano multiplicado por 1,5.\n________________"},{"id":"regras-de-jogo-section-17","title":"4.2.7 · RESISTÊNCIAS A DANO","content":"Algumas habilidades podem entregar Resistência a certos Danos, você reduz o dano que levaria a sua resistência a dano, podendo essa ser de dano de maneira geral ou de um tipo específico.\n________________\n\n4.2.8 CATEGORIAS [c]DE DISTÂNCIA\nUm Quadrado = 1,25m\nAlcance Adjacente = 0m-1,25m\nAlcance Próximo = 1,25m-10m\nAlcance Médio = 10m-20m\nAlcance Extenso = 20m-35m\nAlcance Distante = 35-60m\nAlcance Extremo = 60m-100m\nAlcance Ilimitado = 100m+\n________________\n\n4.2.9 PvP\nEm muitos casos pode acontecer uma luta entre Jogadores, sendo aliados ou não, e nesses casos temos uma solução para caso aconteça. Todas as curas são reduzidas pela metade, assim deixando mais balanceado e justo\n________________"},{"id":"regras-de-jogo-section-18","title":"4.2.10 · TERMOS IMPORTANTES","content":"________________\n\nSAU: Saúde\nSobre Saúde: SobreSaúde são pontos de Stamina extras, além do seu limite. Sobre Saúde acaba no final de uma cena\nRES: Resistência\nSobre Resistência: SobreResistência são pontos de Resistência extras, além do seu limite. Sobre Resistência acaba no final de uma cena\nSTA: Stamina\nSobre Stamina: Sobre Stamina são pontos de Stamina extras, além do seu limite. Sobre Stamina acaba no final de uma cena"},{"id":"regras-de-jogo-section-19","title":"4.4 · CENAS DE INVESTIGAÇÃO","content":"Cenas de investigação têm por objetivo desvendar um mistério. Elas envolvem vasculhar um ambiente, analisar documentos, interrogar pessoas e tomar quaisquer outras atitudes em busca de pistas. Contudo, não espere resolver todos os problemas apenas com rolagens de dados. Em Ordem Paranormal RPG, não apenas seu personagem irá investigar, mas você também! Você precisará analisar as evidências, criar hipóteses e desvendar enigmas para ter sucesso na investigação. Seu objetivo será encontrar a maior quantidade possível de pistas. E as pistas serão encontradas nos pontos de interesse.\n\n4.4.1 COMO FUNCIONA UMA CENA DE INVESTIGAÇÃO?\n1. No início da cena, o mestre descreve o ambiente, deixando claro quais são seus pontos de interesse.\n2. Na rodada de cada personagem, ele usa uma das ações de investigação da lista a seguir. De acordo com a ação do personagem, ele pode receber uma ou mais informações, retiradas dos pontos de interesse.\n3. Esse ciclo se repete, até os personagens decidirem parar de investigar — seja por\nestarem satisfeitos com as pistas adquiridas, seja por não quererem sofrer dano pela sobrecarga mental. Também é possível que fatores externos interrompam a investigação, como a chegada de uma criatura.\n\nPONTOS DE INTERESSE:\nOs elementos da cena, como lugares, objetos ou pessoas, com os quais os personagens\npodem interagir em busca de pistas. No início da investigação, o mestre cita seus pontos\nde interesse, para que os jogadores decidam onde querem investigar.\nPor exemplo, na cena de um assassinato, os pontos de interesse podem ser o corpo da vítima, um celular caído ao lado dele, o piso manchado de sangue e uma testemunha que escutou os gritos. Cada ponto de interesse é apresentado em um quadro com as seguintes informações:\n* Cabeçalho: Contém o nome e a descrição básica do ponto de interesse. A descrição básica é narrada quando um personagem usa a ação “investigar” no ponto de interesse (depois da primeira vez, o mestre não precisa repetir a descrição básica, embora possa fazer isso se o jogador pedir).\n* Quadro de Informações: Traz informações que o personagem pode encontrar no ponto de interesse ao usar a ação investigar nele, de acordo com a perícia que escolher e seu valor nela (ou seu resultado no teste).\n* Descrição contextual: Uma explicação completa do ponto de interesse. Deve ser lida apenas pelo mestre, para ajudá-lo a guiar qualquer interação dos personagens com o ponto de interesse.\n\nPontos de interesse podem trazer outros elementos além de pistas, tanto benéficos quanto prejudiciais. Um personagem investigando um armário de medicamentos pode encontrar um\ncicatrizante — ou pode se cortar nos cacos de um frasco quebrado, sofrendo d4 pontos\nde dano. Se houver, isso estará na descrição contextual. Também é possível que um ponto\nde interesse não tenha pistas, servindo apenas para atrapalhar os personagens. Os jogadores\ndevem ficar atentos às descrições do mestre para reduzirem a chance de perderem tempo\ncom pontos inúteis.\n\nAÇÕES DE INVESTIGAÇÃO:\n* INVESTIGAR:\nPasso 1: Ponto de Interesse\nEscolha um dos pontos de interesse da cena. O mestre narra a descrição geral do ponto.\nPasso 2: Investigar ou Interagir\nEscolha entre investigar ou interagir:\n* INVESTIGAR\nO mestre lista as perícias disponíveis do ponto de interesse. Você escolhe uma dessas perícia e fala seu dado nela. Por exemplo, se uma das perícias listadas for Intuição e você tiver Intuição d6 e quiser escolhê-la, deve falar “Intuição d6”. Então, o mestre narra as informações de todas as linhas da perícia escolhida cuja DIF seja igual ou menor que seu valor. Essas informações são dadas automaticamente, sem necessidade de teste! Você as recebe de forma “passiva”, por sua capacidade ou conhecimento. Depois disso, vá para o Passo 3.\n* INTERAGIR\nVocê uma interação simples com o ponto de interesse, como abrir uma gaveta para olhar o que há dentro dela, retirar uma foto da moldura para ver se há algo escrito atrás dela, etc. De acordo com a sua ação, o mestre pode lhe dar informações ou pedir um teste. Após interagir, seu turno acaba.\nPasso 3: Investigação Aprofundada\nCaso tenha escolhido Investigar, escolha entre Observar e Examinar.\n* OBSERVAR\nEscolha outra perícia listada e diga seu valor nela. O mestre narra as informações de todas as linhas dessa perícia cuja DIF seja igual ou menor que seu valor nela (exatamente como no passo anterior).\n* EXAMINAR\nFaça um teste da perícia escolhida no passo anterior. O mestre narra as informações de todas as linhas dessa perícia cuja DIF seja igual ou menor que o resultado de seu teste. Porém, se você não receber nenhuma informação nova, perde 2 STA.\nApós Observar ou Examinar, seu turno acaba.\n* RECAPITULAR:\nVocê reflete sobre o que já sabe da investigação em questão, em busca de uma ideia ou palpite. Para usar esta ação, você deve interpretar seu personagem recapitulando todas as informações que o grupo já recebeu ou encontrou. Se o mestre julgar a recapitulação coerente, você pode fazer um teste de Intuição (DIF 8). Se você passar, descobre uma nova pista a critério do mestre. Uma vez que um personagem seja bem-sucedido nesta ação, ela não poderá ser usada novamente na mesma cena.\n* COMPARTILHAR:\nVocê compartilha uma informação com outro personagem, na esperança de que ele perceba algo que você deixou escapar. Para usar esta ação, você deve interpretar seu personagem explicando uma pista que descobriu nesta cena para um aliado. Então, esse aliado deve fazer um teste de Investigação (DIF 7) como uma ação livre. Se ele passar, deduz uma nova pista a critério do mestre. Uma vez que um personagem seja bem-sucedido nesta ação, ela não poderá ser usada novamente na mesma cena.\n* USAR HABILIDADES E ITENS:\nCertas habilidades e itens possuem efeitos em cenas de investigação, explicados em suas descrições. Além disso, os jogadores podem encontrar usos criativos para efeitos que normalmente não afetam investigações. O mestre decide se uma habilidade ou item pode ser usado em uma ação de investigação e, se puder, qual seu efeito (normalmente um aumento de passo no teste em questão)."},{"id":"regras-de-jogo-section-20","title":"4.4.2 · DESAFIOS DE ACESSO","content":"Em uma investigação, muitas vezes haverá pistas bloqueadas por algum tipo de obstácu-\nlo. Para isso, os personagens deverão vencer desafios de acesso. Existem vários tipos de\ndesafios.\n\nABRIR FECHADURAS:\nPara abrir uma fechadura trancada, seja em uma porta, cofre ou outro objeto, você pode DESTRANCÁ-LA (usando técnica) ou ARROMBÁ-LA (usando força bruta).\n\n* Destrancar:\nVocê tenta abrir uma fechadura com técnica. Para isso, deverá vencer o desafio a seguir.\n1. O mestre rola uma quantidade de dados que varia conforme a complexidade da tranca. O resultado dos dados, na ordem em que são rolados, é a senha a ser descoberta. O mestre deverá manter os dados escondidos, como uma “senha”.\n2. Você pega a mesma quantidade de dados e, ao invés de rolar, os posiciona com os números que quiser virados para cima. Esta é sua tentativa de descobrir a senha.\n3. O mestre então indica, na sequência, se cada um dos números está alto, baixo ou exato.\nPor exemplo: em uma fechadura de 3d6, o mestre rola os números 3-5-2. O jogador coloca os dados 4-5-1. O mestre então responde “baixo, exato, alto”.\n\nSe não acertar de primeira, você pode continuar tentando — a cada rodada, pode fazer um número de tentativas determinado por seu valor de Crime (Crime +0 = 1 tentativa por rodada; +1 = 3 tentativas, +2 = 4 tentativas, +3 = 5 tentativas, +4 = 6 tentativas por rodada). Porém, a fechadura possui um número máximo de tentativas, de acordo com sua resistência (determinado pelo texto da missão). Se o número máximo de tentativas for excedido, a fechadura é danificada e não poderá mais ser aberta na técnica, restando apenas arrombá-la na força bruta ou encontrar a chave correta. Para maior imersão, o mestre pode substituir as palavras “baixo, alto e exato” por uma simulação de sons, como “tic, toc e click”, e o jogador precisará interpretar qual som significa baixo e qual som significa alto, adicionando uma camada extra de dificuldade.\n\n* Arrombar:\nVocê tenta abrir uma fechadura com força bruta. Para isso, gaste 1D3 PV (pelo esforço) e\nfaça um teste de Força contra uma DIF definida pelo objeto. Se passar, anote uma pontuação igual a metade do seu teste. Você precisa acumular uma pontuação alvo igual a durabilidade do objeto — quanto mais resistente, maior a pontuação alvo necessária. Além disso, arrombar uma fechadura pode trazer consequências inesperadas, como fazer barulho e atrair atenção de guardas (ou criaturas) ou danificar seu conteúdo.\n\nTESTES DE EQUILÍBRIO:\nPara fazer um teste de equilíbrio, você rola 2d10. Você não soma os resultados; em vez disso,\ncompara um com o outro. Se os resultados forem iguais ou tiverem 1 ponto de diferença entre si, você se equilibra. Caso contrário, começa a cair. Por exemplo, se você rolar 5 e 5 terá se equilibrado. Se rolar 5 e 6, também. Mas, se rolar 5 e 7, começará a cair.\n* Dados de Equilíbrio:\nQuando começa a se equilibrar, você recebe um número de dados de equilíbrio igual a seu modificador de Acrobacia +1 (ou seja, se você tem Acrobacia 1 recebe 2 dados de equilíbrio, se tem Acrobacia 2 recebe 3 dados de equilíbrio e assim por diante). Dados de equilíbrio são\nsempre d4.\nApós rolar os 2d10, se estiver caindo, você pode rolar um dado de equilíbrio e somar seu resultado a um dos d10 à sua escolha. Você pode repetir esse processo, mas dados de equilíbrio rolados são gastos e não são recuperados até o fim da travessia.\n* Exemplo:\nUm personagem com Acrobacia 2 (3d4 de equilíbrio) começa a atravessar o tronco.\nNa primeira rodada, rola 3 e 4, conseguindo se equilibrar.\nNa segunda rodada, rola 6 e 9. Por enquanto, está caindo! Ele gasta um de seus dados de equilíbrio e rola 2. Somando esse 2 ao 6, fica com os resultados 8 e 9, conseguindo se equilibrar.\nPorém, agora só tem dois dados de equilíbrio.\nNa terceira rodada, rola 5 e 7. Ele gasta um dado de equilíbrio e rola 4 — um número ruim para o momento, pois, somando o 4 ao 5, fica com os resultados 9 e 7. Ele gasta mais um dado de equilíbrio (seu último). Infelizmente, rola outro 4! Se tivesse rolado 1, 2 ou 3 teria conseguido se equilibrar, pois ficaria com os resultados 9 e 8, 9 e 9 ou 9 e 10. Mas, tendo rolado 4, termina com os resultados 9 e 11. Perto do fim da travessia, ele se balança para um lado, se balança para o outro, mas no fim acaba caindo. Tomara que saiba nadar.\n\nALCANÇAR:\nÀs vezes, você precisará alcançar algo em um lugar de difícil acesso, seja por estar muito alto, do outro lado de um buraco, atrás de um espaço apertado, etc. Você pode tentar isso de forma segura ou arriscada.\nAlcançar do jeito seguro: Você tenta alcançar algo de forma lenta e cuidadosa. Você precisa gastar duas rodadas em sequência (isso significa que está se preparando para um salto, escalando de forma devagar, etc.). Para cada rodada, precisa fazer um teste de Acrobacia (DIF definida pelo ambiente). Se passar nos dois, alcança o que queria ao final da segunda ação. Se falhar em qualquer um deles, recebe 1d3 de dano e precisa começar de novo.\nAlcançar do jeito arriscado: Você tenta alcançar algo de forma rápida e ousada. Gaste uma ação e faça um teste de Acrobacia (DIF definida pelo ambiente +3). Se passar, alcança o que queria. Se falhar, recebe dano igual a RA.\n\nSUSTENTAR:\nEm alguns cenários, você precisará erguer ou empurrar algo pesado, enquanto outro personagem analisa uma pista que está embaixo ou atravessa uma passagem que foi aberta\ndessa maneira. Para mover o objeto, gaste 1 PV e faça um teste de Força. No final de cada rodada, se quiser continuar sustentando o objeto, você precisará fazer um novo teste de Força. Esse teste sofre uma redução de passo por rodada, começando em d12 e terminando em d8, representando que você está ficando cada vez mais cansado.\n\nESCALAR:\nEscalar grandes alturas requer mestria, com a possibilidade de cair sempre sendo algo possível. Testes diferentes podem requisitar quantias diferentes de acúmulos de testes de escalagem. Ao tentar escalar você pode escolher se quer fazer isso rapidamente ou devagar, rolando um teste de escalagem e seguindo através do raciocínio do que se segue abaixo.\nEscalar Rápido: DIF 8. Você adiciona na lista de acúmulos o valor tirado no seu teste.\nEscalar Devagar: DIF 4. Você adiciona na lista de acúmulos metade do valor tirado no seu teste.\nSe falhar num desses testes segue a regra de Queda."},{"id":"regras-de-jogo-section-21","title":"4.3 · PERSEGUIÇÃO E FURTIVIDADE","content":". Furtividade\n* percepção;\n* ocultação;\n* cobertura;\n* iluminação;\n* ruído;\n* distância;\n* detecção;\n* perseguição;\n* combate surpresa.\n\n. Perseguições\n* perseguição a pé;\n* veículos;\n* monstros;\n* fugas;\n* caçadas."},{"id":"regras-de-jogo-section-22","title":"4.3.1 · CENAS DE FURTIVIDADE","content":"PONTOS DE INTERESSE:\nAs presas e os predadores é como vamos chamar os dois papéis que existem nesse tipo de cena. Nessas cenas os jogadores costumam ser as presas, e esses podem tomar ações normais durante uma cena de furtividade, investigando, explorando ou escapando um local enquanto se escondem, esses precisam rolar 2d8 +1d8 para cada 2 pontos no modificador de furtividade esse tiver, assim definindo seus esconderijos iniciais nessa cena.\n\nO predador então precisa rolar 2d8 toda rodada para ver que local investiga, inicialmente rolando dois por rodada, e em algumas ocasiões rolando mais conforme o tempo passa. Sempre que um valor que ele tira é igual ao dado de esconderijo de um ou mais sobreviventes eles perdem esse dado de esconderijo. Se um jogador perde todos seus dados de esconderijo ele é encontrado e inicia-se uma perseguição/combate, sofrendo um ataque instantaneamente. Se todos saem da cena sem serem encontrados a cena termina com eles não sendo encontrados.\n\nAlternativamente, algumas cenas dessas podem ser em escalas maiores, usando dados de maior valor e sendo mais longas em sua duração, com um objetivo mais complicado também.\n\nAÇÕES:\n* Cabeçalho: Contém o nome e a descrição básica do ponto de interesse. A descrição básica é narrada quando um personagem usa a ação “investigar” no ponto de interesse (depois da primeira vez, o mestre não precisa repetir a descrição básica, embora possa fazer isso se o jogador pedir).\n* Quadro de Informações: Traz informações que o personagem pode encontrar no ponto de interesse ao usar a ação inves\n________________"}]},{"id":"apendice","title":"Apêndice","sections":[{"id":"apendice-section-1","title":"Glossário, exemplos e regras opcionais","content":"66. Glossário\nExplique termos como:\n* ação;\n* reação;\n* rodada;\n* turno;\n* teste;\n* dificuldade;\n* crítico;\n* dano;\n* condição;\n* resistência;\n* vulnerabilidade;\n* alcance;\n* alvo.\n________________\n\n68. Exemplos de jogo\nInclua pelo menos uma cena completa.\nPor exemplo:\nMestre: O soldado dispara…\nMostre:\n1. iniciativa;\n2. ação;\n3. rolagem;\n4. defesa;\n5. dano;\n6. condição;\n7. reação;\n8. próximo turno.\nIsso resolve ambiguidades que páginas de texto não conseguem resolver.\n________________\n\n75. Economia de recursos\nVeja se existe:\nrecurso infinito.\nSe uma habilidade pode ser usada infinitamente sem consequência, provavelmente precisa ser analisada.\n________________\n\n80. Regras opcionais\nNão coloque tudo no núcleo.\nSepare:\nRegras essenciais\nSem elas o jogo não funciona.\nRegras avançadas\nPara mesas que querem maior complexidade.\nRegras opcionais\nPara estilos específicos.\nRegras experimentais\nPara grupos que querem testar.\n________________\n\n82. Lore\nDepois da estrutura mecânica:\n* cosmologia;\n* história;\n* eras;\n* eventos;\n* entidades;\n* facções;\n* mundos;\n* personagens;\n* locais;\n* mitologia.\nNo O FIM RPG isso é particularmente grande.\n________________\n\n* Positivas:\nImparável: Imune a efeitos que lhe movimentam.\nPercepção Vital: Para cada 5 pontos de dano causados em um ataque você causa 1 dano adicional.\nFrenesi: Pode realizar duas ações normais numa fase da rodada, contanto que essas sejam com intento de causar dor.\nVigoroso: Sofre -50% do dano de toda e qualquer fonte.\nResistente a: Sofre -50% do dano de um tipo ou fonte específica.\nProtegido de: Sofre -25% do dano de um tipo ou fonte específica.\nCombalido: Causa 50% do dano com ataques físicos\nDesgastado: Causa 50% do dano com todas e qualquer fonte que possua\nAtento: Recebe +2 em testes de Perspicácia e Raciocínio e imunidade a desprevenido.\nSossegado: Recebe +2 em testes de Conhecimento e Charme.\nÁgil: Recebe +2 em testes de Proteção, Furtividade e Destreza.\nFortalecido: Recebe +2 em testes de Ataque e Corpo.\nReflexos Apurados: recebe +1 em testes de esquiva e +1 de DEF.\n\n* Desvantagens em Testes:\nDistraído: O personagem sofre –1 em testes.\nAbatido: O personagem sofre –2 em testes de ataque.\nFraco: O personagem sofre -2 em testes de Corpo e Técnica.\nFrustrado: O personagem sofre –2 em testes de Raciocínio e Charme.\nTonto: O personagem sofre -2 em testes de Perspicácia e Conhecimento.\nOssos Partidos: Sofre de -3 em testes de Ataque, Defender, Força, Manobra, Esquiva e Acrobacia.\nOfuscado: O personagem sofre –1 em testes de ataque e de Perspicácia que envolvem visão.\nFatigado: O personagem sofre -3 em testes.\n\n* Dados Reduzidos:\nEsmorecido: O personagem só pode rolar 1d8 em testes de Charme, Raciocínio e Conhecimento.\nDebilitado: O personagem só pode rolar 1d8 em testes de Destreza, Corpo e Técnica.\nAbalado: O personagem rola dois dados e escolhe o pior em todo teste que fizer (desvantagem).\nApavorado: Sempre que rola um teste também rola um Dado de Pavor. Role 1d4 e remova do valor de cada dado jogado o resultado dele (apenas reduzindo o resultado final se rolou um dado e tirando duas ou mais vezes se ele tinha uma ou mais vantagens nesse dado). Adicionalmente, se o valor tirado no seu dado for inferior ao do dado de pavor (contando antes de bônus por modificadores) o teste é considerado uma falha crítica e você recebe 1 contador de sanidade (Mais no CAP ???).\nHorrorizado: Assim como Apavorado mas o Dado de Pavor é rolado com 1d6. Ao tirar um valor inferior ao Dado de Pavor você agora recebe 2 contadores de sanidade (Mais no CAP ???).\n\n* Reduções Diversas:\nQuebrado: O personagem sofre -3 de DEF.\nCansado: O custo em pontos de stamina das habilidades e dos feitiços do personagem aumenta em +1.\nEnraizado: Incapaz de usar habilidades para se movimentar.\nVulnerável: Sofre +50% de dano de um tipo específico ou de qualquer tipo caso não especificado no efeito.\nFerida Profunda: Fica combalido e vulnerável ou sofre uma perda de 10% da sua Saúde e Stamina por rodada que ficaria com a condição.\nSurpreendido: Não ciente de seus inimigos. O próximo ataque que ele sofrer é desprevenido e causa +100% de dano.\nNervoso: O personagem sofre -1 em testes para cada novo teste feito enquanto com a condição, acumulando a desvantagem para cada novo teste.\n\n* Desvantagens Específicas:\nCego: O personagem fica desprevenido, não pode fazer testes de Perspicácia para observar e diminui em um a categoria do dado em testes de perícias baseadas em Técnica ou Destreza. Todos os alvos de seus ataques recebem camuflagem total. Você é considerado cego enquanto estiver em uma área de escuridão total, a menos que algo lhe permita perceber no escuro.\nAssustado: O personagem sofre –2 em testes e deve fugir da fonte do medo da maneira mais eficiente possível (mas pode parar de fazê-lo assim que a perder de vista ou se afastar mais do que 15m). Se não puder, poderá agir, mas não poderá se aproximar voluntariamente da fonte do medo.\nEnlouquecendo: O personagem não pode tomar ações ofensivas, também ficando distraído fica distraído e assustado. Um ser nessa condição precisa fazer um teste de coragem DIF 8 todo início de rodada, recebendo um trauma sempre que falha em um teste. Esse teste tem sua DIF aumentada em 3 a cada teste feito anteriormente nessa cena. Por fim, remover um ser dessa condição requer uma ação normal e um teste de diplomacia DIF 11.\nSurdo: O personagem não pode fazer testes de audição e tem 50% de chance de sofrer um ataque de maneira desprevinida. Além disso, é considerado em condição ruim para lançar feitiços.\nIndefeso: O personagem é considerado desprevenido, mas sofre –7 de DEF, falha automaticamente em testes de Esquiva e pode sofrer golpes de misericórdia.\nExausto: O personagem rola dois dados e escolhe o pior em testes de Corpo, Destreza, Técnica e Charme, além disso tem efeitos piores por falhas em testes, tendo que rolar um segundo dado para ver se uma falha foi crítica sempre que falha em um teste, independente se tirou 1 ou não.\n\n* Efeitos Naturais:\nAgarrado: O personagem fica desprevenido e imóvel, diminui a categoria do dado em testes de ataque e só pode atacar com armas leves. Um personagem agarrado sofre metade do dano de ataques a distância que o ser que está lhe agarrando sofre, e vice-versa (distribui o dano entre eles).\nDesprevenido: Despreparado para reagir. O personagem sofre –2 de DEF e não pode fazer testes de Esquiva ou de Defender. Você fica desprevenido contra inimigos que não possa perceber.\nCaído: Deitado no chão. O personagem sofre –2 em ataques corpo a corpo e seu deslocamento é reduzido a 1,25m. Além disso, sofre –2 de DEF contra ataques corpo a corpo, mas recebe +2 na DEF contra ataques à distância.\nMoribundo: Com 0 pontos de saúde. Qualquer ação que fizer tem seu efeito diminuído, ataques, cura, habilidades e movimentos todos pela metade. Enquanto com a condição o ser ainda continua tendo a possibilidade de morrer mesmo que curado, qualquer cura que afete um ser nessa condição será contada, aumentando sua vida normalmente, mas não removendo a condição dele. Um ser nessa condição precisa fazer um teste de metabolismo DIF 8 sempre que sofre dano, recebendo uma lesão sempre que falha em um teste. Esse teste tem sua DIF aumentada em 3 a cada teste feito anteriormente nessa cena. Por fim, no início da sua 4° rodada com a condição você morre, independente se somente passou em testes.\nMachucado: O personagem tem metade ou menos de seus pontos de saúde totais.\n\n* Redução de Ação ou Movimento:\nParalisado: O personagem é considerado desprevenido e só pode tomar ações puramente mentais.\nImóvel: Todas as formas de deslocamento do personagem são reduzidas a 0m.\nAtordoado: O personagem fica desprevenido e não pode agir.\nConfuso: Você é incapaz de pensar e agir por conta própria, em cada fase da rodada role 1d8 e tome essa ação.\n1-3: Movimenta-se em uma direção escolhida por uma rolagem de 1d4;\n4-5: Usa a arma que estiver empunhando para atacar a si mesmo (só role o dano);\n6-7: Usa a arma que estiver empunhando para atacar o ser mais próximo;\n8: A condição termina e pode agir normalmente (se rolar 4 na primeira rodada confuso ainda perde a ação).\nObcecado: Com a atenção presa em alguma coisa. O personagem falha automaticamente em testes de Perspicácia e Raciocínio e deve gastar todas suas ações para ajudar a pessoa que está obcecado ou apenas encarar fascinado caso não seja algo vivo. Qualquer ação hostil contra o personagem anula esta condição. Retirar um ser desse estado requer uma ação normal e um teste de Diplomacia DIF 8.\nLento: Todas as formas de deslocamento do personagem são reduzidas à metade (arredonde para baixo para o primeiro incremento de 1,2m) e ele não pode correr ou fazer investidas.\nEnjoado: O personagem é incapaz de fazer ações complexas e só age na segunda fase da rodada, não na primeira.\nPetrificado: O personagem fica inconsciente e recebe resistência a dano 10.\nInconsciente: O personagem não pode tomar ações e pode sofrer golpes de misericórdia.\n\n* Outras:\nQueimando: O personagem está pegando fogo. Algumas habilidades dão um ponto de chamas, para cada ponto que você tiver você sofre perda de 2 de saúde por rodada com a condição. O personagem pode gastar uma ação normal para remover até 3 pontos de chamas com as mãos. Imersão em água também remove até 10 pontos de chamas.\nEnvenenado: Varia de acordo com o veneno. Dano recorrente de condições envenenadas sempre se acumula (mesmo se as condições ou fontes que as causam forem iguais).\nInfectado: Cada 6 horas passadas perde 1 de COR, se COR fica com -2 personagem morre.\nAsfixiado: O personagem não pode respirar. Um personagem asfixiado pode prender a respiração por um número de rodadas igual ao seu CORx2. Depois disso, deve fazer um teste de Metabolismo por rodada (DIF 3 + 3 por teste anterior). Se falhar, cai inconsciente e perde 5 pontos de saúde máximos até que zere estes e morra ou até recuperar o fôlego, recuperando todos caso sobreviva.\nSangrando: Com um ferimento aberto. Algumas habilidades dão um ponto de sangramento, para cada ponto que você tiver você sofre perda de 1 de saúde por rodada com a condição. É possível estabilizar até 5 pontos de sangramento de alguém com uma ação completa e um teste de Medicina (DIF 9).\nFerida Infeccionada*: 10% de chance (1 em 1d10) de ocorrer sempre que um ser terminar uma cena machucado. Varia dependendo da parte do corpo, mas o efeito é que sempre que um ser com essa condição faz uma ação exigente que envolva sua área infeccionada ele sofre 1 de dano.\ncintura para baixo: usa deslocar; faz um teste de destreza; corre numa cena fora de combate;\nbraços ou mãos: realiza um ataque; faz uma ação que exija muito movimento dos braços;\ntorso, cabeça e pescoço: faz um teste de corpo; é acertado por um ataque;\ntodos: assim como anteriores e também quando é derrubado; exposto a algum líquido que encosta na superfície; exposto a temperatura muito baixa;\n\nBônus\n\tDIF 7\n\tDIF 10\n\tDIF 12\n\tDIF 15\n\t+0\n\t50%\n\t25%\n\t8%\n\t0%\n\t+1\n\t58%\n\t33%\n\t17%\n\t0%\n\t+2\n\t67%\n\t42%\n\t25%\n\t0%\n\t+3\n\t75%\n\t50%\n\t33%\n\t8%\n\t+4\n\t83%\n\t58%\n\t42%\n\t8%\n\t+5\n\t92%\n\t67%\n\t50%\n\t17%\n\t+6\n\t100%\n\t75%\n\t58%\n\t25%\n\t+7\n\t100%\n\t83%\n\t67%\n\t33%\n\nTipo de Cura\n\tCura por Rodada\n\tPequena\n\t5-10% Saúde máxima\n\tNormal\n\t10-20% SM\n\tGrande\n\t20–35% SM\n\tEmergencial\n\t35–55% SM\n\tCura extrema\n\t55–75% SM"}]},{"id":"equipamentos","title":"Equipamentos e itens","sections":[{"id":"equipamentos-section-1","title":"Inventário, peso e durabilidade","content":"5.1 LISTA DE EQUIPAMENTOS:\nLegenda:\nInventário: Cada personagem tem 8 + (6 x força) espaços de inventário. Se um personagem tem uma carga atual superior ao seu máximo ele tem seu deslocamento reduzido à metade e não pode reagir a ataques. Caso sua carga atual seja igual a 150% do seu total você já não consegue carregar mais nada, sendo impossível conseguir mais nenhum item, além de seu deslocamento ser reduzido a 1m e você também ter de rolar todo teste físico com um modificador de -2.\nPeso: Quantidade de espaço que o item ocupa no seu inventário.\nDurabilidade: Cada item tem uma qualidade específica, perdendo qualidade sempre que sofre um ataque (o dano do ataque sendo a perda de qualidade) e sempre que você tem uma falha crítica enquanto atirando / atacando com a arma (tendo 3 de perda de qualidade). Um item com menos de 50% da qualidade causa 50% do dano que causaria normalmente ou simplesmente tem seu efeito reduzido pela metade. Um item com menos de 10% da qualidade não pode ser utilizado. Um item com 0% da qualidade não pode ser utilizado e nem consertado, sendo apenas restos inúteis do que já foi antes.\nCusto e Categoria: Custo de compra do item (venda é sempre 50% desse preço)"},{"id":"equipamentos-section-2","title":"Categorias e regras de equipamento","content":"5.1.1 ARMAS CORPO o caso esteja usando o estilingue com uma mão precisa de uma ação normal para recarregar, caso tenha uma mão livre não precisa recarregar. Pedras podem ser encontradas pelo chão.\n\nArco e Flecha / Arco Avançado: Flechas disparadas que não acertem um inimigo tem 50% de chance de não quebrarem e poderem ser coletadas depois.\n\nRevólveres / Fuzis / Magnums / Alguns Rifles: Seu número de munições recarregadas por ação de recarga está escrita como x / y, esses números significam que essas armas não recarregam por completo, e sim recarregam x munições por ação e suportam um máximo de y munições dentro da arma.\n\nDispara-Discos: Essa arma atira em bursts de até 3 discos, atirando cada um num espaço diferente num cone de comprimento 10m e dispersão 2,5m, podendo assim acertar mais de um disco num alvo próximo ou alvo grande, e acerta discos em alvos diferentes com um único disparo.\n\nNome\n\tDano\n\tAlcance\n\tTipo de Dano\n\tTipo de Munição\n\tNúmero Tempo Recarga\n\tDurabilidade\n\tPeso\n\tPreço\n\tEstilingue\n\t1d2\n\t7,5m ~10m\n\tContundente\n\tPedra\n\t5 NOR     5 SIM\n\t10\n\t0,5\n\t4$\n\tArco e Flecha\n\t1d6\n\t7,5m ~15m\n\tPerfurante\n\tFlecha\n\t1 NOR\n\t10\n\t1,5\n\t12$\n\tEstilingue Avançado\n\t1d4+1\n\t10m ~20m\n\tContundente\n\tPedra\n\t5 NOR     5 SIM\n\t25\n\t1\n\t55$\n\tPistola Cano Curto\n\t1d8\n\t7,5m ~15m\n\tBalístico\n\tPistola\n\t5 NOR\n\t30\n\t0,5\n\t67$\n\tRevólver Compacto\n\t1d10\n\t7,5m ~15m\n\tBalístico\n\tRevólver\n\t3/8 NOR\n\t30\n\t0,5\n\t70$\n\tLuger\n\t2d4\n\t10m ~20m\n\tBalístico\n\tPistola\n\t8 NOR\n\t30\n\t1\n\t71$\n\tDispara-Discos\n\t1d4+1\n\t10m ~20m\n\tPerfurante\n\tDisco\n\t3 NOR\n\t35\n\t1,5\n\t71$\n\tBalestra\n\t1d8+2\n\t15m ~30m\n\tPerfurante\n\tFlecha\n\t1 NOR\n\t25\n\t2,5\n\t75$\n\tGlock\n\t1d8\n\t20m ~40m\n\tBalístico\n\tPistola\n\t18 COM\n\t40\n\t1,5\n\t93$\n\tPistola\n\t1d12\n\t15m ~30m\n\tBalístico\n\tPistola\n\t10 NOR\n\t30\n\t1\n\t100$\n\tRevólver\n\t2d6\n\t10m ~20m\n\tBalístico\n\tRevólver\n\t3/6 NOR\n\t30\n\t1\n\t100$ uma ação simples.\n\tBolsa de Explorador\n\t15\n\t1\n\t6$\n\tEsse item permite que você tenha +4 no seu espaço do inventário.\n\tCinto de Componentes\n\t25\n\t1\n\t8$\n\tEste traje pode ser usado para voar pelo espaço, permitindo você respirar ar filtrado dentre a pressão espacial. Além disso, enquanto utilizando ele fornece um aumento de Resistência igual ao seu nível, mas em contrapartida diminui seu deslocamento em 1,25m e causa uma desvantagem de -1 em testes de destreza.\n\tCinto Tático\n\t15\n\t1\n\t8$\n\tCinto tático permite que você use a ação recarregar como uma ação simples.\n\tColdre\n\t20\n\t1\n\t11$\n\tCom esse item ao usar a ação Sacar Item com armas leves, ela se torna ação livre ao invés de uma ação simples.\n\tMala Duffel\n\t15\n\t1\n\t14$\n\tEsse item permite que você tenha +8 no seu espaço do inventário.\n\tMochila de Viagem\n\t30\n\t1,5\n\t14$\n\tEsse item permite que você tenha +3 no seu espaço do inventário. Mas para esses itens que estiverem em sua mochila a ação para sacá-los é uma ação livre.\n\tPochete\n\n\tEsse item permite que você tenha +1 no seu espaço do inventário. Mas para esses itens que estiverem em sua mochila a ação para sacá-los é uma ação livre, além disso quando você sacar uma arma da pochete você recebe +1 em testes de ataques.\n\tAlarme de Movimento\n\n\tVocê pode prender um alarme de movimento em uma superfície e qualquer ser que passe pelo alarme dispara um som alto vindo do alarme, dando pra ouvir a 30m de distância e quem estiver a 10m de distância fica surdo. Esse som dura por 4 rodadas.\n\tArpéu\n\n\tUm Arpéu é uma pistola com um gancho na frente e é utilizado para alcançar maiores alturas. Para usá-lo você deve fazer um teste de pontaria (DIF 8), caso erre não acerta onde gostaria acertar, caso passe você acerta aonde tu queria\n\tAriete\n\n\tUsado para arrombar portas. Você precisa de 2 pessoas para usá-la decentemente, mas caso você tenha +4 em COR você pode usar sozinha.\n\tBinóculos\n\n\tVocê pode usar um binóculos para ter +3 percepção e, além disso, você pode ver até 3km de distância.\n\tBinóculos Aprimorado\n\n\tVocê pode usar um binóculos para ter +4 percepção e, além disso, você pode ver até 5km de distância.\n\tBloqueador de Sinal\n\t40\n\t3\n\t20$\n\tVocê pode colocar esse objeto em uma superfície. Todos dispositivos eletrônicos perdem o sinal de internet em até 15m, para recuperar é necessário quebrar ou desativar o dispositivo\n\tBoroscópio\n\t35\n\t3\n\t29$\n\tO Boroscópio pode ser usado para detectar quaisquer objetos em até 7m de você.\n\tBússola\n\t25\n\t1,5\n\t37$\n\tAo usar uma bússola você recebe +2 em testes de navegação.\n\tDetector de Metais\n\n\tAo usar detector de metais ele consegue detectar qualquer objeto que possui metal, mesmo que esteja embaixo de superfícies. Ele consegue detectar objetos metálicos em até 3m. (mudar)\n\tEquipamento de Escalagem\n\n\tSe você usar o Equipamento de Escalagem você recebe +2 na pericia de Escalagem. Além disso o equipamento de Escalagem possui uma corda você pode usar a ação agarrar em até 2.50m\n\tEquipamento de Infiltração / Gazua\n\n\tVocê pode usar um Equipamento de Infiltração para destrancar fechaduras trancadas. Ao fazer um teste de arrombar você recebe +3 nesse teste.\n\tEquipamento de Hacking / Equipamento Tecnológico Avançado\n\n\tEquipamento de Sobrevivência Selvagem\n\n\tLanterna Simples\n\n\tUma lanterna é usada para iluminar a sua frente, iluminando 3m em cone. Você pode usar a lanterna para cegar um inimigo, que deve fazer um teste de Metabolismo (DIF 6), caso passe não fica cego, caso ele não passe fica cego por 2 rodadas\n\tLanterna Tática\n\n\tUma lanterna é usada para iluminar a sua frente, iluminando 7m em cone. Você pode usar a lanterna para cegar um inimigo, que deve fazer um teste de Metabolismo (DIF 8), caso passe não fica cego, caso ele não passe fica cego por 5 rodadas\n\tPé de Cabra\n\n\tVocê pode usar um Equipamento de Infiltração para destrancar fechaduras trancadas. Ao fazer um teste de arrombar você recebe +3 nesse teste.\n\tRastreador Aprimorado\n\n\tReceptor de GPS\n\n\tAlgemas\n\n\tDocumentos\n\n\tGravador Digital\n\n\tWalkie-Talkie\n\n\tCâmera\n\n\tCelular\n\n\tCentrífuga de Substâncias Químicas Portátil\n\n\tInstrumento\n\n\tIsqueiro\n\n\tNotebook\n\n\tPá\n\n\tParaquedas\n\n\tPistola de Dardo Sonífero\n\n\tPistola Sinalizadora\n\n\tTaser\n\n\t________________"},{"id":"equipamentos-section-9","title":"Tabela: acessórios, roupas e armaduras","content":"5.1.5 ACESSÓRIOS / ROUPAS / ARMADURAS\n\nNome\n\tDurabilidade\n\tPeso\n\tPreço\n\tCategoria\n\tEfeitos Bônus\n\tMáscara de Gás\n\t-\n\t-\n\t-\n\tProfissional\n\tEssa máscara da +2 para resistir a efeitos de gases e respiratórios, além de 2 rodadas adicionais para resistir a condição asfixiado.\n\tTraje Radiação\n\t30\n\t1,5\n\t5$\n\tProfissional\n\tEste traje pode ser usado para passar por zonas radioativas ou quimicamente instáveis. Além disso, enquanto utilizando ele fornece imunidade a efeitos causados por radiação e vazamentos químicos, além de resistência 10 a dano de radiação\n\tTraje Mergulho\n\t15\n\t1\n\t6$\n\tProfissional\n\tEste traje pode ser usado para descer as maiores profundezas do mar, permitindo você respirar debaixo da água. Além disso, enquanto utilizando ele fornece um aumento de Resistência igual ao dobro do seu nível, mas em contrapartida diminui seu deslocamento em 2,5m e causa uma desvantagem de -2 em testes de destreza.\n\tTraje Espacial\n\t25\n\t1\n\t8$\n\tProfissional\n\tEste traje pode ser usado para voar pelo espaço, permitindo você respirar ar filtrado dentre a pressão espacial. Além disso, enquanto utilizando ele fornece um aumento de Resistência igual ao seu nível, mas em contrapartida diminui seu deslocamento em 1,25m e causa uma desvantagem de -1 em testes de destreza.\n\tTraje Proteção Ambiental\n\t15\n\t1\n\t8$\n\tProfissional\n\tEste traje pode ser usado para se proteger contra perigos selvagens, evitando mordidas, protegendo sua pele de picadas de inseto, ajudando com camuflagem entre outras coisas. Ela também fornece +2 em testes de navegação, sobrevivência e adestramento enquanto lidando com a natureza.\n\tÓculos de Visão Noturna\n\t20\n\t1\n\t11$\n\tProfissional\n\tGastando uma ação simples, você pode ativar o modo de visão no escuro, permitindo que você veja no escuro.\n\tÓculos de Visão Térmica\n\t15\n\t1\n\t14$\n\tProfissional\n\tUm visor tecnológico com lentes que possuem um apetrecho que quando ativado gera uma visão que escurece o ambiente Gastando uma ação simples, você pode ativar o modo de detecção, permitindo que você detecte seres pelo calor delas, ignorando camuflagem, cobertura e fornecendo +1 em todo teste feito contra alvos detectados pelos óculos.\n\tBotas Militares\n\t30\n\t1,5\n\t14$\n\tProfissional\n\tGalochas de material resistente que ajudam em caminhadas por solo disforme. Esse item fornece imunidade a terrenos árduos.\n\tÓculos Escuros\n\t25\n\t1,5\n\t15$\n\tMundanos\n\tUm óculos com lentes que filtram toda luz que passa por ela. Este item fornece +2 em testes para resistir a cegueira causada por luzes.\n\tBotas de Hipismo\n\n\tMundanos\n\tUm par de botas resistentes com equipamento de hipismo imbuído. Enquanto usando esse item você recebe um bônus de +2 em testes de Adestramento e Pilotagem enquanto montando animais, adicionalmente você pode se deslocar mais 1,25m com um animal que monte usando o item.\n\tEscuta\n\n\tMundanos\n\tUm par de escutas pequenas para se colocar na orelha. Esse item permite que você se comunique com outro ser que coloque a escuta a longa distância, possuindo um limite de 5km.\n\tEquipamento de Disfarce\n\n\tMundanos\n\tUm conjunto de costuras, maquiagens, acessórios e e roupas simples que lhe permitem se assemelhar a outra pessoa ou esconder sua identidade. Você pode gastar uma ação de interlúdio ou 3 ações complexas em outras cenas para usar o equipamento de disfarce. Ao usar ele você altera sua aparência, num interlúdio você adquire outra aparência, recebendo +3 em testes de charme para fingir ser outra pessoa. Seu uso secundário lhe fornece +1 em testes de charme de maneira geral por adquirir uma aparência melhor. O efeito se desfaz dependendo do tipo de disfarce (água tira maquiagem, fogo queima roupas, e etc).\n\tSobretudo\n\n\tMundanos\n\tEnquanto equipado você recebe +2 espaços de inventário e +2 em testes para ocultar itens guardados nesses 2 espaços.\n\tUniforme Oficial\n\n\tMundanos\n\tAo usar essa vestimenta você recebe +2 em intimidação e pode conseguir informações confidenciais com mais facilidade.\n\tCalça com Compartimento Secreto\n\n\tMundanos\n\tEnquanto equipado você recebe +1 espaço de inventário e +4 em testes para ocultar itens guardados nesse 1 espaço.\n\tSoco Inglês\n\t40\n\t3\n\t20$\n\tCombate / Armaduras\n\n\tManoplas\n\t35\n\t3\n\t29$\n\tCombate / Armaduras\n\n\tBraçadeiras\n\t25\n\t1,5\n\t37$\n\tCombate / Armaduras\n\tCom esse item equipado você recebe +1 em defender.\n\tTúnica Leve\n\t25\n\t1,5\n\t37$\n\tCombate / Armaduras\n\n\tCota de Malha\n\n\t25\n\t1,5\n\t37$\n\tCombate / Armaduras\n\n\tPeitoral Kevlar\n\n\t25\n\t1,5\n\t37$\n\tCombate / Armaduras\n\n\tArmadura Pesada\n\t25\n\t1,5\n\t37$\n\tCombate / Armaduras\n\n\tArmadura Medieval\n\n\tCapacete Defensivo\n\n\t________________"},{"id":"equipamentos-section-10","title":"Tabela: veículos","content":"5.1.6 VEÍCULOS\n\nNome\n\tDurabilidade\n\tPeso\n\tPreço\n\tEfeitos Bônus\n\tBicicleta\n\t-\n\t-\n\t-\n\tGastando uma ação normal você pode curar x de Saúde\n\tVespa\n\t30\n\t1,5\n\t5$\n\tGastando uma ação complexa você pode curar x de Saúde e x de Resistência\n\tCG-160\n\t15\n\t1\n\t6$\n\tGastando uma ação normal você pode tirar alguém do estado moribundo\n\tCorolla\n\t25\n\t1\n\t8$\n\tGastando uma ação rápida você pode se curar de uma doença\n\tSUV\n\t15\n\t1\n\t8$\n\tGastando uma ação normal você pode tomar relaxantes, ficando Desgastado por 2 rodadas, mas recupera ¼ de sua Stamina total\n\tCorda\n\t20\n\t1\n\t11$\n\tVocê pode usar uma corda para escalar paredes mais facilmente e pode usar para laçar outros, recebendo +1 em manobras\n\tCigarro\n\t15\n\t1\n\t14$\n\n\tSpray de Pimenta\n\t30\n\t1,5\n\t14$\n\tVocê pode gastar uma ação normal para deixar um inimigo adjacente cego por 3 rodadas\n\tCantil\n\t25\n\t1,5\n\t15$\n\tO cantil pode carregar um líquido, sendo água ou bebidas alcoólicas. Caso seja uma bebida alcoólica você pode gastar uma ação simples para beber do cantil, curando de efeitos mentais, mas deixando você bêbado pelo resto da cena.\n\tEstrepes\n\t40\n\t3\n\t20$\n\tUm pequeno objeto afiado, ela pode ser deixada no chão, quem pisar em uma estrepe sofre 1d6 de dano e fica sangrando (teste de corpo DIF X anula efeito)\n\tPedra de Afiar\n\t35\n\t3\n\t29$\n\tVocê pode gastar uma ação normal para afiar uma arma branca sua, fazendo ela aumentar em 1 estágio de dado do dano da sua arma\n\tInjeção de Adrenalina\n\t25\n\t1,5\n\t37$\n\tVocê pode gastar uma ação simples para injetar uma Injeção de Adrenalina, deixa você em frenesi a mais por 3 turnos, depois disso deixa você vulnerável\n\n________________"},{"id":"equipamentos-section-11","title":"Tabela: consumíveis","content":"5.1.7 CONSUMÍVEIS\n\nNome\n\tDurabilidade\n\tPeso\n\tPreço\n\tEfeitos Bônus\n\tCicatrizante\n\t-\n\t-\n\t-\n\tGastando uma ação normal você pode curar x de Saúde dê si mesmo ou de um aliado adjacente.\n\tKit Médico\n\t30\n\t1,5\n\t5$\n\tGastando uma ação normal você pode curar x de Saúde dê si mesmo ou de um aliado adjacente.\n\tKit Primeiros Socorros\n\t15\n\t1\n\t6$\n\tGastando uma ação normal você pode remover a condição  moribundo de um aliado adjacente.\n\tMedicamentos\n\t25\n\t1\n\t8$\n\tGastando uma ação normal você pode aplicar em si mesmo ou em um aliado até 2 medicamentos (com efeito variado).\n\tRelaxantes\n\t15\n\t1\n\t8$\n\tGastando uma ação normal você pode tomar relaxantes, ficando Distraído e Desprevenido por 2 rodadas, mas recuperando 20% de sua Stamina total\n\tCorda\n\t20\n\t1\n\t11$\n\tVocê pode usar uma corda para escalar paredes mais facilmente, prender objetos a outros ou ao ambiente, laçar inimigos, entre outras ações. Você recebe +1 em testes de manobras com ela.-\n\tCigarro\n\t15\n\t1\n\t14$\n\tUm maço de cigarro possui 20 cigarros. Até duas vezes por cena você pode usar uma ação simples para acender um cigarro, ao terminar de fumar um cigarro você ganha 2 de Sobre Stamina, porém fica tossindo e não pode agir por 1 fase da rodada (esse efeito também acontece uma segunda vez no início da próxima cena).\n\tSpray de Pimenta\n\t30\n\t1,5\n\t14$\n\tVocê pode gastar uma ação normal para deixar um inimigo adjacente cego por 3 rodadas\n\tCantil\n\t25\n\t1,5\n\t15$\n\tO cantil pode carregar um líquido, sendo água ou bebidas alcoólicas. Caso seja uma bebida alcoólica você pode gastar uma ação simples para beber do cantil, curando de efeitos mentais, mas deixando você bêbado pelo resto da cena.\n\tEstrepes\n\t40\n\t3\n\t20$\n\tUm pequeno objeto afiado, ela pode ser deixada no chão, quem pisar em uma estrepe sofre 1d6 de dano e fica sangrando (teste de corpo DIF X anula efeito)\n\tPedra de Afiar\n\t35\n\t3\n\t29$\n\tVocê pode gastar uma ação normal para afiar uma arma branca sua, fazendo ela aumentar em 1 estágio de dado do dano da sua arma\n\tInjeção de Adrenalina\n\t25\n\t1,5\n\t37$\n\tVocê pode gastar uma ação simples para injetar uma Injeção de Adrenalina, deixa você em frenesi a mais por 3 turnos, depois disso deixa você vulnerável"}]}];</script><script>

const $esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',body){let r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||'Erro ao comunicar com o servidor.');return d}
function notify(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2500)}
function role(f){return {'Linha de Frente':'Proativo','Desafiador':'Rastreador Nato','Retaguarda':'Diligente'}[f]||''}
function escJsonAttr(o){return $esc(JSON.stringify(o))}
function formModal(title,fields,save){$('modalbox').innerHTML='<header class="modalhead"><h2>'+title+'</h2><button type="button" class="iconbtn" onclick="closeModal()">×</button></header><form id="modalform" class="modalbody"><div class="formgrid">'+fields+'</div><div class="modalactions"><button class="btn" type="button" onclick="closeModal()">Cancelar</button><button class="btn primary">Guardar</button></div></form>';$('modal').classList.add('show');$('modalform').onsubmit=async e=>{e.preventDefault();try{let d=new FormData(e.target),file=e.target.elements.imageFile?.files?.[0];if(file)d.set('uploadedImage',await optimizeUpload(file));await save(d);closeModal();await refresh();render();notify('Guardado')}catch(err){notify(err.message)}}}
function closeModal(){$('modal').classList.remove('show')}
function field(label,name,val='',type='text',full=false){return '<div class="field '+(full?'full':'')+'"><label>'+label+'</label><input name="'+name+'" type="'+type+'" value="'+$esc(val)+'"></div>'}
function area(label,name,val='',full=true){return '<div class="field '+(full?'full':'')+'"><label>'+label+'</label><textarea name="'+name+'">'+$esc(val)+'</textarea></div>'}
function photoField(label,current='',full=true){return '<div class="field photo-field '+(full?'full':'')+'"><label>'+label+'</label>'+(current?'<img class="photo-preview" src="'+$esc(current)+'" alt="Imagem atual">':'')+'<input name="imageFile" type="file" accept="image/*"><small>Imagem opcional. O site ajusta o tamanho sem cortar o retrato.</small></div>'}
async function optimizeUpload(file){let img=new Image(),url=URL.createObjectURL(file);try{await new Promise((ok,bad)=>{img.onload=ok;img.onerror=()=>bad(Error('Não foi possível abrir essa imagem.'));img.src=url});let scale=Math.min(1,900/img.width,1250/img.height);for(let attempt=0;attempt<7;attempt++){let w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);let data=c.toDataURL('image/webp',[.9,.84,.78,.72,.66,.6,.54][attempt]);if(data.length<=1300000)return data;scale*=.84}throw Error('A imagem continua grande demais depois da compressão. Escolha outra imagem menor.')}finally{URL.revokeObjectURL(url)}}
function selectField(label,name,options,value){return '<div class="field"><label>'+label+'</label><select name="'+name+'">'+options.map(x=>'<option '+(x===value?'selected':'')+'>'+x+'</option>').join('')+'</select></div>'}
async function refresh(){let data=await api('sheets');sheets=data.sheets;data=await api('campaigns');campaigns=data.campaigns;data=await api('homebrew');homebrew=data.homebrew}

function shell(content){let title={sheets:'FICHAS',portraits:'RETRATOS',campaigns:'CAMPANHAS',homebrew:'HOMEBREW',rules:'REGRAS',credits:'CRÉDITOS'}[view]||'O FIM';$('app').innerHTML='<div class="layout"><aside class="side"><div class="brand"><div class="logo">F</div><div><b>O FIM</b><small>ARQUIVO DE PERSONAGENS</small></div></div><div><div class="label">MESA</div><nav class="nav">'+[['sheets','▦ Fichas'],['portraits','◉ Retratos'],['campaigns','⚑ Campanhas'],['homebrew','✦ Homebrew'],['rules','☷ Regras'],['credits','✧ Créditos']].map(x=>'<button data-view="'+x[0]+'" class="'+(view===x[0]?'active':'')+'">'+x[1]+'</button>').join('')+'</nav></div><div class="sidefoot"><strong>O FIM: RPG</strong><p>Heróis de muitas dimensões. Uma realidade prestes a acabar.</p></div></aside><main class="main"><header class="top">O FIM <span>/</span> '+title+'<button id="logout">'+$esc(me.name)+' · Sair</button></header><div class="content">'+backgroundWall()+content+'</div></main></div>';$('app').querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;sheet=null;campaign=null;campaignFrom=false;render()});$('logout').onclick=async()=>{await api('logout','POST',{});me=null;render()}}

function themeClass(c){let s=(c.className||'').toLowerCase();if(s.includes('escolhido'))return 'style-spectral';if(s.includes('experimento'))return 'style-experiment';if(s.includes('vítima')||s.includes('vitima'))return 'style-victim';if(s.includes('mutante'))return 'style-mutant';if(s.includes('explorador'))return 'style-scroll';if(s.includes('bruxo'))return 'style-bruxo';if(s.includes('mago'))return 'style-mago';if(s.includes('clérigo')||s.includes('clerigo'))return 'style-clerigo';if(s.includes('militar'))return 'style-militar';if(s.includes('formado'))return 'style-formado';if(s.includes('arrependido'))return 'style-arrependido';if(s.includes('investigador'))return 'style-investigador';return ''}
function renderSkillTree(cls){let root=sheet.power||{},nodes=sheet.powers||[],selected=selectedTreeNode||'root';let ids=nodes.map((n,i)=>String(n.id||'legacy-'+i));let parentOf=(n,i)=>{if(n.parentId==='root'||n.parentId)return String(n.parentId);let j=nodes.findIndex(x=>x.name&&x.name===n.parent);return j>=0?ids[j]:'root'};let byId=new Map(nodes.map((n,i)=>[ids[i],{...n,id:ids[i],index:i,parentId:parentOf(n,i)}]));for(let n of byId.values()){if(n.parentId===n.id||!byId.has(n.parentId)&&n.parentId!=='root')n.parentId='root';let seen=new Set([n.id]),p=n.parentId;while(p!=='root'&&byId.has(p)){if(seen.has(p)){n.parentId='root';break}seen.add(p);p=byId.get(p).parentId}}let children=new Map();for(let id of ['root',...ids])children.set(id,[]);for(let n of byId.values())children.get(n.parentId).push(n);let positions=new Map([['root',{x:0,y:0,depth:0,angle:0}]]),maxDepth=0;function place(parentId,depth,baseAngle,span){let cs=children.get(parentId)||[];if(!cs.length)return;let step=span/cs.length,origin=positions.get(parentId)||{x:0,y:0};cs.forEach((n,i)=>{let a=baseAngle-span/2+step*(i+.5),r=175+depth*26;positions.set(n.id,{x:origin.x+Math.cos(a)*r,y:origin.y+Math.sin(a)*r,depth:depth+1,angle:a});maxDepth=Math.max(maxDepth,depth+1);let sub=children.get(n.id)||[];if(sub.length)place(n.id,depth+1,a,Math.min(1.9,Math.max(.55,span*.76)))})}let roots=children.get('root')||[];if(roots.length){let step=Math.PI*2/roots.length;roots.forEach((n,i)=>{let a=-Math.PI/2+step*i;positions.set(n.id,{x:Math.cos(a)*190,y:Math.sin(a)*190,depth:1,angle:a});maxDepth=1;if((children.get(n.id)||[]).length)place(n.id,1,a,Math.min(2.25,step*.92))})}let extent=260+Array.from(positions.values()).reduce((m,q)=>Math.max(m,Math.hypot(q.x,q.y)),0)+145,size=Math.max(780,extent*2),cx=size/2,cy=size/2,px=id=>{let q=positions.get(id)||{x:0,y:0};return{x:cx+q.x,y:cy+q.y}};let edges=[...byId.values()].map(n=>{let a=px(n.parentId),b=px(n.id),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;return '<path class="skilltree-link" d="M' function renderRules(){let create=ruleTab==='create';return '<div class="eyebrow">Livro do Jogador</div><div class="heading"><div><h1>Regras de O FIM</h1><p>Consulta rápida para criar personagens e jogar.</p></div></div><div class="tabs"><button class="'+(create?'active':'')+'" data-rule="create">Criação de fichas</button><button class="'+(!create?'active':'')+'" data-rule="general">Regras gerais</button></div>'+(create?'<div class="rulesgrid"><article class="ruleblock"><h3>Conceito e identidade</h3><p>Defina nome, idade, aparência, personalidade, objetivo, alinhamento, história e valores morais.</p></article><article class="ruleblock"><h3>Atributos</h3><p>Distribua 5 pontos de atributo; a função concede mais 1. Um atributo pode cair a −1 para receber 1 ponto adicional. O limite aumenta nos níveis 7, 15, 21, 25 e 29.</p></article><article class="ruleblock"><h3>Arquétipos</h3><ul><li>Herdeiro: +1 Saúde e +1 Stamina por nível; 2 perícias sociais e 2 físicas.</li><li>Feiticeiro: +2 Stamina por nível; 3 perícias mentais e 1 social.</li><li>Especialista: +2 Saúde por nível; 1 perícia mental, 1 física e 2 à escolha.</li></ul></article><article class="ruleblock"><h3>Função</h3><p>Linha de Frente concede +1 Corpo e perfil Proativo; Desafiador concede +1 Técnica e perfil Rastreador Nato; Retaguarda concede +1 Raciocínio e perfil Diligente.</p></article><article class="ruleblock"><h3>Perícias</h3><p>Escolha perícias dentro dos grupos de atributos. Bônus iniciais podem ser +1 ou +2; os limites máximos sobem nos níveis 8, 15, 23 e 28.</p></article><article class="ruleblock"><h3>Progressão</h3><p>O nível distribui melhorias de atributo, perícia, vantagens de classe, poderes de função e técnicas de subclasse. Consulte a tabela de progressão do capítulo de classes para o avanço completo.</p></article></div>':'<div class="rulesgrid"><article class="ruleblock"><h3>Testes</h3><p>Role d8 para testes muito difíceis, d10 para situações complicadas e d12 para testes normais. Some o modificador do atributo e o da perícia. DIF 7 é comum.</p></article><article class="ruleblock"><h3>Dificuldades</h3><p>Muito trivial 4; fácil 5–6; regular 7–8; desafio moderado 9–10; difícil 11–12; exigente 13–14; extremo 15–17; quase impossível 18–20; cósmico 21+.</p></article><article class="ruleblock"><h3>Testes opostos</h3><p>Ambas as partes rolam; o maior resultado vence. Em empate, vence quem ataca.</p></article><article class="ruleblock"><h3>Críticos</h3><p>Para crítico, tire o máximo do dado e depois 7 ou mais em outro dado igual. Ao tirar 1, role novamente: resultado ímpar causa falha crítica.</p></article><article class="ruleblock"><h3>Medidores</h3><p>Saúde representa dano físico; Resistência mede defesa e reação; Stamina sustenta ações. Os valores máximos dependem de nível, arquétipo e função.</p></article><article class="ruleblock"><h3>Inventário</h3><p>Limite-base: 8 + (6 × Força). Acima do limite, deslocamento cai à metade e o personagem não reage; em 150%, deslocamento fica em 1 m e testes físicos sofrem −2. Abaixo de 50% de durabilidade, dano ou efeito cai pela metade; abaixo de 10%, o item não pode ser usado; em 0%, não pode ser reparado.</p></article><article class="ruleblock"><h3>Itens</h3><p>O livro registra categoria, peso, durabilidade, custo e efeitos. A venda vale 50% do preço de compra. Armas podem incluir dano, alcance, tipo de dano, munição e recarga.</p></article><article class="ruleblock"><h3>Referência completa</h3><p>Use esta página como resumo inicial. A versão completa e atualizada das regras pode ser ligada ao capítulo correspondente do Livro do Jogador.</p></article></div>')}

|'Habilidade-base'):(parentNode?.name||'Habilidade');let v={...x,id:index==null?('power-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)):ids[index],name:d.get('name'),kind:d.get('kind'),uses:d.get('uses'),description:d.get('description'),parentId:chosen,parent:parentName};if(index==null)sheet.powers.push(v);else sheet.powers[index]=v;selectedTreeNode=v.id;await persistSheet();render()})}

function resourceBonusByLevel(level,rates){let n=Math.max(0,Math.min(30,Math.floor(Number(level)||0))),first=Math.min(n,11),second=Math.min(Math.max(n-11,0),10),third=Math.max(n-21,0);return first*rates[0]+second*rates[1]+third*rates[2]}
function calculateSheetResources({level,archetype,func,body}){let f=func==='Linha de Frente'?0:func==='Desafiador'?1:2,healthRates=[[3,6,9],[2,5,7],[1,3,5]][f],resRates=[[4,6,8],[3,4,5],[2,3,4]][f],staminaRates=archetype==='Especialista'?[[0,3,5],[2,5,7],[3,6,9]][f]:[[1,3,5],[2,5,7],[3,6,9]][f],healthPerLevel={Herdeiro:1,Feiticeiro:0,Especialista:2}[archetype]||0,staminaPerLevel={Herdeiro:1,Feiticeiro:2,Especialista:0}[archetype]||0,n=Math.max(0,Math.min(30,Math.floor(Number(level)||0))),functionBody=func==='Linha de Frente'?1:0,effectiveBody=(Number(body)||0)+functionBody;return {health:Math.round(5+2*n+effectiveBody*n+healthPerLevel*n+resourceBonusByLevel(n,healthRates)),res:Math.round(4+2*n+resourceBonusByLevel(n,resRates)),stamina:Math.round(5+2*n+staminaPerLevel*n+resourceBonusByLevel(n,staminaRates))}}

function attachResourceCalculator(){let form=$('modalform');if(!form)return;let update=()=>{let v=n=>Number(form.elements[n]?.value)||0,r=calculateSheetResources({level:v('level'),archetype:form.elements.archetype?.value,func:form.elements.function?.value,body:v('attr-COR')});for(let [max,key,cur] of [['healthMax','health','healthNow'],['resMax','res','resNow'],['staminaMax','stamina','staminaNow']]){let input=form.elements[max];if(input){input.value=r[key];input.readOnly=true;input.title='Calculado automaticamente por nível, atributos, arquétipo e função'}if(form.elements[cur]){let raw=form.elements[cur].value;form.elements[cur].value=raw===''?r[key]:Math.max(0,Math.min(Number(raw)||0,r[key]))}}let out=$('resourceCalcSummary');if(out)out.textContent='Cálculo automático · Saúde '+r.health+' · Resistência '+r.res+' · Stamina '+r.stamina+'. Inclui o crescimento de 2 pontos por nível e os bônus de arquétipo, função e Corpo.'};form.addEventListener('input',update);form.addEventListener('change',update);update()}

rance:d.get('appearance'),personality:d.get('personality'),objective:d.get('objective'),moral:d.get('moral'),backstory:d.get('backstory'),notes:d.get('notes'),items:[],abilities:[],powers:[],spells:[],practices:[],inventory:{limit:0,bonus:0}};let r=await api('sheets','POST',{sheet:c});sheet=r.sheet;sheet.ownerId=me.id});attachResourceCalculator()}
