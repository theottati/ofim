function renderRules(){let create=ruleTab==='create';return '<div class="eyebrow">Livro do Jogador</div><div class="heading"><div><h1>Regras de O FIM</h1><p>Índice de consulta para criação e jogo.</p></div></div><div class="tabs"><button class="'+(create?'active':'')+'" data-rule="create">Criação de fichas</button><button class="'+(!create?'active':'')+'" data-rule="general">Regras gerais</button></div>'+(create?'<div class="rulesgrid"><article class="ruleblock"><h3>Conceito e identidade</h3><p>Nome, idade, aparência, personalidade, objetivo, alinhamento, história e valores morais.</p></article><article class="ruleblock"><h3>Atributos</h3><p>5 pontos iniciais +1 da função. Um atributo pode ser reduzido a −1 para receber 1 ponto. O limite aumenta nos níveis 7, 15, 21, 25 e 29.</p></article><article class="ruleblock"><h3>Arquétipos</h3><ul><li>Herdeiro: +1 Saúde e +1 Stamina por nível; 2 perícias sociais e 2 físicas.</li><li>Feiticeiro: +2 Stamina por nível; 3 perícias mentais e 1 social.</li><li>Especialista: +2 Saúde por nível; 1 mental, 1 física e 2 perícias à escolha.</li></ul></article><article class="ruleblock"><h3>Funções</h3><p>Linha de Frente: +1 Corpo e Proativo. Desafiador: +1 Técnica e Rastreador Nato. Retaguarda: +1 Raciocínio e Diligente. Cada função também altera os medidores por nível.</p></article><article class="ruleblock"><h3>Perícias</h3><p>Modificadores treinados agrupados por atributo. Bônus iniciais +1 ou +2; limites maiores nos níveis 8, 15, 23 e 28.</p></article><article class="ruleblock"><h3>Valores de nível 0</h3><p>Ser humano comum: Saúde 5 + Corpo; Resistência 4; Stamina 5; Defesa 6; 5 + RAC pontos de perícia.</p></article><article class="ruleblock"><h3>Progressão de nível</h3><p>Saúde, Resistência e Stamina crescem em faixas de níveis; arquétipo e função acrescentam seus próprios valores. A tabela de classe define atributos, perícias, vantagens, poderes de função e técnicas de subclasse.</p></article><article class="ruleblock"><h3>Classe e subclasse</h3><p>Herdeiros: Escolhido, Experimento, Vítima e Mutante. Feiticeiros: Explorador do Oculto, Bruxo, Mago e Clérigo. Especialistas: Militar, Formado, Arrependido e Investigador.</p></article></div>':'<div class="rulesgrid"><article class="ruleblock"><h3>Testes e dados</h3><p>d8 para situação difícil, d10 para teste complicado, d12 para teste normal. Some atributo e perícia. A categoria do dado pode subir ou descer passos.</p></article><article class="ruleblock"><h3>Dificuldades</h3><p>Muito trivial 4; fácil 5–6; regular 7–8; desafio moderado 9–10; difícil 11–12; exigente 13–14; extremo 15–17; quase impossível 18–20; cósmico 21+.</p></article><article class="ruleblock"><h3>Opostos, críticos e modificadores</h3><p>Em testes opostos, maior resultado vence; empate favorece quem ataca. Crítico: máximo no dado e depois 7+ num dado igual. No 1, role de novo: ímpar causa falha crítica. Vantagem rola dois dados e usa o maior; desvantagem usa o menor.</p></article><article class="ruleblock"><h3>Testes em equipe</h3><p>Teste auxiliado soma 1d4 + modificador ao teste principal. Teste conjunto resolve um objetivo comum; testes acumulados somam sucessos ou falhas definidos pelo mestre. Uma nova tentativa após falha pode custar outra ação e trazer consequências.</p></article><article class="ruleblock"><h3>Ações, habilidades e Stamina</h3><p>A habilidade indica o tipo de ação; se não indicar, é ação simples. Custos de Stamina, duração, recarga, condições e pré-requisitos acompanham cada habilidade. Habilidades passivas não consomem ação nem Stamina. Afinidade pode alterar custo, ação ou efeito.</p></article><article class="ruleblock"><h3>Saúde, Resistência e Stamina</h3><p>Com Saúde 0, pode ocorrer estado moribundo. Com Resistência abaixo da metade, Defender é limitado a uma vez por rodada; com 0, não pode Defender. Com Stamina 0, fica Vulnerável e Desgastado e não usa habilidades com custo.</p></article><article class="ruleblock"><h3>Lesões, sanidade e traumas</h3><p>Lesões são determinadas por 1d20 e podem causar sequelas graves. Sanidade acumula contadores; descanso completo remove 2. Ao exceder Coragem +8, o personagem fica enlouquecendo. Traumas também usam uma tabela de 1d20.</p></article><article class="ruleblock"><h3>Perigos</h3><p>O livro aborda fogo, água, quedas, pressão, temperatura, fumaça, veneno, eletricidade, explosões, desabamentos, gravidade e terreno árduo.</p></article><article class="ruleblock"><h3>Inventário e durabilidade</h3><p>Limite 8 + (6 × Força), com bônus de acessórios. Acima do limite: metade do deslocamento e sem reação. Em 150%: deslocamento 1 m, sem carregar mais e −2 em testes físicos. Abaixo de 50% da durabilidade, dano/efeito cai pela metade; abaixo de 10%, não usa; em 0%, não repara. Venda vale metade do preço.</p></article><article class="ruleblock"><h3>Consultar o livro completo</h3><p></p></article></div>')}
document.addEventListener('change',e=>{if(e.target.name!=='archetype')return;let sel=$('modalform')?.elements.className;if(!sel)return;let map={Herdeiro:['Escolhido','Experimento','Vítima','Mutante'],Feiticeiro:['Explorador do Oculto','Bruxo','Mago','Clérigo'],Especialista:['Militar','Formado','Arrependido','Investigador']},opts=map[e.target.value]||[];sel.innerHTML=opts.map(x=>'<option>'+x+'</option>').join('')});
function quality(x){let v=Number(x.durability)||0,m=Number(x.durMax)||0;if(m<=0)return '';let r=v/m;if(v<=0)return 'Quebrado: não pode ser usado nem reparado.';if(r<.1)return 'Menos de 10%: não pode ser usado.';if(r<.5)return 'Menos de 50%: dano/efeito pela metade.';return 'Qualidade funcional.'}
function inventoryView(){let s=inventoryStats(),over=s.pct>1.5?'Carga em 150% ou mais: não pode carregar itens adicionais, deslocamento cai para 1 m e testes físicos recebem −2.':s.pct>1?'Acima do limite: deslocamento reduzido à metade e sem reação a ataques.':'';return '<div class="section-heading"><div><h2>Inventário</h2><p>Espaços, peso e durabilidade acompanhados em um só lugar.</p><small>Limite pela regra: 8 + (6 × Força) espaços; bolsas e acessórios podem alterar esse valor.</small></div><button class="btn" id="inventorySettings">Ajustar limite</button></div><div class="inventory-progress"><div><span>OCUPAÇÃO</span><strong>'+s.total.toFixed(1)+' <i>/ '+s.base.toFixed(1)+' espaços</i></strong><div class="bar"><i style="--fill:'+Math.min(100,s.pct*100)+'%"></i></div></div><div class="inventory-rule">'+(over||'Carga dentro do limite. Acompanhe o peso e a durabilidade dos itens.')+'</div></div><div class="toolbar"><span class="muted">'+(sheet.items||[]).length+' itens registrados</span><div class="toolbar-actions"><button class="btn" id="addItemCatalog">＋ Adicionar · <small>em breve!</small></button><button class="btn primary" id="addItem">Criar item</button></div></div><div class="itemgrid">'+((sheet.items||[]).map((x,i)=>'<article class="itemcard"><div class="cardtop"><span class="tag">'+$esc(x.category||'Item')+'</span><div><button class="iconbtn" data-edititem="'+i+'">Editar</button><button class="iconbtn" data-delitem="'+i+'">Remover</button></div></div><h4>'+$esc(x.name)+'</h4><p class="muted">'+$esc(x.description||x.effects||'')+'</p><div class="pills"><span class="pill">PESO '+$esc(x.weight||0)+' × '+$esc(x.quantity||1)+'</span><span class="pill">DUR. '+$esc(x.durability||'—')+'/'+$esc(x.durMax||'—')+'</span><span class="pill">CUSTO '+$esc(x.cost||'—')+'</span></div><div class="pills"><span class="pill">'+$esc(x.damage||'Sem dano')+'</span><span class="pill">'+$esc(x.range||'')+'</span><span class="pill">'+$esc(x.damageType||'')+'</span></div></article>').join('')||'<div class="empty">Seu inventário está vazio. Crie seu primeiro item para começar.</div>')+'</div>'}
function abilityModal(old,index){let x=old||{},cls=CLASSNAMES[sheet.className]||'Classe',opts=['Função','Investigação',cls,'Arquétipo','Outro'],f=selectField('Tipo / marcador','type',opts,x.type||'Função')+field('Origem','source',x.source||sheet.className)+field('Nome','name',x.name||'')+field('Nível','level',x.level||'','number')+field('Ação','action',x.action||'Ação simples')+field('Custo de Stamina','stamina',x.stamina||'','number')+field('Duração','duration',x.duration||'')+field('Recarga','recharge',x.recharge||'')+field('Pré-requisitos','requirements',x.requirements||'')+field('Condição de uso','conditions',x.conditions||'')+field('Afinidade','affinity',x.affinity||'')+area('Descrição e efeito','description',x.description||'');formModal(old?'Editar habilidade':'Criar habilidade',f,async d=>{sheet.abilities=sheet.abilities||[];let v=Object.fromEntries(d);if(index==null)sheet.abilities.push(v);else sheet.abilities[index]=v;await persistSheet()})}
function spellModal(old,index){let x=old||{},f=field('Nome','name',x.name||'')+field('Nível do feitiço','level',x.level||'','number')+field('Etapa de conjuração','stage',x.stage||'')+field('Tempo de conjuração','time',x.time||'')+field('Custo de Stamina','stamina',x.stamina||'','number')+field('Requisitos','requirements',x.requirements||'')+field('Alcance','range',x.range||'')+field('Área','area',x.area||'')+field('Alvos','targets',x.targets||'')+field('Duração','duration',x.duration||'')+field('Recarga','recharge',x.recharge||'')+area('Descrição','description',x.description||'')+area('Efeito','effect',x.effect||'');formModal(old?'Editar feitiço':'Criar feitiço',f,async d=>{sheet.spells=sheet.spells||[];let v=Object.fromEntries(d);if(index==null)sheet.spells.push(v);else sheet.spells[index]=v;await persistSheet()})}
function renderRules(){
let chapter=RULEBOOK.find(x=>x.id===ruleChapter)||RULEBOOK[0];
let section=chapter.sections.find(x=>x.id===ruleSection)||chapter.sections[0];
let matches=ruleQuery?RULEBOOK.flatMap(c=>c.sections.filter(s=>(c.title+' '+s.title+' '+s.content).toLocaleLowerCase('pt-BR').includes(ruleQuery.toLocaleLowerCase('pt-BR'))).map(s=>({chapter:c,section:s}))):[];
let prose=section?(section.title.startsWith('Tabela:')?'<div style="max-height:68vh;overflow:auto;padding:16px;background:rgba(10,10,12,.72);border:1px solid var(--line);border-radius:12px;font:12px/1.7 ui-monospace,monospace;white-space:pre-wrap">'+$esc(section.content)+'</div>':section.content.split(/\n\s*\n/).filter(Boolean).map(p=>'<p>'+ $esc(p.trim()).replace(/\n/g,'<br>') +'</p>').join('')):'<p>Esta secção não tem texto disponível.</p>'
return '<div class="eyebrow">Livro do Jogador · consulta</div><div class="heading"><div><h1>O FIM: regras e mundo de jogo</h1><p>Explore as regras, a criação de personagens, as classes, o combate e os equipamentos por capítulo.</p></div></div><form class="rule-search" id="ruleSearchForm"><input id="ruleSearchInput" type="search" value="'+$esc(ruleQuery)+'" placeholder="Buscar em todo o livro" aria-label="Buscar em todo o livro"><button class="btn primary" type="submit">Buscar</button>'+(ruleQuery?'<button class="btn" type="button" id="clearRuleSearch">Limpar</button>':'')+'</form>'+(ruleQuery?'<section class="rule-results"><div class="eyebrow">'+matches.length+' resultados</div>'+(matches.map(x=>'<button class="rule-result" data-rule-chapter="'+x.chapter.id+'" data-rule-section="'+x.section.id+'"><span>'+ $esc(x.chapter.title) +'</span><strong>'+ $esc(x.section.title) +'</strong><small>'+ $esc(x.section.content.slice(0,210).replace(/\s+/g,' ')) +'…</small></button>').join('')||'<p>Nenhuma secção encontrada. Tente outro termo.</p>')+'</section>':'<div class="rule-chapters">'+RULEBOOK.map(c=>'<button class="rule-chapter '+(ruleChapter===c.id?'active':'')+'" data-rule-chapter="'+c.id+'">'+$esc(c.title)+'<small>'+c.sections.length+' secções</small></button>').join('')+'</div><div class="rule-reader"><nav class="rule-outline" aria-label="Secções de '+$esc(chapter.title)+'"><div class="eyebrow">Neste capítulo</div>'+chapter.sections.map(s=>'<button class="rule-section '+(section?.id===s.id?'active':'')+'" data-rule-section="'+s.id+'">'+$esc(s.title)+'</button>').join('')+'</nav><article class="ruleblock rule-prose"><div class="eyebrow">'+$esc(chapter.title)+'</div><h2>'+$esc(section?.title||chapter.title)+'</h2>'+prose+'</article></div>')
}
function renderCampaign(){let c=campaign.campaign,gm=c.role==='gm',cover=c.cover?'<img src="'+$esc(c.cover)+'" alt="">':'<div class="campaign-art-placeholder"></div>';let agentCards=campaign.sheets.map(s=>'<article class="card click" data-campsheet="'+$esc(s.id)+'"><div class="campaign-agent-portrait">'+(s.portrait?'<img src="'+$esc(s.portrait)+'" alt="Retrato de '+$esc(s.name)+'">':'<div class="portrait-placeholder">✧</div>')+'</div><div class="cardtop"><span class="tag">'+$esc(s.archetype)+'</span></div><h3>'+$esc(s.name)+'</h3><div class="muted">'+$esc(s.className)+' · nível '+$esc(s.level)+'</div><div class="pills"><span class="pill">'+(s.ownerId===me.id?'SUA FICHA':'FICHA DE JOGADOR')+'</span></div>'+(gm||s.ownerId===me.id?'<button class="btn small danger" data-detach="'+$esc(s.id)+'">Remover da campanha</button>':'')+'</article>').join('');return '<div class="campaign-detail-cover">'+cover+'</div><div class="eyebrow">Campanha · '+(gm?'Mestre':'Jogador')+'</div><div class="heading"><div><h1>'+$esc(c.name)+'</h1><p>'+$esc(c.description||'')+'</p></div><button id="backCampaigns" class="btn">← Campanhas</button></div><div class="toolbar">'+(gm?'<button class="btn" id="editCampaign">Editar campanha</button><button class="btn" id="copyInvite">Copiar convite</button><button class="btn" id="revokeInvite">Gerar novo convite</button><button class="btn danger" id="deleteCampaign">Excluir campanha</button>':'')+'</div><div class="sectiontitle">Participantes · '+campaign.members.length+'</div><div class="cards">'+campaign.members.map(m=>'<article class="card"><div class="cardtop"><span class="tag">'+(m.role==='gm'?'MESTRE':'JOGADOR')+'</span>'+(gm&&m.id!==me.id?'<button class="btn small danger" data-kick="'+$esc(m.id)+'">Remover participante</button>':'')+'</div><h3>'+$esc(m.name)+'</h3></article>').join('')+'</div><div class="sectiontitle">Agentes da campanha</div><div class="toolbar"><button id="attachSheet" class="btn primary">＋ Adicionar uma das minhas fichas</button></div><div class="cards">'+(agentCards||'<div class="empty">Nenhum agente foi adicionado à campanha.</div>')+'</div>'}
function renderSheet(){let canEdit=sheet.ownerId===me.id||(campaignFrom&&campaign?.campaign.role==='gm'),owner=sheet.ownerId===me.id;return '<div class="eyebrow">Ficha de personagem'+(campaignFrom?' · campanha':' · pessoal')+'</div><div class="sheet-hero '+themeClass(sheet)+'"><div class="sheet-portrait">'+(sheet.portrait?'<img src="'+$esc(sheet.portrait)+'" alt="Retrato de '+$esc(sheet.name)+'">':'<div class="portrait-placeholder">✧</div>')+'</div><div class="sheet-identity"><span class="tag">'+$esc(sheet.className)+'</span><h1>'+$esc(sheet.name)+'</h1><p>'+$esc(sheet.archetype)+' · '+$esc(sheet.function)+' · nível '+$esc(sheet.level)+'</p><div class="hero-meters">'+[['Saúde',sheet.healthNow,sheet.healthMax,'health'],['Resistência',sheet.resNow,sheet.resMax,'resist'],['Stamina',sheet.staminaNow,sheet.staminaMax,'stamina']].map(([n,v,m,k])=>'<div class="hero-meter '+k+'"><small>'+n+'</small><strong>'+$esc(v||0)+' <i>/ '+$esc(m||0)+'</i></strong><span><i style="--fill:'+Math.min(100,(Number(v)||0)/(Number(m)||1)*100)+'%"></i></span></div>').join('')+'</div></div><div class="hero-actions"><button class="btn" id="backSheets">← '+(campaignFrom?'Campanha':'Fichas')+'</button> '+(canEdit?'<button class="btn" id="editSheet">Editar</button><button class="btn" id="editPortrait">Editar retrato</button>':'')+' '+(owner?'<button class="btn danger" id="deleteSheet">Excluir</button>':'')+'</div></div>'+sheetTab()+(specialTab==='overview'?overview():specialTab==='inventory'?inventoryView():specialTab==='abilities'?abilitiesView():specialView())}
let campaignFrom=false;bindDelegated();
async function init(){try{let x=await api('me');me=x.user;if(me)await afterLogin();else render()}catch{render()}}
init();
