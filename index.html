async function api(path,method='GET',body){let r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||'Erro ao comunicar com o servidor.');return d}

function overview(){let groups=[['Aparência',sheet.appearance],['Personalidade',sheet.personality],['Objetivo',sheet.objective],['Valores morais',sheet.moral],['História',sheet.backstory],['Notas',sheet.notes]].filter(x=>x[1]);return '<div class="meters">'+[['Saúde',sheet.health],['Resistência',sheet.resistance],['Stamina',sheet.stamina]].map(([n,v])=>'<div class="meter"><span>'+n+'</span><strong>'+$esc(v||'—')+'</strong></div>').join('')+'</div><div class="sectiontitle">Atributos</div><div class="attributes">'+ATTRS.map(([k,n])=>'<div class="attribute"><small>'+k+' · '+n+'</small><b>'+$esc(sheet.attrs?.[k]??0)+'</b></div>').join('')+'</div><div class="sectiontitle">Identidade</div><div class="pills"><span class="pill">IDADE '+$esc(sheet.age||'—')+'</span><span class="pill">ALINHAMENTO '+$esc(sheet.alignment||'—')+'</span><span class="pill">DEFESA '+$esc(sheet.defense||'—')+'</span></div><div class="bio-grid" style="margin-top:14px">'+groups.map(([n,v])=>'<div class="bio"><small>'+n+'</small><p>'+$esc(v)+'</p></div>').join('')+'</div>'}
async function persistSheet(){let r=await api('sheet/'+encodeURIComponent(sheet.id),'POST',{sheet});sheet=r.sheet}
function inventoryStats(){let force=Number(sheet.skills?.Força||0),bonus=Number(sheet.inventory?.bonus||0),base=Number(sheet.inventory?.limit||0)||8+6*force+bonus,total=(sheet.items||[]).reduce((a,x)=>a+(Number(x.weight)||0)*(Number(x.quantity)||1),0);return {force,bonus,base,total,pct:base?total/base:0}}
function inventoryView(){let s=inventoryStats(),over=s.pct>1.5?'Carga em 150% ou mais: não pode carregar itens adicionais, deslocamento cai para 1 m e testes físicos recebem −2.':s.pct>1?'Acima do limite: deslocamento reduzido à metade e sem reação a ataques.':'';return '<div class="heading"><div><h2>Inventário</h2><p class="muted">Capacidade-base: 8 + (6 × Força) espaços; bolsas podem aumentar o limite.</p></div><button class="btn" id="inventorySettings">Ajustar limite</button></div><div class="stats"><div class="stat"><small>Ocupado</small><b>'+s.total.toFixed(1)+'</b></div><div class="stat"><small>Limite</small><b>'+s.base.toFixed(1)+'</b></div><div class="stat"><small>Força</small><b>'+s.force+'</b></div><div class="stat"><small>Durabilidade</small><b>Rastreadas</b></div></div>'+(over?'<div class="overload">'+over+'</div>':'')+'<div class="toolbar"><span class="muted">'+(sheet.items||[]).length+' itens</span><button class="btn primary" id="addItem">＋ Criar item</button></div><div class="itemgrid">'+((sheet.items||[]).map((x,i)=>'<article class="itemcard"><div class="cardtop"><span class="tag">'+$esc(x.category||'Item')+'</span><button class="iconbtn" data-edititem="'+i+'">Editar</button></div><h4>'+$esc(x.name)+'</h4><p class="muted">'+$esc(x.description||x.effects||'')+'</p><div class="pills"><span class="pill">PESO '+$esc(x.weight||0)+' × '+$esc(x.quantity||1)+'</span><span class="pill">DUR. '+$esc(x.durability||'—')+'/'+$esc(x.durMax||'—')+'</span><span class="pill">CUSTO '+$esc(x.cost||'—')+'</span></div><div class="pills"><span class="pill">'+$esc(x.damage||'—')+'</span><span class="pill">'+$esc(x.range||'')+'</span><span class="pill">'+$esc(x.damageType||'')+'</span></div><button class="iconbtn" data-delitem="'+i+'">Remover</button></article>').join('')||'<div class="empty">Seu inventário está vazio.</div>')+'</div>'}
function abilitiesView(){let list=sheet.abilities||[];return '<div class="section-heading"><div><h2>Habilidades</h2><p>Marcadores de função, investigação, arquétipo e outras origens.</p><small>As habilidades de classe ficam aqui; a aba especial guarda seus usos, feitiços ou conhecimentos.</small></div><div class="toolbar-actions"><button class="btn" id="addAbilityCatalog">＋ Adicionar · <small>em breve!</small></button><button class="btn primary" id="newAbility">Criar habilidade</button></div></div><div class="abilitygrid">'+(list.map((x,i)=>'<article class="abilitycard"><div class="cardtop"><span class="tag">'+$esc(x.type||'Outro')+'</span><div><button class="iconbtn" data-editability="'+i+'">Editar</button><button class="iconbtn" data-delability="'+i+'">Remover</button></div></div><h4>'+$esc(x.name)+'</h4><p class="muted">'+$esc(x.description)+'</p><div class="pills"><span class="pill">'+$esc(x.source||sheet.className)+'</span><span class="pill">NÍVEL '+$esc(x.level||'—')+'</span><span class="pill">AÇÃO '+$esc(x.action||'—')+'</span></div></article>').join('')||'<div class="empty">Nenhuma habilidade registrada.</div>')+'</div>'}
function themeClass(c){let s=(c.className||'').toLowerCase();if(s.includes('escolhido'))return 'style-spectral';if(s.includes('experimento'))return 'style-experiment';if(s.includes('vítima')||s.includes('vitima'))return 'style-victim';if(s.includes('mutante'))return 'style-mutant';if(s.includes('explorador'))return 'style-scroll';if(s.includes('bruxo'))return 'style-bruxo';if(s.includes('mago'))return 'style-mago';if(s.includes('clérigo')||s.includes('clerigo'))return 'style-clerigo';if(s.includes('militar'))return 'style-militar';if(s.includes('formado'))return 'style-formado';if(s.includes('arrependido'))return 'style-arrependido';if(s.includes('investigador'))return 'style-investigador';return ''}
function specialView(){let cls=themeClass(sheet);if(sheet.archetype==='Feiticeiro'){let xs=sheet.spells||[];return '<div class="section-heading"><div><h2>Feitiços</h2><p>Lista compacta. Passe o cursor ou toque para abrir cada feitiço por inteiro.</p></div><div class="toolbar-actions"><button class="btn" id="addSpecialCatalog">＋ Adicionar · <small>em breve!</small></button><button class="btn primary" id="newSpell">Criar feitiço</button></div></div><div class="spell-list '+cls+'">'+(xs.map((x,i)=>'<article class="spell-card '+cls+'"><button class="spell-summary" data-toggle-spell><span class="spell-seal">✦</span><strong>'+$esc(x.name)+'</strong><span class="spell-level">NÍVEL '+$esc(x.level||'—')+'</span><span class="spell-open">＋</span></button><div class="spell-full"><div class="spell-scroll"><div class="cardtop"><span class="tag">ETAPA '+$esc(x.stage||'—')+' · '+$esc(x.time||'—')+'</span><div><button class="iconbtn" data-editspell="'+i+'">Editar</button><button class="iconbtn" data-delspell="'+i+'">Remover</button></div></div><h3>'+$esc(x.name)+'</h3><p>'+$esc(x.description||'')+'</p><dl><div><dt>Requisitos</dt><dd>'+$esc(x.requirements||'—')+'</dd></div><div><dt>Efeito</dt><dd>'+$esc(x.effect||'—')+'</dd></div><div><dt>Alcance · área · alvos</dt><dd>'+$esc(x.range||'—')+' · '+$esc(x.area||'—')+' · '+$esc(x.targets||'—')+'</dd></div><div><dt>Duração · recarga · custo</dt><dd>'+$esc(x.duration||'—')+' · '+$esc(x.recharge||'—')+' · '+$esc(x.stamina||'—')+'</dd></div></dl></div></div></article>').join('')||'<div class="empty">Nenhum feitiço registrado.</div>')+'</div>'}
if(sheet.archetype==='Especialista'){let xs=sheet.practices||[];return '<div class="section-heading"><div><h2>'+ $esc(specialName(sheet))+'</h2><p>Práticas e conhecimentos catalogados em fichas organizadas.</p></div><div class="toolbar-actions"><button class="btn" id="addSpecialCatalog">＋ Adicionar · <small>em breve!</small></button><button class="btn primary" id="newPractice">Criar prática</button></div></div><div class="practice-grid '+cls+'">'+(xs.map((x,i)=>'<article class="practice-card"><div class="cardtop"><span class="tag">'+$esc(x.category||'Conhecimento')+'</span><div><button class="iconbtn" data-editpractice="'+i+'">Editar</button><button class="iconbtn" data-delpractice="'+i+'">Remover</button></div></div><h4>'+$esc(x.name)+'</h4><p class="muted">'+$esc(x.description)+'</p></article>').join('')||'<div class="empty">Nenhuma prática ou conhecimento registrado.</div>')+'</div>'}
let p=sheet.power||{},nodes=sheet.powers||[];function descendants(parent,seen=[]){let kids=nodes.map((x,i)=>({...x,_i:i})).filter(x=>((x.parent||'Habilidade-base')===parent||(parent===(p.name||'Habilidade-base')&&(x.parent==='Habilidade-base'||!x.parent)))&&!seen.includes(x.name));return kids.length?'<ul class="power-branches">'+kids.map(x=>'<li><details class="power-node"><summary><span class="power-dot">✦</span><span><b>'+$esc(x.name)+'</b><small>'+$esc(x.kind||'Expansão')+' · '+$esc(x.uses||'Uso descrito')+'</small></span></summary><div class="power-detail"><p>'+$esc(x.description||'')+'</p><small>Pré-requisito: '+$esc(x.parent||p.name||'Habilidade-base')+'</small><div><button class="iconbtn" data-editpower="'+x._i+'">Editar</button><button class="iconbtn" data-delpoder="'+x._i+'">Remover</button></div></div>'+descendants(x.name,seen.concat(x.name))+'</details></li>').join('')+'</ul>':''}return '<div class="section-heading"><div><h2>'+ $esc(specialName(sheet))+'</h2><p>Árvore navegável: abra os ramos para ler os usos e avance com as expansões.</p></div><div class="toolbar-actions"><button class="btn" id="addSpecialCatalog">＋ Adicionar · <small>em breve!</small></button><button class="btn" id="editPower">Editar base</button><button class="btn primary" id="newPower">Expandir poder</button></div></div><div class="tree-tools"><span class="muted">'+nodes.length+' expansões · use a rolagem para explorar</span><button class="btn small" id="treeZoomOut">−</button><b id="treeZoomValue">'+Math.round(treeZoom*100)+'%</b><button class="btn small" id="treeZoomIn">＋</button></div><div class="tree-viewport '+cls+'"><div class="tree-canvas" style="--tree-scale:'+treeZoom+'"><div class="power-root"><span class="power-sigil">✦</span><small>HABILIDADE ÚNICA · BASE</small><h3>'+$esc(p.name||'Habilidade-base ainda sem nome')+'</h3><p>'+$esc(p.description||'Defina o poder único e seus usos conhecidos.')+'</p></div>'+descendants(p.name||'Habilidade-base')+'</div></div><p class="section-note">As habilidades adquiridas com o arquétipo ficam na aba Habilidades. Esta árvore expande os usos do poder único.</p>'}
function renderCampaigns(){return '<div class="eyebrow">Jogo compartilhado</div><div class="heading"><div><h1>Campanhas</h1><p>Campanhas em que você participa. O criador é o mestre.</p></div><button class="btn primary" id="createCampaign">＋ Criar campanha</button></div><div class="toolbar"><button id="joinCampaign" class="btn">Entrar com link de convite</button></div><div class="cards">'+(campaigns.map((c,i)=>'<article class="card campaign-card click" data-campaign="'+$esc(c.id)+'"><div class="campaign-cover">'+(c.cover?'<img src="'+$esc(c.cover)+'" alt="">':'<img src="'+ART_POOL[i%ART_POOL.length]+'" alt="">')+'<span class="tag">'+(c.role==='gm'?'MESTRE':'JOGADOR')+'</span></div><h3>'+$esc(c.name)+'</h3><p class="muted">'+$esc(c.description||'Sem descrição.')+'</p><span class="pill">ABRIR →</span></article>').join('')||'<div class="empty">Você ainda não participa de campanhas.</div>')+'</div>'}
function renderCampaign(){let c=campaign.campaign,gm=c.role==='gm';return '<div class="campaign-detail-cover">'+(c.cover?'<img src="'+$esc(c.cover)+'" alt="">':'<img src="'+ART_POOL[Math.abs(String(c.id).split('').reduce((a,x)=>a+x.charCodeAt(0),0))%ART_POOL.length]+'" alt="">')+'</div><div class="eyebrow">Campanha · '+(gm?'Mestre':'Jogador')+'</div><div class="heading"><div><h1>'+$esc(c.name)+'</h1><p>'+$esc(c.description||'')+'</p></div><button id="backCampaigns" class="btn">← Campanhas</button></div><div class="toolbar">'+(gm?'<button class="btn" id="editCampaign">Editar campanha</button><button class="btn" id="copyInvite">Copiar convite</button><button class="btn" id="revokeInvite">Gerar novo convite</button><button class="btn danger" id="deleteCampaign">Excluir campanha</button>':'')+'</div><div class="sectiontitle">Participantes · '+campaign.members.length+'</div><div class="cards">'+campaign.members.map(m=>'<article class="card"><div class="cardtop"><span class="tag">'+(m.role==='gm'?'MESTRE':'JOGADOR')+'</span>'+(gm&&m.id!==me.id?'<button class="btn small danger" data-kick="'+$esc(m.id)+'">Remover</button>':'')+'</div><h3>'+$esc(m.name)+'</h3></article>').join('')+'</div><div class="sectiontitle">Agentes da campanha</div><div class="toolbar"><button id="attachSheet" class="btn primary">＋ Adicionar uma das minhas fichas</button></div><div class="cards">'+campaign.sheets.map(s=>'<article class="card click" data-campsheet="'+$esc(s.id)+'"><div class="cardtop"><div class="initial">'+$esc((s.name||'?')[0])+'</div><span class="tag">'+$esc(s.archetype)+'</span></div><h3>'+$esc(s.name)+'</h3><div class="muted">'+$esc(s.className)+' · nível '+$esc(s.level)+'</div><div class="pills"><span class="pill">'+(s.ownerId===me.id?'SUA FICHA':'FICHA DE JOGADOR')+'</span></div></article>').join('')||'<div class="empty">Nenhum agente foi adicionado à campanha.</div>'+'</div>'}
function renderHomebrew(){return '<div class="eyebrow">Criações da mesa</div><div class="heading"><div><h1>Catálogo Homebrew</h1><p>Crie conteúdo para suas fichas e campanhas.</p></div><button class="btn primary" id="newHomebrew">＋ Criar homebrew</button></div><div class="subtabs"><button class="active">Tudo</button><span class="muted">Itens · Habilidades · Feitiços · Práticas</span></div><div class="cards">'+(homebrew.map(x=>'<article class="card"><div class="cardtop"><span class="tag">'+$esc(x.type||'Criação')+'</span><button class="iconbtn" data-delhomebrew="'+$esc(x.id)+'">×</button></div><h3>'+$esc(x.name)+'</h3><p class="muted">'+$esc(x.description||'')+'</p><span class="pill">'+$esc(x.scope||'Pessoal')+'</span></article>').join('')||'<div class="empty">Seu catálogo ainda está vazio.</div>')+'</div>'}
function renderRules(){let create=ruleTab==='create';return '<div class="eyebrow">Livro do Jogador</div><div class="heading"><div><h1>Regras de O FIM</h1><p>Consulta rápida para criar personagens e jogar.</p></div></div><div class="tabs"><button class="'+(create?'active':'')+'" data-rule="create">Criação de fichas</button><button class="'+(!create?'active':'')+'" data-rule="general">Regras gerais</button></div>'+(create?'<div class="rulesgrid"><article class="ruleblock"><h3>Conceito e identidade</h3><p>Defina nome, idade, aparência, personalidade, objetivo, alinhamento, história e valores morais.</p></article><article class="ruleblock"><h3>Atributos</h3><p>Distribua 5 pontos de atributo; a função concede mais 1. Um atributo pode cair a −1 para receber 1 ponto adicional. O limite aumenta nos níveis 7, 15, 21, 25 e 29.</p></article><article class="ruleblock"><h3>Arquétipos</h3><ul><li>Herdeiro: +1 Saúde e +1 Stamina por nível; 2 perícias sociais e 2 físicas.</li><li>Feiticeiro: +2 Stamina por nível; 3 perícias mentais e 1 social.</li><li>Especialista: +2 Saúde por nível; 1 perícia mental, 1 física e 2 à escolha.</li></ul></article><article class="ruleblock"><h3>Função</h3><p>Linha de Frente concede +1 Corpo e perfil Proativo; Desafiador concede +1 Técnica e perfil Rastreador Nato; Retaguarda concede +1 Raciocínio e perfil Diligente.</p></article><article class="ruleblock"><h3>Perícias</h3><p>Escolha perícias dentro dos grupos de atributos. Bônus iniciais podem ser +1 ou +2; os limites máximos sobem nos níveis 8, 15, 23 e 28.</p></article><article class="ruleblock"><h3>Progressão</h3><p>O nível distribui melhorias de atributo, perícia, vantagens de classe, poderes de função e técnicas de subclasse. Consulte a tabela de progressão do capítulo de classes para o avanço completo.</p></article></div>':'<div class="rulesgrid"><article class="ruleblock"><h3>Testes</h3><p>Role d8 para testes muito difíceis, d10 para situações complicadas e d12 para testes normais. Some o modificador do atributo e o da perícia. DIF 7 é comum.</p></article><article class="ruleblock"><h3>Dificuldades</h3><p>Muito trivial 4; fácil 5–6; regular 7–8; desafio moderado 9–10; difícil 11–12; exigente 13–14; extremo 15–17; quase impossível 18–20; cósmico 21+.</p></article><article class="ruleblock"><h3>Testes opostos</h3><p>Ambas as partes rolam; o maior resultado vence. Em empate, vence quem ataca.</p></article><article class="ruleblock"><h3>Críticos</h3><p>Para crítico, tire o máximo do dado e depois 7 ou mais em outro dado igual. Ao tirar 1, role novamente: resultado ímpar causa falha crítica.</p></article><article class="ruleblock"><h3>Medidores</h3><p>Saúde representa dano físico; Resistência mede defesa e reação; Stamina sustenta ações. Os valores máximos dependem de nível, arquétipo e função.</p></article><article class="ruleblock"><h3>Inventário</h3><p>Limite-base: 8 + (6 × Força). Acima do limite, deslocamento cai à metade e o personagem não reage; em 150%, deslocamento fica em 1 m e testes físicos sofrem −2. Abaixo de 50% de durabilidade, dano ou efeito cai pela metade; abaixo de 10%, o item não pode ser usado; em 0%, não pode ser reparado.</p></article><article class="ruleblock"><h3>Itens</h3><p>O livro registra categoria, peso, durabilidade, custo e efeitos. A venda vale 50% do preço de compra. Armas podem incluir dano, alcance, tipo de dano, munição e recarga.</p></article><article class="ruleblock"><h3>Referência completa</h3><p>Use esta página como resumo inicial. A versão completa e atualizada das regras pode ser ligada ao capítulo correspondente do Livro do Jogador.</p></article></div>')}
function editSheetModal(){let f=photoField('Retrato do personagem',sheet.portrait)+field('Nome','name',sheet.name)+field('Idade','age')+selectField('Arquétipo','archetype',['Herdeiro','Feiticeiro','Especialista'],sheet.archetype)+selectField('Classe / subclasse','className',Object.keys(CLASSNAMES),sheet.className)+selectField('Função','function',['Linha de Frente','Desafiador','Retaguarda'],sheet.function)+field('Nível','level',sheet.level,'number')+field('Alinhamento','alignment',sheet.alignment)+field('Saúde atual / máxima','health',sheet.health)+field('Resistência atual / máxima','resistance',sheet.resistance)+field('Stamina atual / máxima','stamina',sheet.stamina)+field('Defesa','defense',sheet.defense,'number')+area('Aparência','appearance',sheet.appearance)+area('Personalidade','personality',sheet.personality)+area('Objetivo','objective',sheet.objective)+area('Valores morais','moral',sheet.moral)+area('História','backstory',sheet.backstory)+area('Notas','notes',sheet.notes);f+='<div class="field full"><label>Atributos (DES, TEC, COR, CHA, PER, CON, RAC)</label><input name="attrs" value="'+ATTRS.map(x=>Number(sheet.attrs?.[x[0]]||0)).join(',')+'"><small class="muted">Informe sete valores separados por vírgula, na ordem indicada.</small></div>';formModal('Editar ficha',f,async d=>{for(let k of ['name','age','archetype','className','function','alignment','health','resistance','stamina','appearance','personality','objective','moral','backstory','notes'])sheet[k]=d.get(k);sheet.level=+d.get('level')||0;sheet.defense=+d.get('defense')||0;sheet.attrs=Object.fromEntries(ATTRS.map((x,i)=>[x[0],Number(d.get('attrs').split(',')[i])||0]));await persistSheet()})}
function itemModal(old,index){let x=old||{},f=selectField('Categoria','category',['Arma corpo a corpo','Arma de disparo','Arma pesada','Explosivo','Ferramenta','Operacional','Armadura','Veículo','Consumível','Item mágico','Outro'],x.category||'Outro')+field('Nome','name',x.name)+field('Quantidade','quantity',x.quantity||1,'number')+field('Peso / espaços por unidade','weight',x.weight||0,'number')+field('Durabilidade atual','durability',x.durability||0,'number')+field('Durabilidade máxima','durMax',x.durMax||0,'number')+field('Preço','cost',x.cost)+field('Dano','damage',x.damage)+field('Alcance ou raio','range',x.range)+field('Tipo de dano','damageType',x.damageType)+field('Tipo de munição','ammoType',x.ammoType)+field('Munição atual / capacidade','ammo',x.ammo)+field('Recarga por ação','reload',x.reload)+field('Efeitos bônus','effects',x.effects,'text',true)+area('Descrição','description',x.description);formModal(old?'Editar item':'Criar item',f,async d=>{let v=Object.fromEntries(d);let item={...v,quantity:+v.quantity||1,weight:+v.weight||0,durability:+v.durability||0,durMax:+v.durMax||0};if(index==null)sheet.items.push(item);else sheet.items[index]=item;await persistSheet()})}
function abilityModal(){let f=selectField('Tipo','type',['Função','Investigação','Classe','Arquétipo','Outro'],'Outro')+field('Origem','source',sheet.className)+field('Nome','name')+field('Nível','level','','number')+area('Descrição e efeito','description','',true);formModal('Nova habilidade',f,async d=>{sheet.abilities=sheet.abilities||[];sheet.abilities.push(Object.fromEntries(d));await persistSheet()})}

function powerModal(old,index){let x=old||{},opts=[sheet.power?.name||'Habilidade-base',...(sheet.powers||[]).filter((_,i)=>i!==index).map(n=>n.name)],f=field('Nome da expansão','name',x.name||'')+selectField('Pré-requisito','parent',opts,x.parent||opts[0])+selectField('Tipo','kind',['Novo uso','Técnica','Evolução','Limitação','Outro'],x.kind||'Novo uso')+field('Uso ou condição','uses',x.uses||'')+area('Descrição detalhada','description',x.description||'');formModal(old?'Editar expansão do poder':'Expandir árvore do poder',f,async d=>{sheet.powers=sheet.powers||[];let v=Object.fromEntries(d);if(index==null)sheet.powers.push(v);else sheet.powers[index]=v;await persistSheet()})}
function spellModal(){let f=field('Nome','name')+field('Nível de feitiço','level','','number')+field('Etapa de conjuração','stage')+field('Tempo de conjuração','time')+field('Requisitos','requirements')+field('Alcance','range')+field('Área','area')+field('Alvos','targets')+area('Descrição','description')+area('Efeito','effect');formModal('Novo feitiço',f,async d=>{sheet.spells=sheet.spells||[];sheet.spells.push(Object.fromEntries(d));await persistSheet()})}
function practiceModal(old,index){let x=old||{},f=field('Nome','name',x.name||'')+selectField('Categoria','category',['Prática','Conhecimento','Geral','Outro'],x.category||'Prática')+area('Descrição e usos','description',x.description||'');formModal(old?'Editar prática ou conhecimento':'Criar prática ou conhecimento',f,async d=>{sheet.practices=sheet.practices||[];let v=Object.fromEntries(d);if(index==null)sheet.practices.push(v);else sheet.practices[index]=v;await persistSheet()})}
function createCampaign(){formModal('Criar campanha',photoField('Imagem da campanha')+field('Nome da campanha','name','','text',true)+area('Descrição','description'),async d=>{let r=await api('campaigns','POST',{name:d.get('name'),description:d.get('description'),cover:d.get('uploadedImage')||''});view='campaigns';notify('Campanha criada. Gere ou copie o convite.')})}
function renderHomebrewModal(){let f=selectField('Tipo','type',['Item','Habilidade','Feitiço','Prática','Regra','Outro'],'Item')+field('Nome','name','','text',true)+area('Descrição','description')+field('Vincular a campanha (opcional)','campaign');formModal('Criar conteúdo Homebrew',f,async d=>{await api('homebrew','POST',{item:{name:d.get('name'),type:d.get('type'),description:d.get('description'),campaign:d.get('campaign')||null,scope:d.get('campaign')?'Campanha':'Pessoal'}})})}
function campaignInvite(){let url=location.origin+location.pathname+'?join='+encodeURIComponent(campaign.campaign.invite);navigator.clipboard.writeText(url).then(()=>notify('Convite copiado')).catch(()=>prompt('Copie este link:',url))}
function attachSheetModal(){if(!sheets.length)return notify('Crie uma ficha antes de adicionar agentes.');let f='<div class="field full"><label>Escolha uma das suas fichas</label><select name="sheet">'+sheets.map(x=>'<option value="'+$esc(x.id)+'">'+$esc(x.name)+' · '+$esc(x.archetype)+'</option>').join('')+'</select></div>';formModal('Adicionar agente à campanha',f,async d=>{await api('campaign/'+encodeURIComponent(campaign.campaign.id)+'/add-sheet','POST',{sheet:d.get('sheet')});await openCampaign(campaign.campaign.id)})}
function bindDelegated(){document.addEventListener('click',async e=>{let b=e.target.closest('button,[data-sheet],[data-campaign],[data-campsheet]');if(!b)return;try{
if(b.dataset.sheet){sheet=sheets.find(x=>x.id===b.dataset.sheet);specialTab='overview';campaign=null;campaignFrom=false;render();return}
if(b.dataset.campaign){await openCampaign(b.dataset.campaign);return}
if(b.dataset.campsheet){let s=campaign.sheets.find(x=>x.id===b.dataset.campsheet);sheet=s;campaignFrom=true;specialTab='overview';render();return}
if(b.dataset.stab){specialTab=b.dataset.stab;render();return}
if(b.dataset.rule){ruleTab=b.dataset.rule;render();return}
if(b.dataset.delitem!=null){sheet.items.splice(+b.dataset.delitem,1);await persistSheet();render();return}
if(b.dataset.edititem!=null){itemModal(sheet.items[+b.dataset.edititem],+b.dataset.edititem);return}
if(b.dataset.editability!=null){abilityModal(sheet.abilities[+b.dataset.editability],+b.dataset.editability);return}
if(b.dataset.editspell!=null){spellModal(sheet.spells[+b.dataset.editspell],+b.dataset.editspell);return}
if(b.dataset.editpractice!=null){practiceModal(sheet.practices[+b.dataset.editpractice],+b.dataset.editpractice);return}
if(b.dataset.editpower!=null){powerModal(sheet.powers[+b.dataset.editpower],+b.dataset.editpower);return}
if(b.dataset.delability!=null){sheet.abilities.splice(+b.dataset.delability,1);await persistSheet();render();return}
if(b.hasAttribute('data-toggle-spell')){b.closest('.spell-card').classList.toggle('expanded');return}
if(b.dataset.delspell!=null){sheet.spells.splice(+b.dataset.delspell,1);await persistSheet();render();return}
if(b.dataset.delpractice!=null){sheet.practices.splice(+b.dataset.delpractice,1);await persistSheet();render();return}
if(b.dataset.delpoder!=null){sheet.powers.splice(+b.dataset.delpoder,1);await persistSheet();render();return}
if(b.dataset.delhomebrew){await api('homebrew/'+encodeURIComponent(b.dataset.delhomebrew),'DELETE');await refresh();render();return}
if(b.dataset.detach){if(confirm('Remover esta ficha da campanha? A ficha pessoal continua guardada.')){await api('campaign/'+campaign.campaign.id+'/remove-sheet','POST',{sheet:b.dataset.detach});await openCampaign(campaign.campaign.id)}return}
if(b.dataset.kick){if(confirm('Remover este participante e bloquear o acesso à campanha?')){await api('campaign/'+campaign.campaign.id+'/kick','POST',{user:b.dataset.kick});await openCampaign(campaign.campaign.id)}return}
if(b.id==='createSheet'){createSheet();return}
if(b.id==='editSheet'){editSheetModal();return}
if(b.id==='backSheets'){if(campaignFrom){campaignFrom=false;let id=campaign.campaign.id;sheet=null;await openCampaign(id)}else{sheet=null;render()}return}
if(b.id==='addItemCatalog'||b.id==='addAbilityCatalog'||b.id==='addSpecialCatalog'){notify('Em breve!');return}
if(b.id==='treeZoomOut'||b.id==='treeZoomIn'){treeZoom=Math.max(.55,Math.min(1.5,treeZoom+(b.id==='treeZoomIn'?.1:-.1)));render();return}
if(b.id==='addItem'){itemModal();return}
if(b.id==='inventorySettings'){let f=field('Limite manual de espaços (0 usa fórmula)','limit',sheet.inventory?.limit||0,'number')+field('Espaços de bônus de bolsas e acessórios','bonus',sheet.inventory?.bonus||0,'number');formModal('Ajustar inventário',f,async d=>{sheet.inventory={limit:+d.get('limit')||0,bonus:+d.get('bonus')||0};await persistSheet()});return}
if(b.id==='newAbility'){abilityModal();return}
if(b.id==='editPower'){powerBaseModal();return}
if(b.id==='newPower'){powerModal();return}
if(b.id==='newSpell'){spellModal();return}
if(b.id==='newPractice'){practiceModal();return}
if(b.id==='createCampaign'){createCampaign();return}
if(b.id==='joinCampaign'){let url=prompt('Cole o link de convite ou o código da campanha:');if(url){let tok=url.includes('join=')?new URL(url).searchParams.get('join'):url.trim();await api('join','POST',{token:tok});await refresh();render();notify('Você entrou na campanha')}return}
if(b.id==='backCampaigns'){campaign=null;view='campaigns';render();return}
if(b.id==='copyInvite'){campaignInvite();return}
if(b.id==='revokeInvite'){let d=await api('campaign/'+campaign.campaign.id+'/revoke-link','POST',{});campaign.campaign.invite=d.invite;render();notify('Convite antigo revogado; novo link gerado');return}
if(b.id==='editCampaign'){let f=photoField('Imagem da campanha',campaign.campaign.cover)+field('Nome','name',campaign.campaign.name)+area('Descrição','description',campaign.campaign.description);formModal('Editar campanha',f,async d=>{await api('campaign/'+campaign.campaign.id+'/update','POST',{name:d.get('name'),description:d.get('description'),cover:d.get('uploadedImage')||campaign.campaign.cover||''});await openCampaign(campaign.campaign.id)});return}
if(b.id==='deleteSheet'){if(confirm('Excluir esta ficha?')){await api('sheet/'+encodeURIComponent(sheet.id),'DELETE');sheet=null;await refresh();render()}return}
if(b.id==='deleteCampaign'){if(confirm('Excluir esta campanha e remover todos os vínculos?')){await api('campaign/'+campaign.campaign.id,'DELETE');campaign=null;await refresh();render()}return}
if(b.id==='attachSheet'){attachSheetModal();return}
if(b.id==='newHomebrew'){renderHomebrewModal();return}
}catch(err){notify(err.message)}})}
function statInputs(c){let h='<div class="field full"><label>Atributos (modificadores)</label><div class="attributes" style="margin-top:6px">'+ATTRS.map(x=>'<label class="attribute"><small>'+x[0]+' · '+x[1]+'</small><input style="width:55px;margin-top:5px;background:#111;color:#fff;border:1px solid #38352f;border-radius:5px;padding:4px;text-align:center" type="number" min="-1" max="7" name="attr-'+x[0]+'" value="'+$esc(c?.attrs?.[x[0]]??0)+'"></label>').join('')+'</div></div>';h+='<div class="field full"><label>Perícias</label><div class="itemgrid" style="margin-top:6px">'+Object.entries(SKILLS).map(([a,ls])=>'<div class="itemcard"><b class="muted">'+a+' · '+NAMES[a]+'</b>'+ls.map(n=>'<label style="display:flex;justify-content:space-between;align-items:center;margin:6px 0;color:var(--muted);font-size:10px">'+n+'<input style="width:48px;background:#111;color:white;border:1px solid #38352f;border-radius:5px;padding:4px;text-align:center" type="number" min="0" max="6" name="skill-'+a+'-'+n+'" value="'+$esc(c?.skills?.[a]?.[n]??0)+'"></label>').join('')+'</div>').join('')+'</div></div>';return h}
function createSheet(){let f=photoField('Retrato do personagem')+field('Nome','name','','text',true)+field('Idade','age')+selectField('Arquétipo','archetype',['Herdeiro','Feiticeiro','Especialista'],'Herdeiro')+selectField('Classe / subclasse','className',['Escolhido','Experimento','Vítima','Mutante'],'Escolhido')+selectField('Função','function',['Linha de Frente','Desafiador','Retaguarda'],'Linha de Frente')+field('Nível','level',1,'number')+field('Alinhamento','alignment')+field('Saúde atual','healthNow',0,'number')+field('Saúde máxima','healthMax',0,'number')+field('Resistência atual','resNow',0,'number')+field('Resistência máxima','resMax',0,'number')+field('Stamina atual','staminaNow',0,'number')+field('Stamina máxima','staminaMax',0,'number')+field('Defesa','defense',6,'number')+statInputs(null)+area('Aparência','appearance')+area('Personalidade','personality')+area('Objetivo','objective')+area('Valores morais','moral')+area('História','backstory')+area('Notas','notes');formModal('Criar ficha',f,async d=>{let attrs={},skills={};ATTRS.forEach(x=>attrs[x[0]]=+d.get('attr-'+x[0])||0);Object.entries(SKILLS).forEach(([a,ls])=>{skills[a]={};ls.forEach(n=>{let v=+d.get('skill-'+a+'-'+n)||0;if(v)skills[a][n]=v})});let c={name:d.get('name'),age:d.get('age'),archetype:d.get('archetype'),className:d.get('className'),function:d.get('function'),level:+d.get('level')||1,alignment:d.get('alignment'),healthNow:+d.get('healthNow')||0,healthMax:+d.get('healthMax')||0,resNow:+d.get('resNow')||0,resMax:+d.get('resMax')||0,staminaNow:+d.get('staminaNow')||0,staminaMax:+d.get('staminaMax')||0,defense:+d.get('defense')||6,attrs,skills,appearance:d.get('appearance'),personality:d.get('personality'),objective:d.get('objective'),moral:d.get('moral'),backstory:d.get('backstory'),notes:d.get('notes'),items:[],abilities:[],powers:[],spells:[],practices:[],inventory:{limit:0,bonus:0}};let r=await api('sheets','POST',{sheet:c});sheet=r.sheet;sheet.ownerId=me.id})}
function editSheetModal(){let f=field('Nome','name',sheet.name)+field('Idade','age',sheet.age)+selectField('Arquétipo','archetype',['Herdeiro','Feiticeiro','Especialista'],sheet.archetype)+selectField('Classe / subclasse','className',Object.keys(CLASSNAMES),sheet.className)+selectField('Função','function',['Linha de Frente','Desafiador','Retaguarda'],sheet.function)+field('Nível','level',sheet.level,'number')+field('Alinhamento','alignment',sheet.alignment)+field('Saúde atual','healthNow',sheet.healthNow,'number')+field('Saúde máxima','healthMax',sheet.healthMax,'number')+field('Resistência atual','resNow',sheet.resNow,'number')+field('Resistência máxima','resMax',sheet.resMax,'number')+field('Stamina atual','staminaNow',sheet.staminaNow,'number')+field('Stamina máxima','staminaMax',sheet.staminaMax,'number')+field('Defesa','defense',sheet.defense,'number')+statInputs(sheet)+area('Aparência','appearance',sheet.appearance)+area('Personalidade','personality',sheet.personality)+area('Objetivo','objective',sheet.objective)+area('Valores morais','moral',sheet.moral)+area('História','backstory',sheet.backstory)+area('Notas','notes',sheet.notes);formModal('Editar ficha',f,async d=>{sheet.portrait=d.get('uploadedImage')||sheet.portrait||'';for(let k of ['name','age','archetype','className','function','alignment','appearance','personality','objective','moral','backstory','notes'])sheet[k]=d.get(k);for(let k of ['level','defense','healthNow','healthMax','resNow','resMax','staminaNow','staminaMax'])sheet[k]=+d.get(k)||0;sheet.attrs={};ATTRS.forEach(x=>sheet.attrs[x[0]]=+d.get('attr-'+x[0])||0);sheet.skills={};Object.entries(SKILLS).forEach(([a,ls])=>{sheet.skills[a]={};ls.forEach(n=>{let v=+d.get('skill-'+a+'-'+n)||0;if(v)sheet.skills[a][n]=v})});await persistSheet()})}
function abilityModal(){let typeOptions=['Função','Investigação',CLASSNAMES[sheet.className]||'Arquétipo','Outro'];let f=selectField('Tipo / origem','type',typeOptions,typeOptions[0])+field('Origem','source',sheet.className)+field('Nome','name')+field('Nível','level','','number')+area('Descrição e efeito','description');formModal('Nova habilidade',f,async d=>{sheet.abilities=sheet.abilities||[];sheet.abilities.push(Object.fromEntries(d));await persistSheet()})}
function inventoryStats(){let force=Number(sheet.skills?.COR?.Força||0),bonus=Number(sheet.inventory?.bonus||0),limit=Number(sheet.inventory?.limit||0),base=limit||8+6*force+bonus,total=(sheet.items||[]).reduce((a,x)=>a+(Number(x.weight)||0)*(Number(x.quantity)||1),0);return {force,bonus,base,total,pct:base?total/base:0}}
function overview(){let groups=[['Aparência',sheet.appearance],['Personalidade',sheet.personality],['Objetivo',sheet.objective],['Valores morais',sheet.moral],['História',sheet.backstory],['Notas',sheet.notes]].filter(x=>x[1]);return '<section class="overview-highlight"><div class="overview-title"><div class="eyebrow">Estado atual</div><h2>Recursos vitais</h2></div><div class="meters">'+[['Saúde',sheet.healthNow,sheet.healthMax,'health'],['Resistência',sheet.resNow,sheet.resMax,'resist'],['Stamina',sheet.staminaNow,sheet.staminaMax,'stamina']].map(([n,v,m,k])=>'<div class="meter '+k+'"><span>'+n+'</span><strong>'+$esc(v||0)+' <i>/ '+$esc(m||0)+'</i></strong><div class="bar"><i style="--fill:'+Math.min(100,(Number(v)||0)/(Number(m)||1)*100)+'%"></i></div></div>').join('')+'</div></section><div class="sectiontitle">Atributos · valores principais</div><div class="attributes">'+ATTRS.map(([k,n])=>'<div class="attribute"><small>'+k+' · '+n+'</small><b>'+$esc(sheet.attrs?.[k]??0)+'</b></div>').join('')+'</div><div class="identity-strip"><span>IDADE <b>'+$esc(sheet.age||'—')+'</b></span><span>ALINHAMENTO <b>'+$esc(sheet.alignment||'—')+'</b></span><span>DEFESA <b>'+$esc(sheet.defense||'—')+'</b></span><span>FUNÇÃO <b>'+$esc(sheet.function||'—')+'</b></span></div>'+(Object.keys(sheet.skills||{}).length?'<div class="sectiontitle">Perícias treinadas</div><div class="skill-strip">'+Object.entries(sheet.skills).flatMap(([a,ks])=>Object.entries(typeof ks==='object'?ks:{[a]:ks}).filter(([,v])=>v).map(([n,v])=>'<span class="skill-chip">'+$esc(n)+' <b>+'+$esc(v)+'</b></span>')).join('')+'</div>':'')+(groups.length?'<div class="sectiontitle">Identidade e história</div><div class="bio-grid">'+groups.map(([n,v])=>'<div class="bio"><small>'+n+'</small><p>'+$esc(v)+'</p></div>').join('')+'</div>':'')}

function renderCampaign(){let c=campaign.campaign,gm=c.role==='gm',agentCards=campaign.sheets.map(s=>'<article class="card click" data-campsheet="'+$esc(s.id)+'"><div class="cardtop"><div class="initial">'+$esc((s.name||'?')[0])+'</div><span class="tag">'+$esc(s.archetype)+'</span></div><h3>'+$esc(s.name)+'</h3><div class="muted">'+$esc(s.className)+' · nível '+$esc(s.level)+'</div><div class="pills"><span class="pill">'+(s.ownerId===me.id?'SUA FICHA':'FICHA DE JOGADOR')+'</span></div></article>').join('');return '<div class="eyebrow">Campanha · '+(gm?'Mestre':'Jogador')+'</div><div class="heading"><div><h1>'+$esc(c.name)+'</h1><p>'+$esc(c.description||'')+'</p></div><button id="backCampaigns" class="btn">← Campanhas</button></div><div class="toolbar">'+(gm?'<button class="btn" id="editCampaign">Editar campanha</button><button class="btn" id="copyInvite">Copiar convite</button><button class="btn" id="revokeInvite">Gerar novo convite</button><button class="btn danger" id="deleteCampaign">Excluir campanha</button>':'')+'</div><div class="sectiontitle">Participantes · '+campaign.members.length+'</div><div class="cards">'+campaign.members.map(m=>'<article class="card"><div class="cardtop"><span class="tag">'+(m.role==='gm'?'MESTRE':'JOGADOR')+'</span>'+(gm&&m.id!==me.id?'<button class="btn small danger" data-kick="'+$esc(m.id)+'">Remover</button>':'')+'</div><h3>'+$esc(m.name)+'</h3></article>').join('')+'</div><div class="sectiontitle">Agentes da campanha</div><div class="toolbar"><button id="attachSheet" class="btn primary">＋ Adicionar uma das minhas fichas</button></div><div class="cards">'+(agentCards||'<div class="empty">Nenhum agente foi adicionado à campanha.</div>')+'</div>'}
function renderRules(){let create=ruleTab==='create';return '<div class="eyebrow">Livro do Jogador</div><div class="heading"><div><h1>Regras de O FIM</h1><p>Índice de consulta para criação e jogo.</p></div></div><div class="tabs"><button class="'+(create?'active':'')+'" data-rule="create">Criação de fichas</button><button class="'+(!create?'active':'')+'" data-rule="general">Regras gerais</button></div>'+(create?'<div class="rulesgrid"><article class="ruleblock"><h3>Conceito e identidade</h3><p>Nome, idade, aparência, personalidade, objetivo, alinhamento, história e valores morais.</p></article><article class="ruleblock"><h3>Atributos</h3><p>5 pontos iniciais +1 da função. Um atributo pode ser reduzido a −1 para receber 1 ponto. O limite aumenta nos níveis 7, 15, 21, 25 e 29.</p></article><article class="ruleblock"><h3>Arquétipos</h3><ul><li>Herdeiro: +1 Saúde e +1 Stamina por nível; 2 perícias sociais e 2 físicas.</li><li>Feiticeiro: +2 Stamina por nível; 3 perícias mentais e 1 social.</li><li>Especialista: +2 Saúde por nível; 1 mental, 1 física e 2 perícias à escolha.</li></ul></article><article class="ruleblock"><h3>Funções</h3><p>Linha de Frente: +1 Corpo e Proativo. Desafiador: +1 Técnica e Rastreador Nato. Retaguarda: +1 Raciocínio e Diligente. Cada função também altera os medidores por nível.</p></article><article class="ruleblock"><h3>Perícias</h3><p>Modificadores treinados agrupados por atributo. Bônus iniciais +1 ou +2; limites maiores nos níveis 8, 15, 23 e 28.</p></article><article class="ruleblock"><h3>Valores de nível 0</h3><p>Ser humano comum: Saúde 5 + Corpo; Resistência 4; Stamina 5; Defesa 6; 5 + RAC pontos de perícia.</p></article><article class="ruleblock"><h3>Progressão de nível</h3><p>Saúde, Resistência e Stamina crescem em faixas de níveis; arquétipo e função acrescentam seus próprios valores. A tabela de classe define atributos, perícias, vantagens, poderes de função e técnicas de subclasse.</p></article><article class="ruleblock"><h3>Classe e subclasse</h3><p>Herdeiros: Escolhido, Experimento, Vítima e Mutante. Feiticeiros: Explorador do Oculto, Bruxo, Mago e Clérigo. Especialistas: Militar, Formado, Arrependido e Investigador.</p></article></div>':'<div class="rulesgrid"><article class="ruleblock"><h3>Testes e dados</h3><p>d8 para situação difícil, d10 para teste complicado, d12 para teste normal. Some atributo e perícia. A categoria do dado pode subir ou descer passos.</p></article><article class="ruleblock"><h3>Dificuldades</h3><p>Muito trivial 4; fácil 5–6; regular 7–8; desafio moderado 9–10; difícil 11–12; exigente 13–14; extremo 15–17; quase impossível 18–20; cósmico 21+.</p></article><article class="ruleblock"><h3>Opostos, críticos e modificadores</h3><p>Em testes opostos, maior resultado vence; empate favorece quem ataca. Crítico: máximo no dado e depois 7+ num dado igual. No 1, role de novo: ímpar causa falha crítica. Vantagem rola dois dados e usa o maior; desvantagem usa o menor.</p></article><article class="ruleblock"><h3>Testes em equipe</h3><p>Teste auxiliado soma 1d4 + modificador ao teste principal. Teste conjunto resolve um objetivo comum; testes acumulados somam sucessos ou falhas definidos pelo mestre. Uma nova tentativa após falha pode custar outra ação e trazer consequências.</p></article><article class="ruleblock"><h3>Ações, habilidades e Stamina</h3><p>A habilidade indica o tipo de ação; se não indicar, é ação simples. Custos de Stamina, duração, recarga, condições e pré-requisitos acompanham cada habilidade. Habilidades passivas não consomem ação nem Stamina. Afinidade pode alterar custo, ação ou efeito.</p></article><article class="ruleblock"><h3>Saúde, Resistência e Stamina</h3><p>Com Saúde 0, pode ocorrer estado moribundo. Com Resistência abaixo da metade, Defender é limitado a uma vez por rodada; com 0, não pode Defender. Com Stamina 0, fica Vulnerável e Desgastado e não usa habilidades com custo.</p></article><article class="ruleblock"><h3>Lesões, sanidade e traumas</h3><p>Lesões são determinadas por 1d20 e podem causar sequelas graves. Sanidade acumula contadores; descanso completo remove 2. Ao exceder Coragem +8, o personagem fica enlouquecendo. Traumas também usam uma tabela de 1d20.</p></article><article class="ruleblock"><h3>Perigos</h3><p>O livro aborda fogo, água, quedas, pressão, temperatura, fumaça, veneno, eletricidade, explosões, desabamentos, gravidade e terreno árduo.</p></article><article class="ruleblock"><h3>Inventário e durabilidade</h3><p>Limite 8 + (6 × Força), com bônus de acessórios. Acima do limite: metade do deslocamento e sem reação. Em 150%: deslocamento 1 m, sem carregar mais e −2 em testes físicos. Abaixo de 50% da durabilidade, dano/efeito cai pela metade; abaixo de 10%, não usa; em 0%, não repara. Venda vale metade do preço.</p></article><article class="ruleblock"><h3>Consultar o livro completo</h3><p><a class="link" target="_blank" rel="noreferrer" href="https://docs.google.com/document/d/14mfc5KO6JHzqU6RHpNsd1zpVyaFfGEaI26N2NaVfFVU/edit">Abrir O FIM: RPG — Livro do Jogador</a></p></article></div>')}
document.addEventListener('change',e=>{if(e.target.name!=='archetype')return;let sel=$('modalform')?.elements.className;if(!sel)return;let map={Herdeiro:['Escolhido','Experimento','Vítima','Mutante'],Feiticeiro:['Explorador do Oculto','Bruxo','Mago','Clérigo'],Especialista:['Militar','Formado','Arrependido','Investigador']},opts=map[e.target.value]||[];sel.innerHTML=opts.map(x=>'<option>'+x+'</option>').join('')});
function quality(x){let v=Number(x.durability)||0,m=Number(x.durMax)||0;if(m<=0)return '';let r=v/m;if(v<=0)return 'Quebrado: não pode ser usado nem reparado.';if(r<.1)return 'Menos de 10%: não pode ser usado.';if(r<.5)return 'Menos de 50%: dano/efeito pela metade.';return 'Qualidade funcional.'}
function inventoryView(){let s=inventoryStats(),over=s.pct>1.5?'Carga em 150% ou mais: não pode carregar itens adicionais, deslocamento cai para 1 m e testes físicos recebem −2.':s.pct>1?'Acima do limite: deslocamento reduzido à metade e sem reação a ataques.':'';return '<div class="section-heading"><div><h2>Inventário</h2><p>Espaços, peso e durabilidade acompanhados em um só lugar.</p><small>Limite pela regra: 8 + (6 × Força) espaços; bolsas e acessórios podem alterar esse valor.</small></div><button class="btn" id="inventorySettings">Ajustar limite</button></div><div class="inventory-progress"><div><span>OCUPAÇÃO</span><strong>'+s.total.toFixed(1)+' <i>/ '+s.base.toFixed(1)+' espaços</i></strong><div class="bar"><i style="--fill:'+Math.min(100,s.pct*100)+'%"></i></div></div><div class="inventory-rule">'+(over||'Carga dentro do limite. Acompanhe o peso e a durabilidade dos itens.')+'</div></div><div class="toolbar"><span class="muted">'+(sheet.items||[]).length+' itens registrados</span><div class="toolbar-actions"><button class="btn" id="addItemCatalog">＋ Adicionar · <small>em breve!</small></button><button class="btn primary" id="addItem">Criar item</button></div></div><div class="itemgrid">'+((sheet.items||[]).map((x,i)=>'<article class="itemcard"><div class="cardtop"><span class="tag">'+$esc(x.category||'Item')+'</span><div><button class="iconbtn" data-edititem="'+i+'">Editar</button><button class="iconbtn" data-delitem="'+i+'">Remover</button></div></div><h4>'+$esc(x.name)+'</h4><p class="muted">'+$esc(x.description||x.effects||'')+'</p><div class="pills"><span class="pill">PESO '+$esc(x.weight||0)+' × '+$esc(x.quantity||1)+'</span><span class="pill">DUR. '+$esc(x.durability||'—')+'/'+$esc(x.durMax||'—')+'</span><span class="pill">CUSTO '+$esc(x.cost||'—')+'</span></div><div class="pills"><span class="pill">'+$esc(x.damage||'Sem dano')+'</span><span class="pill">'+$esc(x.range||'')+'</span><span class="pill">'+$esc(x.damageType||'')+'</span></div></article>').join('')||'<div class="empty">Seu inventário está vazio. Crie seu primeiro item para começar.</div>')+'</div>'}
function abilityModal(old,index){let x=old||{},cls=CLASSNAMES[sheet.className]||'Classe',opts=['Função','Investigação',cls,'Arquétipo','Outro'],f=selectField('Tipo / marcador','type',opts,x.type||'Função')+field('Origem','source',x.source||sheet.className)+field('Nome','name',x.name||'')+field('Nível','level',x.level||'','number')+field('Ação','action',x.action||'Ação simples')+field('Custo de Stamina','stamina',x.stamina||'','number')+field('Duração','duration',x.duration||'')+field('Recarga','recharge',x.recharge||'')+field('Pré-requisitos','requirements',x.requirements||'')+field('Condição de uso','conditions',x.conditions||'')+field('Afinidade','affinity',x.affinity||'')+area('Descrição e efeito','description',x.description||'');formModal(old?'Editar habilidade':'Criar habilidade',f,async d=>{sheet.abilities=sheet.abilities||[];let v=Object.fromEntries(d);if(index==null)sheet.abilities.push(v);else sheet.abilities[index]=v;await persistSheet()})}
function spellModal(old,index){let x=old||{},f=field('Nome','name',x.name||'')+field('Nível do feitiço','level',x.level||'','number')+field('Etapa de conjuração','stage',x.stage||'')+field('Tempo de conjuração','time',x.time||'')+field('Custo de Stamina','stamina',x.stamina||'','number')+field('Requisitos','requirements',x.requirements||'')+field('Alcance','range',x.range||'')+field('Área','area',x.area||'')+field('Alvos','targets',x.targets||'')+field('Duração','duration',x.duration||'')+field('Recarga','recharge',x.recharge||'')+area('Descrição','description',x.description||'')+area('Efeito','effect',x.effect||'');formModal(old?'Editar feitiço':'Criar feitiço',f,async d=>{sheet.spells=sheet.spells||[];let v=Object.fromEntries(d);if(index==null)sheet.spells.push(v);else sheet.spells[index]=v;await persistSheet()})}
function renderRules(){let create=['identidade','atributos','arquetipos','funcao','pericias','progressao'].includes(ruleTab),rules=create?{identidade:['Identidade do personagem','Na criação, registre nome, idade, aparência, personalidade, objetivo, alinhamento, valores morais, história e notas. Esses campos descrevem a pessoa e sua motivação na campanha.'],atributos:['Atributos iniciais','Distribua 5 pontos entre os atributos. A função concede +1 em seu atributo indicado. É possível reduzir um atributo a −1 para recuperar 1 ponto. Os limites de atributo aumentam nos níveis 7, 15, 21, 25 e 29.'],arquetipos:['Arquétipos e recursos','Herdeiro: +1 Saúde e +1 Stamina por nível; recebe 2 perícias sociais e 2 físicas. Feiticeiro: +2 Stamina por nível; recebe 3 perícias mentais e 1 social. Especialista: +2 Saúde por nível; recebe 1 perícia mental, 1 física e 2 à escolha.'],funcao:['Funções e perfil de investigação','Linha de Frente recebe +1 Corpo e perfil Proativo. Desafiador recebe +1 Técnica e perfil Rastreador Nato. Retaguarda recebe +1 Raciocínio e perfil Diligente. A função também participa do cálculo de recursos por nível.'],pericias:['Perícias treinadas','Escolha perícias dentro dos grupos de atributos da ficha. Os bônus iniciais podem ser +1 ou +2 conforme a perícia. Os limites máximos sobem nos níveis 8, 15, 23 e 28.'],progressao:['Progressão e nível 0','A progressão distribui melhorias de atributo, perícia, vantagens de classe, poderes de função e técnicas de subclasse. No nível 0, a pessoa comum usa Saúde 5 + Corpo, Resistência 4, Stamina 5, Defesa 6 e 5 + RAC pontos de perícia.']}:{testes:['Testes e dados','Use d8 para testes muito difíceis, d10 para situações complicadas e d12 para testes normais; some atributo e perícia. O dado pode subir ou descer passos quando regras e circunstâncias alteram o teste.'],dificuldade:['Graus de dificuldade','Muito trivial: 4; fácil: 5–6; regular: 7–8; desafio moderado: 9–10; difícil: 11–12; exigente: 13–14; extremo: 15–17; quase impossível: 18–20; cósmico: 21 ou mais.'],equipe:['Ajuda e testes em equipe','No teste auxiliado, some 1d4 + modificador ao teste principal. Testes conjuntos partilham um objetivo. Testes acumulados contam sucessos ou falhas definidos pelo mestre; tentar de novo pode custar outra ação e trazer consequências.'],combate:['Rodada, ataque e defesa','Todos anunciam suas ações; a rodada ocorre em duas fases simultâneas. Compare o resultado do ataque com a Defesa. Contra ataques que permitem reação, Defender usa Proteção; isso não vale contra disparos à distância. Resistência limita quantas vezes se pode Defender na rodada.'],acoes:['Ações e movimento','Deslocar permite percorrer 7,5 m. Ações comuns incluem atacar, manobrar, preparar, mirar, levantar, esconder-se, ajudar, usar cautela/cobertura e primeiros socorros. Investida e conjuração são ações complexas; sacar item e pegar objeto são simples.'],dano:['Dano, Saúde e Resistência','Acerto crítico multiplica dano por 1,5. Vulnerabilidade ao tipo de dano ou à condição Vulnerável também multiplica por 1,5. Resistência a dano reduz o dano recebido. Com Resistência abaixo da metade, Defender fica limitado a uma vez por rodada; com 0, não pode Defender. Saúde 0 pode levar a Moribundo.'],stamina:['Stamina e habilidades','Com Stamina 0, o personagem fica Vulnerável e Desgastado e não pode usar habilidades com custo. Se uma habilidade não indicar ação, ela usa ação simples. Habilidades passivas não gastam ação nem Stamina; afinidade pode modificar seus efeitos.'],distancia:['Tipos de dano e distância','Danos físicos, de natureza, especiais e hierofantes têm tipos próprios. Um quadrado mede 1,25 m. Distâncias: adjacente até 1,25 m; próximo até 10 m; médio até 20 m; extenso até 35 m; distante até 60 m; extremo até 100 m.'],inventario:['Inventário e durabilidade','O limite básico é 8 + (6 × Força) espaços, com bônus de bolsas e acessórios. Acima do limite, deslocamento cai à metade e não há reação; em 150%, deslocamento cai para 1 m e testes físicos sofrem −2. Abaixo de 50% de durabilidade, o dano/efeito cai pela metade; abaixo de 10%, o item não pode ser usado; em 0%, não pode ser reparado. Venda vale metade.'],perigos:['Condições, investigação e perigos','Perseguições e investigações combinam perícias, ajuda e testes acumulados. Lesões e traumas usam tabelas de 1d20. Sanidade acumula contadores; descanso completo remove 2. Fogo, água, quedas, pressão, fumaça, venenos, eletricidade e explosões são tratados como perigos.']} ;let keys=Object.keys(rules),labels={identidade:'Identidade',atributos:'Atributos',arquetipos:'Arquétipos',funcao:'Função',pericias:'Perícias',progressao:'Progressão',testes:'Testes',dificuldade:'Dificuldade',equipe:'Equipe',combate:'Combate',acoes:'Ações',dano:'Dano e Saúde',stamina:'Stamina',distancia:'Distâncias',inventario:'Inventário',perigos:'Perigos e condições'};return '<div class="eyebrow">Livro do Jogador</div><div class="heading"><div><h1>Regras de O FIM</h1><p>Cada tópico explica quando se aplica e o que seu resultado significa durante a criação ou o jogo.</p></div></div><div class="rule-context">'+(create?'CONSULTA · CRIAÇÃO DE FICHA':'CONSULTA · REGRAS GERAIS')+'</div><div class="tabs rule-tabs">'+keys.map(k=>'<button class="'+(ruleTab===k?'active':'')+'" data-rule="'+k+'">'+labels[k]+'</button>').join('')+'</div><article class="ruleblock rule-detail"><span class="eyebrow">'+(create?'Na criação':'Durante o jogo')+'</span><h2>'+rules[ruleTab][0]+'</h2><p>'+rules[ruleTab][1]+'</p><small>Contexto: '+(create?'use este tópico ao criar ou revisar uma ficha.':'consulte este tópico quando a situação aparecer na mesa.')+'</small></article><div class="rule-switch"><button class="btn" data-rule="'+(create?'testes':'identidade')+'">'+(create?'Ir às regras gerais →':'← Ir à criação de fichas')+'</button><a class="link" target="_blank" rel="noreferrer" href="https://docs.google.com/document/d/14mfc5KO6JHzqU6RHpNsd1zpVyaFfGEaI26N2NaVfFVU/edit">Consultar o livro completo</a></div>'}
function renderCampaign(){let c=campaign.campaign,gm=c.role==='gm',cover=c.cover?'<img src="'+$esc(c.cover)+'" alt="">':'<img src="'+ART_POOL[Math.abs(String(c.id).split('').reduce((a,x)=>a+x.charCodeAt(0),0))%ART_POOL.length]+'" alt="">';let agentCards=campaign.sheets.map(s=>'<article class="card click" data-campsheet="'+$esc(s.id)+'"><div class="campaign-agent-portrait">'+(s.portrait?'<img src="'+$esc(s.portrait)+'" alt="Retrato de '+$esc(s.name)+'">':'<img src="'+ART_POOL[Math.abs(String(s.id||'').split('').reduce((a,x)=>a+x.charCodeAt(0),0))%ART_POOL.length]+'" alt="">')+'</div><div class="cardtop"><span class="tag">'+$esc(s.archetype)+'</span></div><h3>'+$esc(s.name)+'</h3><div class="muted">'+$esc(s.className)+' · nível '+$esc(s.level)+'</div><div class="pills"><span class="pill">'+(s.ownerId===me.id?'SUA FICHA':'FICHA DE JOGADOR')+'</span></div>'+(gm||s.ownerId===me.id?'<button class="btn small danger" data-detach="'+$esc(s.id)+'">Remover da campanha</button>':'')+'</article>').join('');return '<div class="campaign-detail-cover">'+cover+'</div><div class="eyebrow">Campanha · '+(gm?'Mestre':'Jogador')+'</div><div class="heading"><div><h1>'+$esc(c.name)+'</h1><p>'+$esc(c.description||'')+'</p></div><button id="backCampaigns" class="btn">← Campanhas</button></div><div class="toolbar">'+(gm?'<button class="btn" id="editCampaign">Editar campanha</button><button class="btn" id="copyInvite">Copiar convite</button><button class="btn" id="revokeInvite">Gerar novo convite</button><button class="btn danger" id="deleteCampaign">Excluir campanha</button>':'')+'</div><div class="sectiontitle">Participantes · '+campaign.members.length+'</div><div class="cards">'+campaign.members.map(m=>'<article class="card"><div class="cardtop"><span class="tag">'+(m.role==='gm'?'MESTRE':'JOGADOR')+'</span>'+(gm&&m.id!==me.id?'<button class="btn small danger" data-kick="'+$esc(m.id)+'">Remover participante</button>':'')+'</div><h3>'+$esc(m.name)+'</h3></article>').join('')+'</div><div class="sectiontitle">Agentes da campanha</div><div class="toolbar"><button id="attachSheet" class="btn primary">＋ Adicionar uma das minhas fichas</button></div><div class="cards">'+(agentCards||'<div class="empty">Nenhum agente foi adicionado à campanha.</div>')+'</div>'}
function renderSheet(){let canEdit=sheet.ownerId===me.id||(campaignFrom&&campaign?.campaign.role==='gm'),owner=sheet.ownerId===me.id;return '<div class="eyebrow">Ficha de personagem'+(campaignFrom?' · campanha':' · pessoal')+'</div><div class="sheet-hero '+themeClass(sheet)+'"><div class="sheet-portrait">'+(sheet.portrait?'<img src="'+$esc(sheet.portrait)+'" alt="Retrato de '+$esc(sheet.name)+'">':'<img src="'+ART_POOL[Math.abs(String(sheet.id||'').split('').reduce((a,c)=>a+c.charCodeAt(0),0))%ART_POOL.length]+'" alt="">')+'</div><div class="sheet-identity"><span class="tag">'+$esc(sheet.className)+'</span><h1>'+$esc(sheet.name)+'</h1><p>'+$esc(sheet.archetype)+' · '+$esc(sheet.function)+' · nível '+$esc(sheet.level)+'</p><div class="hero-meters">'+[['Saúde',sheet.healthNow,sheet.healthMax,'health'],['Resistência',sheet.resNow,sheet.resMax,'resist'],['Stamina',sheet.staminaNow,sheet.staminaMax,'stamina']].map(([n,v,m,k])=>'<div class="hero-meter '+k+'"><small>'+n+'</small><strong>'+$esc(v||0)+' <i>/ '+$esc(m||0)+'</i></strong><span><i style="--fill:'+Math.min(100,(Number(v)||0)/(Number(m)||1)*100)+'%"></i></span></div>').join('')+'</div></div><div class="hero-actions"><button class="btn" id="backSheets">← '+(campaignFrom?'Campanha':'Fichas')+'</button> '+(canEdit?'<button class="btn" id="editSheet">Editar</button>':'')+' '+(owner?'<button class="btn danger" id="deleteSheet">Excluir</button>':'')+'</div></div>'+sheetTab()+(specialTab==='overview'?overview():specialTab==='inventory'?inventoryView():specialTab==='abilities'?abilitiesView():specialView())}
let campaignFrom=false;bindDelegated();
async function init(){try{let x=await api('me');me=x.user;if(me)await afterLogin();else render()}catch{render()}}
init();
</script></body></html>
